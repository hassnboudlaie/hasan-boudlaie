{t:'هوش مصنوعی در کار روزمره',en:'AI Literacy & Responsible Use',min:40,goal:'شناخت توانایی‌ها، محدودیت‌ها و استفاده ایمن از مدل‌های مولد.',concept:'هوش مصنوعی مولد متن، جدول، ایده و پیش‌نویس می‌سازد؛ اما خروجی آن لزوماً درست نیست. از آن به‌عنوان دستیار استفاده کنید، نه مرجع نهایی یا صاحب اختیار تصمیم. اطلاعات محرمانه را پیش از ورود حذف کنید.',example:'یک درخواست قیمت بنتونیت را با نام مشتری، قیمت قراردادی و مشخصات بانکی حذف‌شده به متن تمرینی تبدیل کنید.',prompt:'در نقش دستیار اداری یک شرکت معدنی، متن زیر را فقط بر اساس داده‌های ارائه‌شده خلاصه کن. اطلاعات ناموجود را حدس نزن. نتیجه را در سه بخش «واقعیت‌ها»، «ابهام‌ها» و «اقدام پیشنهادی» بنویس. متن: مشتری فرضی درخواست ۲۰ تن بنتونیت با تحویل در مقصد دارد؛ گرید هنوز مشخص نیست.',exercise:'یک کار تکراری در واحد خود انتخاب کنید. مشخص کنید چه اطلاعاتی مجاز است، چه چیزی باید حذف شود و چه کسی خروجی را تأیید می‌کند.',check:'کار مشخص است؛ اطلاعات حساس حذف شده؛ مسئول تأیید تعیین شده است.',answer:'مثلاً خلاصه استعلام خرید با داده فرضی؛ حذف نام طرف قرارداد و قیمت واقعی؛ تأیید توسط کارشناس مسئول.'},
{t:'پرامپت‌نویسی حرفه‌ای',en:'Prompt Engineering',min:60,goal:'نوشتن پرامپت قابل تکرار با نقش، زمینه، هدف، محدودیت و قالب خروجی.',concept:'چارچوب پنج‌جزئی: نقش + زمینه + وظیفه + محدودیت + قالب خروجی. برای اصلاح پاسخ، بازخورد مشخص بدهید: چه چیزی را حفظ کند، چه چیزی را تغییر دهد و کدام فرض را بررسی کند.',example:'درخواست مبهم «یه نامه بنویس» را به درخواست دقیق مکاتبه درباره استعلام گلوله فولادی تبدیل کنید.',prompt:'نقش: کارشناس بازرگانی شرکت معدنی. زمینه: مشتری فرضی برای گلوله فولادی آسیاب استعلام داده است. وظیفه: ایمیل فارسی حرفه‌ای برای تکمیل اطلاعات بنویس. محدودیت: قیمت، موجودی یا زمان تحویل را وعده نده. قالب: موضوع ایمیل + متن حداکثر ۱۲۰ کلمه + سه سؤال درباره قطر، تناژ و مقصد.',exercise:'یک پرامپت ضعیف از کار خود بسازید؛ آن را با پنج جزء بازنویسی کنید و یک دستور اصلاح خروجی هم اضافه کنید.',check:'پنج جزء، داده کافی، قالب روشن، منع حدس‌زدن و دستور اصلاح.',answer:'دستور اصلاح نمونه: متن را کوتاه‌تر کن؛ هیچ تعهد قیمتی اضافه نکن و سؤال‌های ضروری را حفظ کن.'},
{t:'مکاتبات، اسناد و گزارش‌ها',en:'Business Communication & Documents',min:50,goal:'تبدیل متن خام به خروجی قابل استفاده در مکاتبات و گزارش‌های حرفه‌ای.',concept:'برای خلاصه‌سازی اسناد، ابتدا نوع سند و مخاطب را تعیین کنید. اطلاعات قطعی را از پیشنهاد و ابهام جدا کنید. پیش از ارسال، لحن، اعداد، تعهدات و گیرنده را بازبینی کنید.',example:'تبدیل یادداشت جلسه فرضی هماهنگی کرمان و فردوس به صورت‌جلسه با اقدام، مسئول و موعد.',prompt:'یادداشت فرضی: بررسی موجودی بنتونیت تا سه‌شنبه با واحد فروش؛ کنترل مغایرت هزینه حمل با مالی؛ نیازسنجی آموزش کارشناس جدید با منابع انسانی. صورت‌جلسه‌ای شامل تصمیم، اقدام، مسئول و مهلت تهیه کن. برای موارد بدون موعد بنویس «تعیین نشده».',exercise:'یک یادداشت ساختگی سه‌خطی تهیه و با کمک AI به ایمیل یا گزارش یک‌صفحه‌ای تبدیل کنید. دو تغییر لازم قبل از ارسال را بنویسید.',check:'خروجی کوتاه و روشن، بدون افزودن تعهد، دارای مسئول یا علامت ابهام.',answer:'جدول اقدام‌ها با موعد سه‌شنبه فقط برای بررسی موجودی؛ سایر موعدها تعیین نشده.'},
{t:'تحلیل داده و اکسل با AI',en:'Data Analysis & Excel',min:60,goal:'تحلیل جدول، تولید فرمول و راستی‌آزمایی عددی با داده آموزشی.',concept:'ستون‌ها و واحد پول را تعریف کنید. AI می‌تواند فرمول پیشنهاد دهد و الگوها را توضیح دهد، اما جمع‌ها و درصدها را مستقل در اکسل کنترل کنید. داده خالی را صفر تلقی نکنید.',example:'داده فرضی فروش بنتونیت: ماه اول ۱۲۰ تن با نرخ ۴ میلیون تومان؛ ماه دوم ۱۰۰ تن با نرخ ۴٫۵ میلیون تومان. درآمدها ۴۸۰ و ۴۵۰ میلیون تومان‌اند؛ تغییر درآمد منفی ۶٫۲۵٪ است.',prompt:'جدول فرضی: ماه اول، ۱۲۰ تن، نرخ هر تن ۴ میلیون تومان؛ ماه دوم، ۱۰۰ تن، نرخ هر تن ۴.۵ میلیون تومان. درآمد هر ماه و درصد تغییر درآمد را محاسبه کن، فرمول اکسل با فرض ستون B مقدار و C نرخ ارائه بده، سپس تفاوت تغییر مقدار و نرخ را توضیح بده. فرض‌ها را مشخص کن.',exercise:'داده CSV تمرینی واحد خود را دانلود کنید. یک سؤال تحلیلی از AI بپرسید، یک فرمول اکسل درخواست کنید و حداقل یک عدد را دستی کنترل کنید.',check:'فرمول، واحد، نتیجه کنترل‌شده و یک محدودیت تحلیل ثبت شده است.',answer:'درآمد = مقدار × نرخ؛ درصد تغییر = (جدید − قبلی) / قبلی. از دو نقطه داده نمی‌توان روند بلندمدت نتیجه گرفت.'},
{t:'آزمایشگاه تخصصی واحدها',en:'Functional AI Lab',min:90,goal:'حل یک مسئله شغلی با داده شبیه‌سازی‌شده و تولید خروجی حرفه‌ای.',concept:'هر واحد یک کیس متناسب با فرایند کاری خود دارد. ابتدا مسئله را روشن کنید، سپس با AI پیش‌نویس بسازید؛ نتیجه را با معیارهای شغلی ارزیابی و اصلاح کنید.',example:'بازرگانی: مقایسه پیشنهاد تأمین؛ مالی: تحلیل انحراف بودجه؛ منابع انسانی: برنامه آموزش و شایستگی.',prompt:'',exercise:'کیس واحد خود را اجرا کنید و خروجی نهایی، یک ریسک و یک اقدام کنترلی را ثبت کنید.',check:'مسئله روشن، خروجی قابل استفاده، داده درست و کنترل انسانی.',answer:'نمونه پاسخ تخصصی در کارت کیس واحد ارائه شده است.'},

const icons=['🧠','🎯','✍️','📊','⚙️','🏆'];const trackIcons=['🤝','📈','👥'];const trackPhotos=['https://arzeshafarinco.com/wp-content/uploads/2024/02/IMG_5711-2-copy41212-scaled-copy.webp','https://arzeshafarinco.com/wp-content/uploads/2024/02/IMG_5711-2-copy4234234-scaled-copy.webp','https://arzeshafarinco.com/wp-content/uploads/2023/09/IMG_5711-2-copy412-scaled.jpg'];function openTrack(i){go('entry');const el=document.querySelectorAll('input[name=role]')[i];if(el)el.checked=true;}function showModule(i){go('plan');const d=document.getElementById('outline-'+i);if(d){d.open=true;d.scrollIntoView({block:'center',behavior:'smooth'})}}function home(){return `<div class="hero"><div class="eyebrow">AMMICO / AI LEARNING LAB · نسخه پیشنهادی</div><h1>هوش مصنوعی؛<br><em>از معدن تا میز کار</em></h1><p>کارگاه عملی اختصاصی کارشناسان ارزش‌آفرین؛ از استعلام و گزارش تا تحلیل داده و حل مسائل واقعی محیط کار.</p><div class="actions"><button class="primary" onclick="go('entry')">🚀 ورود به دوره ←</button><button class="secondary" onclick="go('plan')">📋 طرح درس و پیشنهاد آموزشی</button></div><span class="hero-caption">خط تولید گلوله فولادی · مجتمع کرمان</span></div><div class="stats"><div class="stat"><span class="stat-ico">⏱️</span><strong>۶ ساعت</strong><small>کارگاه عملی هر گروه</small></div><div class="stat"><span class="stat-ico">👥</span><strong>۲ گروه</strong><small>۱۲ ساعت آموزش برنامه‌ریزی‌شده</small></div><div class="stat"><span class="stat-ico">🎯</span><strong>۳ مسیر</strong><small>متناسب با واحد شغلی</small></div></div><div class="sectionhead"><h2>مسیر تخصصی شما</h2><p>برای شروع روی کارت واحد خود کلیک کنید.</p></div><div class="grid" style="margin-top:15px">${roles.map((r,i)=>`<button class="track" onclick="openTrack(${i})"><img class="track-photo" src="${trackPhotos[i]}" alt="" loading="lazy"><span class="track-body"><span class="track-icon" aria-hidden="true">${trackIcons[i]}</span><strong>${r}</strong><small>${['استعلام، مکاتبات تجاری و مقایسه تأمین‌کنندگان','تحلیل هزینه، انحراف بودجه و گزارش مدیریتی','نیازسنجی آموزش، شایستگی و ارتباطات کارکنان'][i]}</small><span class="track-cta">انتخاب مسیر ←</span></span></button>`).join('')}</div><div class="sectionhead"><h2>نقشه راه یادگیری</h2><p>۶ ماژول؛ برای پیش‌نمایش هر ماژول کلیک کنید.</p></div><div class="path-grid" style="margin-top:15px">${modules.map((m,i)=>`<button class="path-card" onclick="showModule(${i})"><span class="stepicon" aria-hidden="true">${icons[i]}</span><span><strong>${fa(i+1)}. ${m.t}</strong><small dir="ltr">${m.en}</small><span class="time-tag">${fa(m.min)} دقیقه · مشاهده ←</span></span></button>`).join('')}</div><section class="company-band"><span class="demo-tag">BUSINESS CONTEXT</span><h2>ریشه در صنعت ارزش‌آفرین</h2><p>فلوئوریت، بنتونیت، گلوله فولادی، پوشاک صنعتی و روکش تایرهای سنگین معدنی؛ تمرین‌ها متناسب با همین بستر طراحی شده‌اند.</p><div class="sitegrid"><figure><img src="https://arzeshafarinco.com/wp-content/uploads/2022/10/IMG_E1955-copy-%DB%B2-scaled-e1721800138243.jpg" alt="مجتمع صنعتی کرمان" loading="lazy"><figcaption>🏭 مجتمع صنعتی کرمان</figcaption></figure><figure><img src="https://arzeshafarinco.com/wp-content/uploads/2022/10/%D9%81%D8%B1%D8%AF%D9%88%D8%B3-1.jpg" alt="مجتمع صنعتی فردوس" loading="lazy"><figcaption>⛏️ مجتمع صنعتی فردوس</figcaption></figure></div><p class="small" style="margin-top:12px">تصاویر: <a href="https://arzeshafarinco.com/" target="_blank" rel="noopener">وب‌سایت رسمی شرکت</a> · داده‌های تمرینی شبیه‌سازی‌شده‌اند.</p></section>`}
function plan(){return `<div class="banner"><div><span class="pill">COURSE OUTLINE</span><h2>📋 طرح درس کارگاه شش‌ساعته</h2></div><div class="actions"><button class="secondary" onclick="window.print()">چاپ / PDF</button><button onclick="go('entry')">ورود به دوره</button></div></div><div class="card"><h3>مشخصات و اهداف یادگیری</h3><p>مخاطبان: کارشناسان بازرگانی، مالی و منابع انسانی | گروه ۱ و گروه ۲، هر گروه ۳۶۰ دقیقه شامل ۲۰ دقیقه استراحت؛ مجموع دو گروه ۱۲ ساعت | سطح مقدماتی تا کاربردی | پیش‌نیاز: کار با مرورگر و اکسل در حد پایه.</p><p>در پایان، فراگیر می‌تواند پرامپت هدفمند بنویسد، مکاتبه و گزارش تهیه کند، داده تمرینی تحلیل و کنترل کند، یک مسئله تخصصی حل کند و برنامه استفاده مسئولانه از AI در کار خود تدوین کند.</p><p>روش: نمایش زنده مدرس، تمرین فردی، بازخورد، کیس تخصصی و آزمون پایانی. ابزار: مرورگر، ابزار AI مجاز سازمان و اکسل یا ابزار مشابه.</p></div><h2>💼 پیشنهاد حق‌التدریس</h2><div class="card fee-card"><p>مدرس: دکتر حسن بودلایی</p><p>دو گروه × ۶ ساعت = ۱۲ ساعت آموزش برنامه‌ریزی‌شده</p><p>حق‌التدریس هر ساعت: ۱۰ میلیون تومان</p><p>حق‌التدریس هر گروه: ۶۰ میلیون تومان</p><p><strong>جمع حق‌التدریس پیشنهادی: ۱۲۰ میلیون تومان</strong></p></div><h2>🗓️ برنامه زمانی و پیش‌نمایش ماژول‌ها</h2><div class="timeline">${agenda.map((a,j)=>{const i=j<3?j:j===3?-1:j-1;return `<div class="time"><b>${fa(a[0])}–${fa(a[1])} دقیقه</b><div><strong>${i<0?"☕":icons[i]} ${a[2]}</strong><p class="muted small">${a[3]}</p>${i<0?"":`<details id="outline-${i}"><summary>اهداف و نمونه تمرین</summary><p>${modules[i].goal}</p><p>${modules[i].exercise}</p></details>`}</div></div>`}).join('')}</div><h2>سنجش یادگیری و ملاحظات اجرا</h2><div class="card"><p>آزمون شش‌سؤالی با بازخورد و امتیاز؛ تمرین‌های عملی با چک‌لیست؛ برنامه اقدام هفت‌روزه. معیار پیشنهادی مدرس: کامل بودن پرامپت، صحت محتوا، قابلیت استفاده و کنترل ریسک؛ هر معیار از صفر تا پنج.</p><p>داده‌های شخصی، اطلاعات مالی واقعی، قراردادها و اطلاعات محرمانه در ابزارهای عمومی وارد نشوند. سیاست مصوب شرکت مقدم است. دو گروه محتوای مشترک دارند و ثبت محلی آن‌ها مستقل است.</p><p class="small muted">منابع زمینه سازمانی: <a href="https://arzeshafarinco.com/" target="_blank" rel="noopener">وب‌سایت رسمی</a> و <a href="https://arzeshafarinco.com/fa/بازرگانی/" target="_blank" rel="noopener">صفحه بازرگانی</a>.</p></div>`}
function entry(){return `<div class="card form"><span class="pill">LEARNER ACCESS</span><h2>🚀 ورود به دوره</h2><p class="muted">گروه و واحد خود را انتخاب کنید. نام یا شناسه آموزشی را وارد کنید؛ اطلاعات فقط در همین مرورگر ذخیره می‌شود.</p><form id="entry"><label class="field"><span>نام یا شناسه آموزشی</span><input name="name" maxlength="80" required placeholder="مثلاً کارشناس ۰۱" autocomplete="off"></label><div class="field"><span>گروه آموزشی</span><div class="pick-grid">${[1,2].map(g=>`<label class="pick"><input type="radio" name="group" value="${g}" required><span class="pick-icon">👥</span><b>گروه ${fa(g)}</b></label>`).join("")}</div></div><div class="field"><span>واحد سازمانی</span><div class="pick-grid roles">${roles.map((r,i)=>`<label class="pick"><input type="radio" name="role" value="${r}" required><span class="pick-icon">${trackIcons[i]}</span><b>${r}</b></label>`).join("")}</div></div><button type="submit" style="width:100%">شروع / ادامه یادگیری</button></form><p class="small muted">این ورود آموزشی است، نه احراز هویت سازمانی. برای بازگشت، همان شناسه، گروه و واحد را وارد کنید.</p>${get()?`<button class="quiet" onclick="idx=get().last||0;go('course')">ادامه آخرین مسیر: ${esc(get().name)}</button>`:''}</div>`}
function download(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function copy(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('پرامپت کپی شد')).catch(()=>fallback(t));else fallback(t)}function fallback(t){const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();try{if(document.execCommand('copy'))toast('پرامپت کپی شد');else toast('متن را به‌صورت دستی کپی کنید.')}catch{toast('متن را به‌صورت دستی کپی کنید.')}el.remove()}
function move(i){idx=i;get().last=i;save();go('course')}
function storeAnswer(v){get().answers[idx]=v;save()}
function complete(){const p=get();const val=($('#work')?.value||'').trim();if(!val){toast('ابتدا پاسخ تمرین را ثبت کنید.');$('#work')?.focus();return}p.answers[idx]=val;if(!p.done.includes(idx))p.done.push(idx);save();if(idx<5)move(idx+1);else move(6)}
function caseHTML(c){return `<div class="section"><span class="pill">CASE LAB • ${esc(get().role)}</span><h3>${c.title}</h3><div class="note">${c.data}</div><div class="prompt">${c.prompt}</div><div class="actions" style="margin-top:10px"><button class="quiet" id="casecopy">کپی پرامپت کیس</button><button class="secondary" id="csv">دریافت داده تمرینی CSV</button></div><details><summary>مشاهده راهنمای پاسخ پس از تلاش</summary>${c.answer}</details></div>`}
function course(){const p=get(),c=cases[p.role],n=p.done.length;let body='';if(idx<6){const m=modules[idx];body=`<div class="banner"><span class="pill">ماژول ${fa(idx+1)} از ۶</span><span class="muted small">${fa(m.min)} دقیقه</span></div><h1>${icons[idx]} ${m.t}</h1><span class="muted" dir="ltr">${m.en}</span><div class="note"><strong>هدف:</strong> ${m.goal}</div><h3>💡 یادگیری</h3><p>${m.concept}</p><div class="section"><h3>🏭 نمونه مرتبط با آمیکو</h3><p>${m.example}</p>${m.prompt?`<div class="prompt">${m.prompt}</div><button class="quiet" id="copy" style="margin-top:10px">کپی پرامپت</button>`:''}</div>${idx===4?caseHTML(c):idx===3?`<div class="actions" style="margin-top:12px"><button class="secondary" id="csv">دریافت داده تمرینی واحد شما</button></div>`:''}<div class="section"><h3>📝 تمرین عملی شما</h3><p>${m.exercise}</p><p class="small muted">معیار خودارزیابی: ${m.check}</p><label class="field"><span>پاسخ / خروجی تمرین</span><textarea id="work" placeholder="پرامپت، پاسخ اصلاح‌شده یا نتیجه خود را اینجا ثبت کنید...">${esc(p.answers[idx]||'')}</textarea></label><details><summary>نمونه پاسخ و راهنما</summary>${m.answer}</details><div class="linkrow small"><a href="https://chatgpt.com/" target="_blank" rel="noopener">باز کردن ChatGPT</a><a href="https://copilot.microsoft.com/" target="_blank" rel="noopener">باز کردن Copilot</a></div><p class="small muted">در صورت مجاز بودن ابزار طبق سیاست شرکت؛ هیچ داده‌ای از این اپ خودکار به ابزار AI ارسال نمی‌شود.</p><div class="actions"><button class="primary" onclick="complete()">ثبت تمرین و ادامه</button>${idx>0?`<button class="secondary" onclick="move(${idx-1})">ماژول قبلی</button>`:''}</div></div>`}else{body=`<span class="pill">FINAL ASSESSMENT</span><h1>آزمون پایانی و کارنامه</h1><p>هر سؤال یک پاسخ صحیح دارد. آزمون برای یادگیری قابل تکرار است.</p><form id="quiz">${quiz.map((q,i)=>`<div class="section"><strong>${fa(i+1)}. ${q[0]}</strong>${q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${p.quiz?.answers?.[i]===j?'checked':''} required>${a}</label>`).join('')}</div>`).join('')}<div class="actions" style="margin-top:20px"><button>ثبت و مشاهده نتیجه</button></div></form>${p.quiz?`<div class="results" style="margin-top:18px"><h3>نتیجه: ${fa(p.quiz.score)} از ${fa(quiz.length)}</h3>${quiz.map((q,i)=>`<p class="small">${p.quiz.answers[i]===q[2]?'✓':'✗'} سؤال ${fa(i+1)}: ${q[1][q[2]]} — ${q[3]}</p>`).join('')}</div>`:''}<div class="section"><h3>پرونده یادگیری</h3><p>${fa(n)} از ۶ تمرین تکمیل شده است. فایل خروجی شامل تمرین‌ها و نتیجه آزمون است.</p><button class="secondary" onclick="exportProfile()">دانلود پرونده یادگیری</button></div>`}return `<div class="course"><aside class="sidebar"><div class="card" style="padding:15px"><strong>${esc(p.name)}</strong><div class="small muted">گروه ${fa(p.group)} • ${esc(p.role)}</div><div class="bar"><i style="width:${Math.round(n/6*100)}%"></i></div><div class="small muted">${fa(n)} از ۶ تمرین ثبت شده</div><div class="navlist" style="margin-top:10px">${modules.map((m,i)=>`<button class="navitem ${idx===i?'active':''} ${p.done.includes(i)?'done':''}" onclick="move(${i})"><span class="navicon" aria-hidden="true">${icons[i]}</span>${fa(i+1)}. ${m.t}</button>`).join('')}<button class="navitem ${idx===6?'active':''}" onclick="move(6)">🏆 آزمون و کارنامه</button></div><button class="secondary" style="width:100%;margin-top:10px" onclick="go('entry')">تغییر فراگیر / گروه</button></div></aside><article class="card lesson">${body}</article></div>`}
function exportProfile(){const p=get();const lines=['پرونده یادگیری | آمیکو','نام/شناسه: '+p.name,'گروه: '+p.group,'واحد: '+p.role,'تمرین‌های تکمیل‌شده: '+p.done.length+'/6',...modules.map((m,i)=>'\n'+(i+1)+'. '+m.t+'\n'+(p.answers[i]||'ثبت نشده')),'\nآزمون: '+(p.quiz?p.quiz.score+'/6':'ثبت نشده')];download('AMMICO-learning-record.txt','\ufeff'+lines.join('\n'))}
function render(){if(page==='course'&&!get())page='entry';$('#app').innerHTML=({home,plan,entry,course}[page]||home)()+`<footer class="foot">AMMICO AI Learning Lab • نسخه آموزشی پیشنهادی • داده‌های تمرین شبیه‌سازی‌شده</footer>`;if(page==='entry')$('#entry').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),group=f.get('group'),role=f.get('role');if(!name){toast('نام یا شناسه را وارد کنید.');return}const id=JSON.stringify([name,group,role]);if(!db.profiles[id])db.profiles[id]={name,group,role,answers:{},done:[],last:0};db.active=id;save();idx=get().last||0;go('course')});if(page==='course'){const p=get(),c=cases[p.role];$('#work')?.addEventListener('input',e=>storeAnswer(e.target.value));$('#copy')?.addEventListener('click',()=>copy(modules[idx].prompt));$('#casecopy')?.addEventListener('click',()=>copy(c.prompt));$('#csv')?.addEventListener('click',()=>download('AMMICO-practice.csv','\ufeff'+c.csv,'text/csv;charset=utf-8'));$('#quiz')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),answers=quiz.map((q,i)=>Number(f.get('q'+i)));p.quiz={answers,score:answers.filter((a,i)=>a===quiz[i][2]).length};save();render();$('.results')?.scrollIntoView({behavior:'smooth'})})}}render();
</script></body></html>
