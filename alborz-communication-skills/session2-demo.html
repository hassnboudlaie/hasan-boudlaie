if(i===4)body=`<div class="contentcard"><h2>متن کامل نقش‌آفرینی</h2><p>۲۰ نوبت گفت‌وگوی حرفه‌ای؛ از هر دو نفر بخواهید نقش خود را با لحن، مکث و زبان بدن اجرا کنند. پس از نوبت‌های ۶، ۱۲ و ۱۶ تحلیل انجام دهید.</p><div class="scriptbar"><button class="tab '+(scriptFilter==='all'?'active':'')+'" onclick="filterScript(\'all\')">هر دو نقش</button><button class="tab '+(scriptFilter==='رئیس شعبه'?'active':'')+'" onclick="filterScript(\'رئیس شعبه\')">رئیس شعبه</button><button class="tab '+(scriptFilter==='مشتری'?'active':'')+'" onclick="filterScript(\'مشتری\')">مشتری</button><button class="tab" onclick="toggleDirections()">راهنمای اجرا: '+(showStageDirections?'روشن':'خاموش')+'</button><button class="tab" onclick="copyScript()">کپی متن کامل</button></div>${D.map((t,j)=>{const chunks=t[1].match(/^\[[^\]]+\]\s*/);let v=t[1];return '<div class="speech '+(t[0]==='رئیس شعبه'?'manager':'')+' '+(scriptFilter!=='all'&&scriptFilter!==t[0]?'hidden':'')+'"><small>'+(j+1)+' · '+h(t[0])+'</small><p>'+(showStageDirections?h(v):h(v.replace(/^\[[^\]]+\]\s*/,'')))+'</p></div>';}).join('')}<details class="accordion"><summary>نقاط توقف و پرسش مدرس</summary><div><p><b>پس از نوبت ۶:</b> تفاوت بازتاب نگرانی و پذیرش خطای سازمان چیست؟</p><p><b>پس از نوبت ۱۲:</b> کدام جمله دفاع‌گرایی را کاهش داد؟</p><p><b>پس از نوبت ۱۶:</b> آیا زبان بدن با جدیت پاسخ هماهنگ بود؟</p></div></details></div>`;
if(i===5)body=`<div class="contentcard"><h2>فرم مشاهده و بازخورد</h2><p>امتیازها برای یادگیری و بازخورد هستند، نه ارزیابی رسمی عملکرد. هر نمره باید با مثال رفتاری توضیح داده شود.</p><div class="observer">${O.map((o,j)=>'<div class="rubric"><b>'+h(o)+'</b><div class="scale">'+[1,2,3,4,5].map(n=>'<button class="'+(ratings[j]===n?'active':'')+'" onclick="rate('+j+','+n+')">'+n+'</button>').join('')+'</div></div>').join('')}</div><div class="summary"><b id="score">'+Object.values(ratings).reduce((a,b)=>a+b,0)+' / ۳۰</b><p>یک رفتار مثبت و یک رفتار قابل بهبود را با ذکر مثال بیان کنید.</p></div></div>`;
if(i===6)body=`<div class="contentcard"><h2>اجرای اصلاح‌شده بدون متن</h2><p class="lead">این بار مخاطب با جمله متفاوتی آغاز می‌کند:</p><div class="casebox">«چند بار قول دادید؛ از کجا بدانم این بار واقعاً پیگیری می‌کنید؟»</div><div class="checks"><div class="checkitem">۱. نگرانی را به رسمیت بشناسید.</div><div class="checkitem">۲. مشکل واقعی را با سؤال روشن کنید.</div><div class="checkitem">۳. تعهد قابل پیگیری بدهید.</div><div class="checkitem">۴. نتیجه را بدون مجوز تضمین نکنید.</div></div><div class="prompt">پرسش پایانی مدرس: بین اجرای اول و دوم، کدام رفتار مشخص تغییر کرد؟</div></div>`;
if(i===7)body=`<div class="contentcard"><h2>نکات کلیدی یادگیری</h2><div class="checks">${["استقبال متناسب با وضعیت مخاطب","احترام به محدودیت زمانی","شنیدن پیش از دفاع","مرزبندی میان نگرانی و پذیرش تقصیر","خوانش زمینه‌مند زبان بدن","تعهد مسئولانه به پیگیری","هماهنگی کلام و لحن و چهره","تکرار رفتار پس از بازخورد"].map((x,j)=>'<div class="checkitem"><b>'+(j+1)+'. </b>'+x+'</div>').join('')}</div><label class="actionfield">در ملاقات بعدی کدام رفتار خود را تغییر می‌دهید؟<textarea id="action" placeholder="یک رفتار مشخص، قابل مشاهده و قابل تمرین بنویسید..."></textarea></label><button class="cta green" onclick="copyAction()">کپی برنامه اقدام</button></div>`;
return '<section class="single-stage">'+head+body+footerNav("go('tech')",i<7?"go('stage',"+(i+1)+")":null,"فهرست ۸ مرحله",i<7?"مرحله بعد":"")+'</section>';}
function go(page,index){historyStack.push({...current});current={page,index};render();window.scrollTo({top:0,behavior:'instant'});}
function goSession(){historyStack=[];current={page:'home'};render();window.scrollTo({top:0,behavior:'instant'});}
function back(){if(historyStack.length){current=historyStack.pop();render();window.scrollTo({top:0,behavior:'instant'});}else if(current.page!=='home'){current={page:'home'};render();window.scrollTo({top:0,behavior:'instant'});}else{window.location.href='index.html';}}
function pick(i,k){answers[i]=k;render();const target=document.querySelectorAll('.poll')[i];if(target)target.scrollIntoView({block:'center'});}
function filterScript(f){scriptFilter=f;render();}
function toggleDirections(){showStageDirections=!showStageDirections;render();}
function rate(i,n){ratings[i]=n;render();}
async function copyScript(){let s=D.map((x,i)=>(i+1)+'. '+x[0]+'\n'+x[1]).join('\n\n');try{await navigator.clipboard.writeText(s);alert('متن گفت‌وگو کپی شد.')}catch(e){alert('کپی در این مرورگر ممکن نیست.');}}
async function copyAction(){let a=$('action')?.value||'';if(!a.trim()){alert('ابتدا برنامه اقدام را بنویسید.');return}try{await navigator.clipboard.writeText(a);alert('برنامه اقدام کپی شد.')}catch(e){alert('کپی در این مرورگر ممکن نیست.');}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
render();
</script></body></html>
