function s1MomentAnswer(btn,choice,key){
 const box=btn.closest(".s1-moment");
 const x=s1DayMoments[key];
 if(!box||!x||!Number.isInteger(choice)||!x.options[choice])return;
 const good=choice===x.correct;
 box.querySelectorAll("[data-s1-choice]").forEach(b=>{
   const selected=b===btn;
   b.classList.toggle("good",selected&&good);
   b.classList.toggle("bad",selected&&!good);
   b.setAttribute("aria-pressed",String(selected));
 });
 const fb=box.querySelector(".s1-moment-feedback");
 fb.className="s1-moment-feedback show "+(good?"good":"bad");
 fb.textContent=(good?"✅ تصمیم قابل‌دفاع — ":"⚠️ این تصمیم یک محدودیت مهم دارد — ")+(x.feedbackByChoice?.[choice]||x.feedback);
 const reaction=box.querySelector(".s1-moment-reaction");if(reaction && x.reactions){reaction.textContent="💬 پاسخ احتمالی مخاطب: "+x.reactions[choice];reaction.hidden=false;}
 box.querySelector(".s1-moment-diagnosis").hidden=false;
 box.querySelector(".s1-revealed-technique").hidden=false;
 box.querySelector("[data-s1-restart]").hidden=false;
}

   b.setAttribute("aria-pressed","false");
 });
 const fb=box.querySelector(".s1-moment-feedback");

const s1PracticalTechniques=[{"id":"recognition","icon":"👋","name":"آغاز حرفه‌ای ۱۵ ثانیه‌ای","en":"به‌رسمیت‌شناختن Opening","source":"راهنمای گوش‌دادن فعال مرکز رهبری خلاق؛ اقتباس برای شعبه","url":"https://www.ccl.org/articles/leading-effectively-articles/coaching-others-use-active-listening-skills/","definition":"اول حضور فرد را به رسمیت بشناسید؛ سپس زمان یا مسیر پاسخ‌گویی را روشن کنید.","scene":"ساعت ۹:۴۵ است. رئیس شعبه تلفنی با مسئول رسیدگی به یک پرونده محرمانه صحبت می‌کند. مشتری که از سه بار مراجعه قبلی ناراضی است بدون وقت وارد می‌شود و می‌گوید «باز هم کسی جوابم را نمی‌دهد». دو کارمند دیگر در پیشخوان حضور دارند.","options":["به تماس طولانی بدون هیچ نشانه‌ای ادامه می‌دهم و پس از پایان، عذرخواهی می‌کنم.","بدون قطع ناگهانی تماس، با سلام و اشاره حضور او را تأیید می‌کنم؛ از همکارم می‌خواهم او را راهنمایی و زمان رسیدگی را مشخص کند و پس از تماس، شخصاً وضعیت را پیگیری می‌کنم.","در همان تماس، به طرف مقابل اطلاع می‌دهم چند لحظه منتظر باشد؛ مستقیم به مشتری می‌گویم پرونده‌اش را الان بررسی می‌کنم، بدون اینکه بدانم چه مدارکی موجود است."],"correct":1,"analysis":"به‌رسمیت‌شناختن حضور مخاطب نیازمند رهاکردن مسئولیت قبلی نیست؛ هماهنگی محترمانه و تعیین مسیر رسیدگی، هر دو طرف را حفظ می‌کند.","script":"«سلام، خوش آمدید. حضورتان را متوجه شدم؛ همکارم الان موضوع و نوبت رسیدگی را مشخص می‌کند.»","practice":"یک آغاز گفت‌وگو پانزده‌ثانیه‌ای برای ورود هم‌زمان مشتری و نماینده تمرین کنید.","feedbackByChoice":["ادامه‌دادن کار قبلی منطقی است اما بدون اطلاع‌دادن به مراجعه‌کننده، سابقه بی‌پاسخ‌ماندن او تشدید می‌شود.","پاسخ، دو تعهد هم‌زمان را مدیریت می‌کند: محرمانگی تماس جاری و دیده‌شدن مشتری. زمان و مسئول رسیدگی نیز روشن می‌شود.","مکث محترمانه در تماس ممکن است منطقی باشد؛ اما وعده بررسی فوری قبل از شناخت پرونده و قطع جریان گفت‌وگوی تخصصی می‌تواند هر دو مسئولیت را مختل کند."]},{"id":"pia","icon":"👂","name":"بازگویی، پرسش، تأیید","en":"Paraphrase · Inquire · Acknowledge","source":"برنامه مذاکره دانشگاه هاروارد، گوش‌دادن فعال","url":"https://www.pon.harvard.edu/daily/negotiation-skills-daily/listening-skills-for-maximum-success/","definition":"پیش از پاسخ فنی، برداشت خود را از مسئله بازگو کنید، ابهام را بپرسید و نگرانی مخاطب را به رسمیت بشناسید.","scene":"یک شرکت تولیدی ۲۴ روز پس از اعلام خسارت تجهیزات منتظر نتیجه است. مدیر مالی می‌گوید کارشناس شعبه دو هفته پیش مدارک را کامل اعلام کرد، اما دیروز واحد تخصصی سند تازه‌ای خواسته است. امروز برای گزارش به مدیرعامل شرکت زمان کمی دارد؛ رئیس شعبه اختیار تأیید نهایی خسارت را ندارد.","options":["«حق دارید از این رفت‌وبرگشت خسته شده باشید. اجازه بدهید مراحل بررسی خسارت را از ابتدا توضیح دهم تا علت درخواست مدارک تازه روشن شود.»","«اختلاف پاسخ‌ها را ثبت می‌کنم. برای اینکه امروز دست‌خالی برنگردید، تا پایان وقت اداری نتیجه نهایی را از ستاد می‌گیرم و کتبی اعلام می‌کنم.»","«پس مسئله فقط نتیجه خسارت نیست؛ اطلاعات متفاوتی درباره تکمیل مدارک گرفته‌اید و نمی‌دانید کدام معتبر است. درست فهمیدم؟ آخرین پیام مکتوب را چه زمانی گرفته‌اید؟ بیایید نخست این تناقض را مستند روشن کنیم.»"],"correct":2,"analysis":"پاسخ سوم بدون پذیرش مسئولیتِ اثبات‌نشده یا وعده پرداخت، بازگویی، سؤال روشن‌کننده و توجه به نگرانی را ترکیب می‌کند.","script":"«اگر درست فهمیده باشم، مهم‌ترین نگرانی شما بلاتکلیفیِ زمان پاسخ است؛ درست است؟»","practice":"به‌جای توضیح مقررات، ۳۰ ثانیه فقط بازگویی و یک سؤال روشن‌کننده را تمرین کنید.","feedbackByChoice":["این پاسخ نارضایتی را می‌بیند، ولی هنوز دقیق نمی‌پرسد کدام دو پیام متناقض‌اند و کدام مستند معتبر است. شرح مراحل نباید جای بررسی تناقض را بگیرد.","پیگیری و ثبت اختلاف تصمیم خوبی است؛ اما قول گرفتن نتیجه نهایی از ستاد در همان روز، بدون اختیار یا تأیید مرجع مربوط، توقعی خارج از کنترل رئیس شعبه ایجاد می‌کند.","بازگویی دقیق نگرانی، پرسش مشخص و بررسی مستندات، مسیر روشن‌تری می‌سازد؛ همدلی با مشتری به معنی تأیید خودکار خسارت نیست."]},{"id":"warmcomp","icon":"⚖️","name":"گرمی همراه با شایستگی","en":"گرمی همراه با شایستگی","source":"فیسک و همکاران، پژوهش گرمی و شایستگی؛ کاربرد آموزشی","url":"https://pubmed.ncbi.nlm.nih.gov/12051578/","definition":"هم‌زمان احترام و توجه را نشان دهید و فرآیند، مسئول و گام بعدی را روشن کنید؛ خوش‌برخوردی به‌تنهایی کافی نیست.","scene":"مشتری سازمانی برای ارائه گزارش به هیئت‌مدیره مهلت دارد و می‌خواهد بداند پرونده خسارت پیش از ظهر به نتیجه می‌رسد یا نه. مکاتبات به ستاد ارسال شده ولی وضعیت تصمیم نهایی در شعبه مشخص نیست. مدیر نباید وعده خارج از اختیار بدهد.","options":["گزارش می‌کنم پرونده نزد واحد مربوط است و برای کاهش تنش از مشتری می‌خواهم منتظر اطلاع‌رسانی ستاد بماند.","نگرانی از موعد گزارش را می‌شنوم، وضعیت ثبت‌شده را بررسی می‌کنم و درباره زمانِ اعلام وضعیت بعدی با مشتری توافق می‌کنم؛ نتیجه پرداخت را قول نمی‌دهم.","«این پرونده قبلاً هم پیگیری شده و به نظر می‌رسد به نتیجه نزدیک است. بهتر است همین خبر را به هیئت‌مدیره منتقل کنید؛ ما هم پیگیر هستیم.»"],"correct":1,"analysis":"پاسخ دوم گرمی را با تسلط بر فرآیند و Ownership پیگیری پیوند می‌دهد؛ هیچ نتیجه‌ای خارج از اختیار وعده داده نشده است.","script":"«می‌دانم زمان برای شما مهم است؛ الان وضعیت روشن را می‌گویم و مسئولیت پیگیری مرحله بعد را مشخص می‌کنم.»","practice":"جمله «پرونده دست من نیست» را با یک نشانه گرمی و یک نشانه شایستگی بازنویسی کنید.","feedbackByChoice":["گفتن محل بررسی دقیق است، اما بدون تعهد پیگیری یا توضیح زمان پاسخ، مشتری را در بلاتکلیفی می‌گذارد.","این تصمیم نگرانی زمانی را جدی می‌گیرد و هم‌زمان دامنه اختیار رئیس شعبه را حفظ می‌کند.","اطلاع‌رسانی مثبت بدون مستند جدید ممکن است در گزارش رسمی مشتری به شکل تأیید ضمنی برداشت شود. آنچه واقعاً معلوم است باید از احتمال و انتظار جدا بماند."]},{"id":"interests","icon":"🔎","name":"نیاز پشت درخواست را کشف کنید","en":"Interests ≠ Positions","source":"برنامه مذاکره دانشگاه هاروارد، مذاکره اصولی","url":"https://www.pon.harvard.edu/daily/negotiation-skills-daily/what-is-negotiation/","definition":"خواسته ظاهری مخاطب را از نیاز واقعی او جدا کنید؛ سپس در چارچوب ضوابط گزینه بدهید.","scene":"نماینده باسابقه برای حفظ مشتری بزرگ صنعتی، خواستار صدور فوری پوشش پیش از تکمیل یک مدرک اساسی است. مهلت مناقصه ساعت ۱۶ پایان می‌یابد. هم‌زمان یادآوری می‌کند سال‌ها مشتری برای شعبه آورده است.","options":["با توجه به سابقه همکاری، موافقت می‌کنم پرونده را برای بررسی مقدماتی جلو ببریم و از نماینده می‌خواهم تکمیل مدرک را فردا پیگیری کند.","اعلام می‌کنم مدرک ضروری است و نمی‌توانم استثنا بدهم؛ برای جلوگیری از اتلاف وقت، نماینده را به واحد تخصصی معرفی می‌کنم.","می‌پرسم دقیقاً کدام مهلت و تعهد مشتری در خطر است؛ سپس امکان مسیرهای مجازِ تکمیل، ارجاع یا ارائه پاسخ مشروطِ دارای مجوز را بررسی می‌کنم."],"correct":2,"analysis":"به‌جای دوگانه «استثنا یا رد»، علت درخواست روشن می‌شود و راهکار همچنان در محدوده مقررات و اختیار رئیس شعبه باقی می‌ماند.","script":"«اگر امروز پاسخ نگیریم، دقیقاً چه تعهدی برای مشتری‌تان به خطر می‌افتد؟ ببینیم چه مسیر مجازی داریم.»","practice":"برای سه درخواست پرتکرار نمایندگان، نیاز پنهان و گزینه مجاز پاسخ را جدا بنویسید.","feedbackByChoice":["اگر «بررسی مقدماتی» در چارچوب مجاز تعریف نشده باشد، می‌تواند به وعده ضمنی صدور تعبیر شود. باید پیش از اقدام حدود اختیار و وضعیت سند روشن باشد.","ارجاع به واحد تخصصی بخشی از راه‌حل است، اما بدون روشن‌کردن تعهد زمانی مشتری و هماهنگی پیگیری، بار مسئله دوباره به نماینده منتقل می‌شود.","نیاز پنهان آشکار می‌شود و بدون وعده استثنا، گزینه‌های مطابق اختیار بررسی می‌گردند."]},{"id":"teachback","icon":"🔁","name":"بازگویی معکوس برای اطمینان از فهم","en":"بازگویی برای اطمینان از فهم","source":"آژانس پژوهش و کیفیت خدمات سلامت، بازگویی برای اطمینان از فهم؛ اقتباس میان‌رشته‌ای","url":"https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/teachback.html","definition":"از مخاطب بخواهید به زبان خود بگوید گام بعد چیست؛ با این هدف که وضوح توضیح خودتان را بسنجید، نه دانش او را.","scene":"مشتری برای تکمیل پرونده خسارت سه مدرک با منبع صدور متفاوت نیاز دارد. در پایان توضیح تلفنی می‌گوید «متوجه شدم»، اما در دو نوبت قبلی مدرک نامرتبط ارسال کرده و زمان او محدود است.","options":["بعد از توضیح می‌پرسم «متوجه شدید کدام سه مدرک لازم است؟» و وقتی مشتری می‌گوید بله، خلاصه را برایش می‌فرستم.","می‌گویم «برای اینکه مطمئن شوم توضیح من روشن بوده، لطفاً بگویید از این سه مدرک کدام را اول و از چه مسیری تهیه می‌کنید؟» سپس سوءتفاهم را اصلاح و خلاصه کتبی می‌فرستم.","چون اعلام کرده متوجه شده، فقط فهرست مدارک را برایش ارسال می‌کنم و پیگیری بیشتر را به مراجعه بعدی می‌سپارم."],"correct":1,"analysis":"بازگویی برای اطمینان از فهم بررسی کیفیت توضیح ارائه‌دهنده است. پرسش غیرتحقیرآمیز و بازگویی به زبان مخاطب می‌تواند سوءتفاهم را آشکار کند.","script":"«می‌خواهم مطمئن شوم توضیحم واضح بود؛ لطفاً بفرمایید امروز چه کاری انجام می‌دهید و بعد چه اتفاقی می‌افتد؟»","practice":"در توضیح یک فرایند ساده بیمه‌ای، یک سؤال بازگویی برای اطمینان از فهم غیرامتحانی طراحی کنید.","feedbackByChoice":["پرسش بله یا خیر معمولاً سوءبرداشت مشخص را آشکار نمی‌کند؛ این مشتری قبلاً دوبار مدرک نامرتبط فرستاده است. بهتر است بخواهید مرحله بعد را با زبان خودش توضیح دهد.","با زبان خود مشتری ابهام معلوم می‌شود؛ ارسال خلاصه کتبی هم خطر تکرار خطا را کم می‌کند.","ارسال فهرست مفید است، اما پس از دو بار ارسال مدرک اشتباه، فهم متقابل باید فعالانه بررسی شود."]},{"id":"sbi","icon":"🎯","name":"بازخورد مبتنی بر رفتار","en":"Situation · Behavior · Impact","source":"مرکز رهبری خلاق، بازخورد موقعیت، رفتار و اثر","url":"https://www.ccl.org/articles/leading-effectively-articles/sbi-feedback-model-a-quick-win-to-improve-talent-conversations-development/","definition":"موقعیت مشخص، رفتار قابل‌مشاهده و اثر آن را بگویید؛ از قضاوت شخصیت کارمند فاصله بگیرید.","scene":"در پیشخوان شلوغ شعبه، کارشناس برای سرعت کار شماره هویتی و جزئیات پرونده یک مشتری را با صدای بلند مطرح کرده است. مشتری اعتراض کرده و سایر کارکنان منتظر واکنش رئیس شعبه‌اند.","options":["برای جلوگیری از تکرار اشتباه، همان‌جا در حضور کارشناس و مشتری توضیح می‌دهم چه اطلاعاتی نباید با صدای بلند اعلام شوند و بعد گزارش واقعه را ثبت می‌کنم.","از مشتری بابت شیوه رسیدگی عذرخواهی مناسب می‌کنم و موضوع محرمانگی را فوراً ایمن می‌کنم؛ سپس در گفت‌وگوی خصوصی با کارشناس، زمان، رفتار و اثر را دقیق بررسی می‌کنم.","برای اینکه اعتبار همکار آسیب نبیند فقط بعداً یک پیام عمومی درباره رعایت محرمانگی می‌فرستم."],"correct":1,"analysis":"گفت‌وگوی خصوصی و توصیف موقعیت، رفتار و اثر، احتمال دفاعی‌شدن را کمتر می‌کند و به اصلاح مشخص رفتار راه می‌دهد.","script":"«در مراجعه امروز (موقعیت)، جزئیات پرونده در فضای عمومی بیان شد (رفتار) و محرمانگی به خطر افتاد (اثر). چه تغییری می‌دهیم؟»","practice":"یک بازخورد سرزنش‌آمیز را به سه جمله وضعیت، رفتار و اثر تبدیل کنید.","feedbackByChoice":["توقف افشای اطلاعات ضروری است؛ اما بازگویی جزئیات اتفاق در پیشخوان ممکن است محرمانگی را دوباره نقض کند. بازخورد فردی را خصوصی ارائه دهید.","ابتدا خطر جاری مهار می‌شود؛ سپس بازخورد مشخص و خصوصی، هم اصلاح فرایند و هم یادگیری همکار را ممکن می‌کند.","اطلاعیه عمومی به‌تنهایی مسئولیت رسیدگی به اتفاق مشخص و بررسی آسیب احتمالی را پوشش نمی‌دهد."]},{"id":"known","icon":"📋","name":"معلوم، نامعلوم، گام بعد","en":"Known · Unknown · Next Update","source":"راهنمای رسیدگی به شکایت بیمه‌ای و ارتباط شفاف در ابهام","url":"https://www.afca.org.au/members/news/turning-complaints-insights-guidance-for-insurers","definition":"مرز اطلاعات تأییدشده را از نامعلوم‌ها جدا کنید و مشخص کنید چه کسی و چه زمانی وضعیت را اعلام می‌کند.","scene":"شرکت بیمه‌گذار درخواست پاسخ کتبی درباره وضعیت خسارت دارد. مدیر مالی باید فردا به بانک گزارش بدهد. پرونده در مرحله ارزیابی تخصصی است، اطلاعات دو واحد با هم متفاوت است و رئیس شعبه اختیار تصویب پرداخت ندارد.","options":["بی‌اطلاعی از نتیجه نهایی را صریح می‌گویم و از مشتری می‌خواهم هفته بعد دوباره تماس بگیرد.","به مشتری می‌گویم «طبق روند فعلی احتمال دارد پاسخ نهایی فردا آماده شود» و همان احتمال را در پاسخ کتبی وضعیت نیز وارد می‌کنم.","فقط اطلاعات تأییدشده را می‌گویم، تناقض‌ها را روشن اعلام می‌کنم و زمان و مسیر مشخصی برای ارائه گزارشِ وضعیت بعدی تعیین می‌کنم؛ پرداخت را تضمین نمی‌کنم."],"correct":2,"analysis":"قول به‌روزرسانی قابل‌کنترل از وعده نتیجه خارج از اختیار بهتر است. شفافیت و پیگیری منظم از عوامل مهم کاهش ابهام در رسیدگی به شکایت‌های بیمه‌ای‌اند.","script":"«آنچه می‌دانیم این است... آنچه هنوز معلوم نیست این است... زمان اعلام وضعیت بعدی این است...»","practice":"برای یک پرونده معوق، پیام ۴۰ کلمه‌ایِ به‌روزرسانی بدون وعده غیرواقعی بنویسید.","feedbackByChoice":["صداقت در نامعلوم‌بودن درست است، اما سپردن تمام پیگیری به مشتری مشکل ارتباطی را حل نمی‌کند.","نوشتن حدس درباره زمان و نتیجه تصمیمِ تخصصی، می‌تواند در مکاتبه رسمی به تعهد تعبیر شود. گزارش وضعیتِ تأییدشده و موعد پیگیری امن‌تر است.","مرز میان واقعیت ثبت‌شده، پرسش باز و زمان پیگیری مشخص حفظ می‌شود؛ این تعهد در اختیار شعبه است."]},{"id":"etiquette","icon":"🤝","name":"تشریفات بر پایه موقعیت و محرمانگی","en":"Context-Sensitive Etiquette","source":"بسته «زبان بدن» و «مهارت‌های ارتباطی»؛ بازطراحی آموزشی","url":"","definition":"لحن، معرفی، تقدم رسیدگی، حریم شخصی و فاصله را بر اساس وضعیت فرد و حساسیت موضوع تنظیم کنید؛ از ژست‌ها درباره نیت افراد نتیجه قطعی نگیرید.","scene":"ساعت ۱۰، مدیر ستادی بدون اطلاع قبلی برای بازدید وارد شعبه می‌شود. هم‌زمان مراجعه‌کننده‌ای درباره خسارت مرتبط با فوت یکی از اعضای خانواده نیاز به صحبت محرمانه دارد. پیشخوان شلوغ است و اتاق جلسه هم اکنون اشغال شده است.","options":["برای اینکه مشتری حساس را بی‌جهت معطل نکنیم، از او می‌خواهم موضوع خسارت را خیلی خلاصه نزد پیشخوان بگوید و بعد اتاق مناسب فراهم می‌کنم.","مدیر ستادی را شخصاً همراهی می‌کنم و از مشتری می‌خواهم بدون برآورد زمان در سالن بماند.","از همکار برای استقبال و هماهنگی بازدید کمک می‌گیرم، برای مشتری محل یا کانال امن جایگزین و زمان روشن فراهم می‌کنم و اولویت‌ها را طبق فوریت و محرمانگی تقسیم می‌کنم."],"correct":2,"analysis":"تشریفات حرفه‌ای به معنی اولویت مطلق افراد صاحب‌سمت نیست؛ شأن مراجعه‌کننده، محرمانگی و مدیریت منصفانه انتظار باید هم‌زمان رعایت شوند.","script":"«خوش آمدید؛ همکارم هماهنگی بازدید را انجام می‌دهد. برای حفظ محرمانگی، موضوع شما را در فضای مناسب بررسی می‌کنیم.»","practice":"برای استقبال از مشتری آسیب‌دیده و مدیر ارشد، دو رفتار مشترک و دو رفتار متفاوت بنویسید.","feedbackByChoice":["پرسیدن موضوع حساس در پیشخوان ولو به‌صورت خلاصه ممکن است اطلاعات خصوصی را آشکار کند. ابتدا محل و حدود دسترسی امن تعیین شود.","احترام به مقام سازمانی جایگزین اطلاع‌رسانی و حق رسیدگی مشتری نمی‌شود.","تقسیم مسئولیت و مدیریت منابع محدود شعبه اجازه می‌دهد هر دو تعامل با احترام و محرمانگی پیش برود."]}];
const s1LowndesAdaptations=[{"id":"lowndes-5","icon":"👋","name":"چرخش کاملِ توجه به تازه‌وارد","en":"","bookIndex":5,"source":"برگرفته از تکنیک شماره 5 کتاب «چگونه با هر کسی صحبت کنیم» اثر لیل لوندز","url":"https://books.google.com/books/about/How_to_Talk_to_Anyone.html?id=wH43PObvfugC","definition":"موقع ورود شخص تازه، با جهت بدن و توجه کوتاه نشان دهید که حضورش برای شما مهم است؛ لازم نیست کار جاری را رها کنید.","scene":"رئیس شعبه در حال تأیید نکات یک پرونده حساس با کارشناس است. مدیر منابع انسانیِ شرکت بیمه‌گذار برای جلسه از پیش تعیین‌شده وارد می‌شود و دستیار شعبه هنوز سالن را آماده نکرده است.","options":["با نگاه کوتاه اعلام حضور می‌کنم، ولی بدون توضیح به صحبت کارشناسی ادامه می‌دهم.","با خوشامد کوتاه رو به میهمان، محل مناسب و زمان پایان بررسی را مشخص می‌کنم؛ بعد گفت‌وگوی محرمانه جاری را بدون افشای جزئیات جمع می‌کنم.","برای نشان‌دادن توجه به میهمان، گفت‌وگوی جاری با کارشناس را متوقف می‌کنم و به میهمان توضیح می‌دهم چرا هماهنگی داخلی طول کشیده است."],"correct":1,"analysis":"توجه غیرکلامی همراه با معرفی و مدیریت انتظار، احترام را منتقل می‌کند؛ اما نمایشی یا تحقیرآمیز نیست.","script":"«خوش آمدید، از حضورتان خوشحالم. این گفت‌وگو تا چند دقیقه دیگر تمام می‌شود؛ لطفاً بفرمایید بنشینید.»","practice":"یک ورود هم‌زمان دو مخاطب را شبیه‌سازی کنید و بدون قطع ناگهانی کار اول، به هر دو احترام بگذارید.","limit":"تماس چشمی و جهت بدن به فرهنگ، شرایط جسمی و آسایش مخاطب بستگی دارد؛ نباید به اجبار اجرا شود.","feedbackByChoice":["توجه لحظه‌ای خوب است، ولی نبود زمان و مسیر مشخص همچنان انتظار را مبهم می‌گذارد.","احترام به میهمان همراه با حفاظت از گفت‌وگوی تخصصی قبلی حفظ می‌شود.","توجه به تازه‌وارد خوب است، اما افشای روند یا جزئیات هماهنگی داخلی و رهاکردن کار تخصصی بدون جمع‌بندی، هزینه تازه‌ای ایجاد می‌کند."]},{"id":"lowndes-10","icon":"🎚️","name":"تنظیم آهنگ گفت‌وگو با شرایط مخاطب","en":"","bookIndex":10,"source":"برگرفته از تکنیک شماره 10 کتاب «چگونه با هر کسی صحبت کنیم» اثر لیل لوندز","url":"https://books.google.com/books/about/How_to_Talk_to_Anyone.html?id=wH43PObvfugC","definition":"قبل از ورود به گفت‌وگو، سرعت و رسمیت آن را با وضعیت هیجانی مخاطب هماهنگ کنید؛ تقلید مصنوعی از لحن و حالت او نکنید.","scene":"مشتری بیمه بدنه پس از حادثه و چند تماس ناموفق با اضطراب وارد اتاق شده؛ کارشناس می‌گوید بخش عمده مدارک رسیده اما درباره یک بند پوشش ابهام وجود دارد.","options":["برای کاستن از اضطراب، گفت‌وگو را با خوش‌بینی زیاد و چند جمله شوخی شروع می‌کنم.","لحن آرام و بدون شوخی تحمیلی انتخاب می‌کنم، اجازه می‌دهم نگرانی مشخص بیان شود و بعد با توضیح محدودیت فعلی و مسیر بررسی ادامه می‌دهم.","برای اینکه گفت‌وگو از کنترل خارج نشود، از همان ابتدا مراحل دقیق کارشناسی را با لحن رسمی و سرعت بالا توضیح می‌دهم."],"correct":1,"analysis":"تنظیم لحن با وضعیت فرد، شنیده‌شدن او را تسهیل می‌کند؛ تقلید هیجانی یا خوش‌بینی تحمیلی می‌تواند تنش را تشدید کند.","script":"«می‌بینم موضوع برایتان فوری و نگران‌کننده است؛ اول مسئله را دقیق بشنوم، بعد مسیر پیگیری را روشن کنیم.»","practice":"یک پیام واحد را برای مشتری مضطرب و مدیر ستادیِ عجول با دو لحن حرفه‌ای متفاوت بیان کنید.","limit":"این تکنیک به معنی تقلید مکانیکیِ چهره، صدا یا حرکات نیست.","feedbackByChoice":["تغییر اجباری حال‌وهوای فرد ممکن است نگرانی را کم‌اهمیت جلوه دهد.","آرامش و توجه واقعی، زمینه ارائه اطلاعات دقیق بدون وعده نادرست را فراهم می‌کند.","توضیح فنی ممکن است درست باشد، اما وقتی مشتری مضطرب است و هنوز نگرانی اصلی‌اش را نگفته، شروع با اطلاعات زیاد شنیدن و فهم را دشوار می‌کند."]},{"id":"lowndes-17","icon":"🪪","name":"معرفی هدفمندِ افراد","en":"","bookIndex":17,"source":"برگرفته از تکنیک شماره 17 کتاب «چگونه با هر کسی صحبت کنیم» اثر لیل لوندز","url":"https://books.google.com/books/about/How_to_Talk_to_Anyone.html?id=wH43PObvfugC","definition":"در معرفی دو نفر، علاوه بر نام و سمت، یک نقطه ارتباطیِ مرتبط و غیرمحرمانه بگویید تا گفت‌وگو آغاز شود.","scene":"جلسه تمدید قرارداد گروهی با حضور مدیر منابع انسانی، کارشناس صدور و مدیر شعبه آغاز شده است. قرارداد چند شرط تخصصی دارد و احتمالاً مشتری از نقش و اختیار افراد حاضر آگاه نیست.","options":["افراد را فقط با نام کوچک معرفی می‌کنم تا جلسه زودتر شروع شود.","نام و سمت هر دو نفر و نقششا function s1FocusAnswer(btn,choice){
 const zone=btn.closest(".s1-focus-case");if(!zone)return;
 zone.querySelectorAll(".s1-focus-options button").forEach(x=>x.classList.remove("good","bad"));
 const out=document.getElementById("s1-focus-feedback");
 const comments=[
  "این پاسخ از نظر حفظ ضابطه درست شروع می‌شود، اما تناقضِ پیام‌های قبلی را بررسی نمی‌کند؛ حدس‌زدن درباره عملکرد کارشناس نیز پیش از بررسی مستندات منصفانه نیست.",
  "این تصمیم قابل دفاع است؛ چون اختلاف اطلاعات را دقیق بازگو می‌کند، یک مدرک قابل بررسی می‌خواهد و به جای تضمین نتیجه خسارت، مسیر پیگیری را روشن می‌کند.",
  "همدلی مهم است، اما وعده «امروز به نتیجه می‌رسانم» خارج از اطلاعات و اختیار موجود است و اگر عملی نشود، بی‌اعتمادی را شدیدتر می‌کند."
 ];
 btn.classList.add(choice===1?"good":"bad");
 if(out){out.className="s1-focus-feedback visible "+(choice===1?"good":"bad");out.textContent=(choice===1?"✓ ":"↩ ")+comments[choice];}
}

function s1PracticalPick(btn,i,choice){
 const t=s1AllTechniques[i];if(!t)return;
 const card=btn.closest(".s1-tool-card");if(!card)return;
 card.querySelectorAll(".s1-tool-options button").forEach(b=>b.classList.remove("correct","incorrect"));
 const ok=choice===t.correct;btn.classList.add(ok?"correct":"incorrect");
 const fb=card.querySelector(".s1-tool-feedback");fb.className="s1-tool-feedback visible "+(ok?"correct":"incorrect");
 fb.textContent=(ok?"✓ انتخاب قابل دفاع. ":"↩ این پاسخ نیاز به اصلاح دارد. ")+(t.feedbackByChoice&&t.feedbackByChoice[choice]?t.feedbackByChoice[choice]:t.analysis);
}

function s1PresenceChoose(btn,index){
 const data=s1PresenceReplies[index], box=btn.closest(".s1-presence-lab");
 if(!data||!box)return;
 box.querySelectorAll("[data-s1-presence-choice]").forEach(b=>{b.classList.toggle("selected",b===btn);b.setAttribute("aria-pressed",String(b===btn))});
 box.querySelector("#s1-presence-reaction").textContent=data.reaction;
 box.querySelector("#s1-presence-insight").textContent=data.insight;
 box.querySelector("#s1-presence-better").textContent=data.better;
 box.querySelector("#s1-presence-outcome").hidden=false;
 const fb=box.querySelector("#s1-presence-follow-feedback");fb.hidden=true;fb.textContent="";
 box.querySelectorAll("[data-s1-presence-follow]").forEach(b=>b.classList.remove("selected"));
}
function s1PresenceFollow(btn,index){
 const box=btn.closest(".s1-presence-lab");if(!box)return;
 const feedback=[
 "ارجاع کاملِ بار پیگیری به مشتری، تعهد قبلی را بی‌اثر می‌کند. حتی وقتی تصمیمی نیامده است، شعبه باید مسیر و زمان پیگیری را روشن نگه دارد.",
 "این پاسخ «پاسخ نهایی نداریم» را از «بی‌خبری و بی‌مسئولیتی» جدا می‌کند. اقدام انجام‌شده، مالک پیگیری و زمان گزارش بعدی را دقیق ثبت کنید.",
 "آرامش کوتاه‌مدت با وعده بی‌پشتوانه می‌تواند به بی‌اعتمادی عمیق‌تر تبدیل شود. درباره زمان تصمیم فقط در صورت تأیید مرجع ذی‌صلاح قول بدهید."
 ];
 box.querySelectorAll("[data-s1-presence-follow]").forEach(b=>b.classList.toggle("selected",b===btn));
 const fb=box.querySelector("#s1-presence-follow-feedback");
 fb.hidden=false;fb.textContent=(index===1?"✅ تصمیم حرفه‌ای‌تر: ":"⚠️ نقطه قابل اصلاح: ")+feedback[index];
}

function scoreS1(){
 if(s1TestAnswers.some(x=>x==null)){alert("برای دیدن تحلیل شخصی، هر ۱۰ پرسش باید پاسخ داشته باشد.");return;}
 const avg=g=>s1Questions.reduce((sum,q,i)=>sum+(q.d===g?s1TestAnswers[i]:0),0)/5;
 const warmth=avg("w"),follow=avg("c");
 const score=v=>v.toLocaleString("fa-IR",{minimumFractionDigits:1,maximumFractionDigits:1});
 const wEl=document.getElementById("s1-wscore"),cEl=document.getElementById("s1-cscore");
 if(!wEl||!cEl)return;
 wEl.textContent=score(warmth);cEl.textContent=score(follow);
 const dot=document.getElementById("s1-dot");
 if(dot){dot.style.left=((follow-1)/4*90+4)+"%";dot.style.bottom=((warmth-1)/4*90+4)+"%";}
 const low=s1TestAnswers.map((v,i)=>({v,i,info:s1ActionCatalog[i]})).sort((a,b)=>a.v-b.v||a.i-b.i);
 const main=low.slice(0,2);const high=[...low].reverse().slice(0,2);
 const isOther=s1TestTarget!=="خودم به‌عنوان رئیس شعبه";
 const esc=s1TechEscape;
 const label=(warmth>=3.5&&follow>=3.5)?"نشانه‌های گرمی و شایستگی هر دو بیشتر گزارش شده‌اند":warmth<3.5&&follow>=3.5?"نشانه‌های شایستگی قوی‌تر از گرمی گزارش شده‌اند":warmth>=3.5&&follow<3.5?"نشانه‌های گرمی قوی‌تر از شایستگی گزارش شده‌اند":"نشانه‌های گرمی و شایستگی هر دو نیازمند تمرین بیشترند";
 const base='<div class="s1-result-lead"><h3>الگوی گزارش‌شده شما</h3><p>'+label+'</p><small>این نمودار فقط خودگزارشی رفتارها در دو گروه پنج‌سؤالی را نشان می‌دهد؛ سنجش استاندارد گرمی/شایستگی ادراک‌شده، شخصیت، یا میزان واقعی اعتماد مشتری نیست. برای اطمینان باید بازخورد همکاران و مشاهده رفتار واقعی هم بررسی شود.</small></div>';
 const strongest='<div class="s1-result-block"><h4>✅ رفتارهایی که بیشتر گزارش کرده‌اید</h4><ul>'+high.map(x=>'<li><b>'+esc(x.info.title)+'</b> — پاسخ شما: '+x.v.toLocaleString("fa-IR")+' از ۵</li>').join('')+'</ul></div>';
 const weakest='<div class="s1-result-block"><h4>🎯 دو اولویت تمرین برای شما</h4>'+main.map((x,i)=>'<div class="s1-result-practice"><b>'+(i+1).toLocaleString("fa-IR")+'. '+esc(x.info.title)+'</b><p>'+esc(x.info.action)+'</p><small>شاخص مشاهده: '+esc(x.info.metric)+'</small></div>').join('')+'</div>';
 const caveat=isOther?'<div class="s1-assess-note">شما گروه دیگری را انتخاب کرده‌اید، اما پرسش‌ها درباره رفتار شخصی «من» نوشته شده‌اند؛ بنابراین این نتیجه فقط برداشت شماست و ارزیابی واقعی کارکنان یا سایر رؤسای شعب محسوب نمی‌شود.</div>':"";
 const itemTable='<details class="s1-result-detail"><summary>مشاهده پاسخ هر ۱۰ سؤال و برنامه پیگیری</summary><div class="s1-result-items">'+s1TestAnswers.map((v,i)=>'<div class="s1-result-item"><span>'+((i+1).toLocaleString("fa-IR"))+'. '+esc(s1ActionCatalog[i].title)+'</span><strong>'+v.toLocaleString("fa-IR")+' از ۵</strong><div class="s1-result-track"><i style="width:'+(v*20)+'%"></i></div></div>').join('')+'</div></details>';
 const evalbox='<div class="s1-result-commit"><h4>📋 تعهد عملی تا جلسه بعد</h4><p>از دو اولویت بالا، فقط یک رفتار را طی سه روز در دست‌کم سه تعامل واقعی تمرین کنید. تعداد اجرا و واکنش مشاهده‌شده را ثبت کنید؛ برای ثبت داده، نام یا مشخصات مشتری را وارد نکنید.</p><button type="button" onclick="s1CopyPlan()">رونوشت برنامه شخصی من</button></div>';
 const target=document.getElementById("s1-profile");
 target.innerHTML=base+caveat+strongest+weakest+itemTable+evalbox;
 document.getElementById("s1-result").classList.add("show");
 target.scrollIntoView({block:"start",behavior:"smooth"});
}
function s1CopyPlan(){
 const low=s1TestAnswers.map((v,i)=>({v,i,info:s1ActionCatalog[i]})).sort((a,b)=>a.v-b.v||a.i-b.i).slice(0,2);
 const t="برنامه تمرین ارتباطات من در شعبه بیمه البرز\n"+low.map((x,i)=>(i+1)+". "+x.info.title+"\nرفتار: "+x.info.action+"\nشاخص: "+x.info.metric).join("\n\n")+"\nزمان بازنگری: سه روز پس از نخستین اجرا.";
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector(".s1-result-commit button");if(b)b.textContent="برنامه کپی شد ✓";}).catch(()=>window.prompt("متن برنامه را کپی کنید:",t));}
 else window.prompt("متن برنامه را کپی کنید:",t);
}

 '<div class="content"><section class="panel full" style="text-align:center;padding:42px 28px"><div style="font-size:54px;margin-bottom:12px">🧩</div><h2 style="font-size:30px">این جلسه در مرحله بعد توسعه می‌یابد</h2><p style="font-size:20px;max-width:760px;margin:0 auto;color:var(--muted)">فعلاً فقط عنوان و جایگاه این جلسه در معماری دوره تثبیت شده است. محتوای علمی، سناریوها، تمرین‌ها و ابزارهای تعاملی بعد از نهایی‌شدن هر جلسه اضافه خواهد شد.</p></section></div>'+
 '<div style="display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:20px"><a class="btn alt" href="?m='+(id-1)+'">جلسه قبل</a><a class="btn alt" href="?">خانه آکادمی</a><a class="btn" href="'+(id<10?'?m='+(id+1):'?')+'">'+(id<10?'جلسه بعد':'بازگشت به داشبورد')+'</a></div></div></section></main>'+footer()
}

}
