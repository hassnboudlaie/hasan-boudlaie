'<a class="ai-card clickable-card" href="?m=0&view=lab&item=use6"><h3>۶. توسعه کارکنان</h3><p>Role Play، طراحی سؤال آموزشی، بازخورد روی متن یا سناریو و ساخت تمرین متناسب با مسئله واقعی شعبه.</p></a>'+
'<a class="ai-card clickable-card" href="?m=0&view=lab&item=use7"><h3>۷. یادگیری شخصی مدیر</h3><p>توضیح ساده یک مفهوم، مقایسه روش‌ها، ساخت برنامه مطالعه و تمرین مهارت قبل از موقعیت واقعی.</p></a>'+
'<a class="ai-card clickable-card" href="?m=0&view=lab&item=use8"><h3>۸. مدیریت زمان و کار</h3><p>اولویت‌بندی فهرست کارها، طراحی برنامه روزانه، شکستن یک مسئله پیچیده به قدم‌های کوچک و ساخت قالب پیگیری.</p></a>'+'<a class="ai-card clickable-card" href="?m=0&view=lab&item=use9"><h3>۹. Gmail و Google Calendar</h3><p>خلاصه ایمیل‌های مهم، پیش‌نویس پاسخ، آماده‌سازی جلسه، بررسی زمان‌های آزاد و مدیریت رویدادها؛ در صورت اتصال حساب و اعطای دسترسی.</p></a>'+'<a class="ai-card clickable-card" href="?m=0&view=lab&item=use10"><h3>۱۰. Google Drive و سایر Apps</h3><p>پیدا کردن فایل، خلاصه‌سازی Docs/Sheets/Slides و کار با سایر ابزارهای متصل متناسب با دسترسی حساب.</p></a>'+

'<section class="panel full"><h2>نمونه Promptهای آماده</h2>'+
'<a class="prompt-link" href="?m=0&view=lab&item=prompt1"><div class="prompt"><b>نمونه ۱ | نامه مدیریتی</b><code>در نقش رئیس شعبه بیمه، این یادداشت خام را به یک نامه رسمی، کوتاه و محترمانه برای واحد ستادی تبدیل کن. لحن قاطع ولی غیرتنش‌زا باشد. در پایان، اقدام مورد انتظار و زمان پاسخ را روشن کن.</code></div></a>'+
'<a class="prompt-link" href="?m=0&view=lab&item=prompt2"><div class="prompt"><b>نمونه ۲ | مشتری ناراضی</b><code>نقش یک مشتری ناراضی بیمه را بازی کن که از تأخیر در رسیدگی ناراحت است. من رئیس شعبه هستم و می‌خواهم پاسخ بدهم. بعد از هر پاسخ من، فقط واکنش مشتری را بده و در پایان روی لحن، همدلی و مدیریت انتظار به من بازخورد بده.</code></div></a>'+
'<a class="prompt-link" href="?m=0&view=lab&item=prompt3"><div class="prompt"><b>نمونه ۳ | بررسی پرونده</b><code>این اطلاعات فرضی و بدون مشخصات هویتی را مرور کن. فقط موارد ناقص، سؤال‌های لازم برای پیگیری و یک Checklist بررسی را استخراج کن. تصمیم یا تأیید نهایی پرونده را انجام نده.</code></div></a>'+
'<a class="prompt-link" href="?m=0&view=lab&item=prompt4"><div class="prompt"><b>نمونه ۴ | جلسه کارکنان</b><code>برای جلسه ۳۰ دقیقه‌ای تیم شعبه درباره کاهش خطا در پاسخ‌گویی به مشتری، یک Agenda شامل هدف، سه سؤال بحث، تصمیم‌های مورد انتظار و Action Itemهای قابل پیگیری طراحی کن.</code></div></a>'+
'</section>'+
'<section class="panel full"><h2>شروع و ارتقای حساب ChatGPT</h2><p>برای شروع، نسخه رایگان برای آشنایی، نوشتن متن، تمرین، جست‌وجو، فایل و بسیاری از کارهای روزمره کافی است. اگر استفاده بیشتر، فایل‌های بیشتر، تحلیل پیشرفته‌تر، Research، پروژه‌ها یا ابزارهای حرفه‌ای‌تر لازم شد، می‌توان پلن‌های پولی مانند Go، Plus یا Pro را بررسی کرد. امکانات و محدودیت‌ها ممکن است تغییر کنند، بنابراین قبل از خرید صفحه رسمی قیمت‌گذاری را ببینید.</p><div class="linkrow"><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">ورود / ساخت حساب ChatGPT</a><a class="btn alt" href="https://chatgpt.com/pricing/" target="_blank" rel="noopener">مقایسه پلن‌های رسمی</a></div><div class="warn" style="margin-top:12px"><b>اگر پرداخت مستقیم در دسترس نیست:</b> ممکن است از واسط‌های پرداخت مانند نامبرلند استفاده شود. ترجیح حرفه‌ای این است که <b>اشتراک روی حساب شخصی خود فرد</b> فعال شود؛ از خرید حساب آماده یا اشتراکی و تحویل رمز عبور به اشخاص ثالث پرهیز شود و شرایط سرویس‌دهنده قبل از خرید بررسی شود.</div></section>'+
'<section class="panel full"><h2>خط قرمزهای استفاده در شعبه</h2><div class="safe"><b>اصل ساده:</b> هوش مصنوعی «دستیار» است، نه مرجع نهایی تصمیم. قبل از ارسال هر خروجی، مدیر باید آن را بررسی کند.</div><ul style="margin-top:12px"><li>اطلاعات هویتی، شماره ملی، شماره حساب، شماره بیمه‌نامه، اطلاعات پزشکی، مالی و اطلاعات محرمانه مشتری را بدون مجوز وارد نکنید.</li><li>برای تمرین و آموزش از داده فرضی یا اطلاعات ناشناس‌سازی‌شده استفاده کنید.</li><li>تحلیل AI جایگزین مقررات، دستورالعمل رسمی، نظر حقوقی یا تصمیم تخصصی بیمه‌ای نیست.</li><li>اعداد، تاریخ‌ها، استنادها و بخشنامه‌ها را قبل از استفاده نهایی کنترل کنید.</li></ul></section>'+
'<section class="panel full"><h2>تمرین پیشنهادی جلسه صفر</h2><div class="placeholder"><b>تمرین ۱۵ دقیقه‌ای:</b> هر رئیس شعبه یک کار واقعی اما غیرمحرمانه از هفته جاری انتخاب کند؛ مثلاً تنظیم یک پیام، آماده‌سازی جلسه، پاسخ به اعتراض یا خلاصه‌سازی یک متن. ابتدا خودش Prompt را بنویسد، خروجی را بگیرد، سپس Prompt را با «نقش + زمینه + مسئله + خروجی مورد انتظار» بازنویسی کند و تفاوت دو خروجی را مقایسه کند.</div></section>';

function scoreS1(){

 document.getElementById("s1-cscore").textContent=c.toFixed(1);

 dot.style.right=((c-1)/4*92+3)+"%";

   ];
   practices=[

     "تمرین «فشار»: در یک سناریوی شلوغ شعبه، آگاهانه Warmth را بدون افت سرعت حفظ کنید."
   ];

     "در موقعیت‌های پراسترس، قبل از پاسخ فقط ۳ ثانیه روی لحن و اولین جمله تمرکز کنید.",
