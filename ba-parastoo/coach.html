<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My AI Life Coach | با پرستو</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f6;color:#3e3037;font:15px/1.9 Tahoma,Arial}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 18px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8dce1;padding:10px 0}a{color:#80546a;text-decoration:none}.badge{font-size:11px;background:#f0e5e9;border-radius:18px;padding:3px 10px}.welcome{text-align:center;padding:28px 0 10px}.welcome h1{font-size:25px;margin:8px}.welcome p{color:#82717a}.topics{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.topics button{background:white;color:#80546a;border:1px solid #e6d6de}.chat{flex:1;padding:25px 0;display:flex;flex-direction:column;gap:12px}.bubble{background:#f0e5ea;padding:12px 17px;border-radius:19px;max-width:88%;align-self:flex-start}.mine{background:white;border:1px solid #e8dce1;align-self:flex-end}form{display:flex;gap:8px;background:white;border:1px solid #e8dce1;padding:8px;border-radius:18px}textarea{font:inherit;flex:1;resize:vertical;min-height:48px;max-height:130px;border:0;outline:0;padding:8px}button{font:inherit;border:0;background:#80546a;color:white;padding:9px 15px;border-radius:14px;cursor:pointer}footer{position:sticky;bottom:0;background:#faf7f6;padding:12px 0}small{display:block;text-align:center;color:#8d7d84;margin-top:8px}@media(max-width:600px){.welcome h1{font-size:21px}}</style><div class="app"><header><a href="dashboard.html">← داشبورد من</a><b>✦ My AI Life Coach</b><span class="badge">Demo</span></header><div class="welcome"><h1>امروز درباره چه چیزی گفت‌وگو کنیم؟</h1><p>فضایی برای تأمل و پیدا کردن قدم بعدی</p><div class="topics"><button data-t="هدف‌هایم">🎯 اهداف</button><button data-t="یک تصمیم مهم">🧭 تصمیم</button><button data-t="عادت‌هایم">🌱 عادت‌ها</button><button data-t="روابطم">💬 روابط</button></div></div><div id="chat" class="chat" aria-live="polite"><div class="bubble">سلام 🌷 دوست داری از چه موضوعی شروع کنیم؟ این نسخه یک دموی پرسش‌محور است و هنوز به AI واقعی متصل نیست.</div></div><footer><form id="form"><textarea id="msg" placeholder="پیامت را بنویس..." maxlength="1000"></textarea><button>ارسال</button></form><small>پیام‌ها ذخیره یا ارسال نمی‌شوند. اطلاعات حساس وارد نکن. این ابزار جایگزین درمان نیست.</small></footer></div><script>const c=document.getElementById('chat'),m=document.getElementById('msg');let n=0;const q=['چه چیزی در این موضوع برایت بیشترین اهمیت را دارد؟','چه گزینه‌هایی پیش روی توست؟','از تجربه‌های قبلی‌ات چه چیزی می‌توانی به کار بگیری؟','قدم کوچک و مشخص بعدی تو چیست؟'];function add(t,me){const d=document.createElement('div');d.className='bubble'+(me?' mine':'');d.textContent=t;c.appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'})}function send(t){t=t.trim();if(!t)return;add(t,true);add(q[n++%q.length],false);m.value=''}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(m.value)});document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>send('می‌خواهم درباره '+b.dataset.t+' صحبت کنم.')));m.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(m.value)}})</script>
