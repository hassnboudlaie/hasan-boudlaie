<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>آزمون جلسه اول | رفتار سازمانی MBA علامه</title>
<link rel="stylesheet" href="../ob-mba-classroom/quiz-portal.css">
<style>
:root{color-scheme:light;font-family:Tahoma,Arial,sans-serif;color:#152c2b;background:#f4f8f7;--ink:#152c2b;--muted:#495d5b;--line:#cbd8d6;--paper:#fff;--teal:#105e59}
body{margin:0;line-height:1.8}main{max-width:760px;margin:auto;padding:24px 16px 48px}
header{margin-bottom:18px}header h1{font-size:clamp(22px,5vw,32px);margin:.2em 0}a{color:#105e59}
.login{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}
label{display:block;margin-top:.6em}input:not([type=radio]){box-sizing:border-box;display:block;width:min(100%,340px);padding:10px;margin-bottom:10px;border:1px solid #829b97;border-radius:8px;font:inherit}
button{font:inherit;cursor:pointer}.login button{background:#105e59;color:#fff;border:0;border-radius:8px;padding:8px 14px}
#login-status:empty{display:none}.quiz-option{color:#172e2d}
</style>
<script defer src="../ob-mba-classroom/quiz-portal.js?v=8"></script>
<script defer src="./entry.js?v=1"></script>
</head>
<body><main>
<header><a href="../ob-mba-classroom/">صفحه اصلی کلاس</a><h1>آزمون جلسه اول</h1><p>مدیریت رفتار سازمانی · MBA دانشگاه علامه طباطبایی</p></header>
<section id="login" class="login" hidden>
<h2>ورود دانشجو</h2><p>شماره دانشجویی و رمز شخصی اپ علامه را وارد کنید.</p>
<form id="login-form">
<label for="student-number">شماره دانشجویی</label><input id="student-number" name="student_number" dir="ltr" inputmode="numeric" autocomplete="username" maxlength="16" required>
<label for="student-password">رمز شخصی</label><input id="student-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
<button type="submit">ورود به آزمون</button>
<p id="login-status" role="status"></p>
</form></section>
<div id="assessment"><p role="status">در حال آماده‌سازی آزمون… اگر این پیام باقی ماند، اتصال را بررسی کنید و پیش از شروع آزمون دوباره این لینک را باز کنید.</p></div>
<noscript><p>برای نمایش آزمون، JavaScript مرورگر را فعال کنید.</p></noscript>
</main></body></html>
