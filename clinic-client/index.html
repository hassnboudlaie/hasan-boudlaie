<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>انتقال به نسخه جدید اپ کلینیک</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f7f3f5;color:#241a20;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}.box{max-width:520px;background:#fff;border:1px solid #eadfe5;border-radius:24px;padding:28px;box-shadow:0 14px 35px rgba(70,42,59,.12)}a{display:inline-block;margin-top:16px;background:#5d3b50;color:white;text-decoration:none;padding:12px 18px;border-radius:14px}</style>
</head>
<body>
<div class="box"><h1>نسخه جدید اپ آماده است</h1><p>برای جلوگیری از تداخل نصب با اپ‌های قبلی، اپ مشتریان کلینیک به یک مسیر مستقل منتقل شده است.</p><a href="../clinic-customer-app/">ورود به نسخه جدید</a></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/clinic-client/')).map(r=>r.unregister()));
    }
  }catch(e){}
  location.replace('../clinic-customer-app/');
})();
</script>
</body>
</html>
