let state;try{state=JSON.parse(localStorage.getItem(key))||blank()}catch(e){state=blank()}let page='home',termId=1,courseId='',tab='overview';let persistent=true;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){persistent=false}render();toast(persistent?'ذخیره شد':'ذخیره مرورگر در دسترس نیست؛ نسخه پشتیبان بگیرید')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}
function go(p,t,c){page=p;if(t)termId=t;if(c)courseId=c;tab='overview';render();window.scrollTo(0,0)}function setTab(t){tab=t;render()}const term=()=>state.terms.find(t=>t.id===termId),course=()=>term().courses.find(c=>c.id===courseId), allCourses=()=>state.terms.flatMap(t=>t.courses), passed=c=>c.status==='گذرانده شده', pct=(a,b)=>b?Math.round(a*100/b):0, progress=(p)=>`<div class="bar"><i style="width:${p}%"></i></div>`, pill=s=>`<span class="pill">${esc(s)}</span>`, empty=s=>`<div class="empty">${s}</div>`, back=(p,t)=>`<button class="secondary crumb" onclick="go('${p}',${t||1})">بازگشت</button>`, section=(title,action='')=>`<div class="section"><h2>${title}</h2>${action}</div>`;
const tabs=(entries)=>`<div class="tabs">${entries.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}</div>`;
function render(){const pages=[['home','خانه'],['terms','ترم‌های تحصیلی'],['thesis','رساله دکتری'],['exam','آزمون جامع'],['calendar','برنامه و تکالیف'],['profile','پروفایل'],['admin','⚙️ مدیریت']];$('nav').innerHTML=pages.map(([id,label])=>`<button class="${page===id||(id==='terms'&&['term','course'].includes(page))?'active':''}" onclick="go('${id}')">${label}</button>`).join('');let body=({home,terms:termsPage,term:termPage,course:coursePage,thesis:thesisPage,exam:examPage,calendar:calendarPage,profile:profilePage,admin:adminPage}[page]||home)();$('main').innerHTML=body+`<footer>دکتری من | الهام‌گرفته از دانشگاه تهران و پردیس کیش | ابزار شخصی و غیررسمی</footer>`}
function semesterCards(){return `<div class="grid">${state.terms.map(t=>{let n=t.courses.filter(passed).length;return `<button class="semester" onclick="go('term',${t.id})"><span class="symbol" aria-hidden="true">${["📚","🧭","💡","🎯","🔬","📊","✍️","🎓"][t.id-1]}</span><span class="num">${fa(t.id)}</span><strong>ترم ${fa(t.id)}</strong><small>${esc(t.title||phases[t.id-1])}</small>${progress(pct(n,t.courses.length))}<div class="row spread"><small>${fa(t.courses.length)} درس</small>${pill(t.status)}</div></button>`}).join('')}</div>`}
function home(){let cs=allCourses(),units=cs.filter(passed).reduce((a,c)=>a+Number(c.units||0),0), graded=cs.filter(c=>c.grade!==''&&c.grade!=null&&Number(c.units)>0), gUnits=graded.reduce((a,c)=>a+Number(c.units),0), avg=gUnits?(graded.reduce((a,c)=>a+Number(c.grade)*Number(c.units),0)/gUnits).toFixed(2):'—', p=pct(state.thesis.milestones.filter(m=>m.done).length,state.thesis.milestones.length), pending=events().filter(e=>!e.done);return `<div class="hero"><div class="eyebrow">${esc(state.settings?.motto||'از ساحل کیش تا قله دانش مدیریت')}</div><h2>${state.profile.name?'سلام، '+esc(state.profile.name):'به ماجراجویی دکتری خوش آمدی!'}</h2><p>${esc(state.profile.field)} · ${esc(state.profile.campus)}</p><button onclick="go('term',${Number(state.profile.current)||1})">ورود به ترم جاری ←</button></div><div class="identity-strip"><span>🌊 پردیس کیش</span><span>🎓 دکتری</span><span>🧭 مدیریت و رهبری</span><span>🔬 پژوهش و نوآوری</span></div><div class="grid">${[['ترم جاری',fa(state.profile.current)],['واحد گذرانده',fa(units)],['معدل ثبت‌شده',avg==='—'?avg:Number(avg).toLocaleString('fa-IR',{minimumFractionDigits:2})],['پیشرفت رساله',fa(p)+'٪']].map(([t,v])=>`<div class="card stat"><small>${t}</small><strong>${v}</strong></div>`).join('')}</div>${section('هشت ایستگاه تا قله دکتری')}${semesterCards()}${section('دسترسی سریع')}<div class="two"><button class="course" onclick="go('thesis')"><span class="module-icon" aria-hidden="true">📜</span><h3>رساله دکتری</h3><small>مراحل، جلسات استاد راهنما و فعالیت‌های پژوهشی</small>${progress(p)}</button><button class="course" onclick="go('exam')"><span class="module-icon" aria-hidden="true">🎯</span><h3>آزمون جامع</h3><small>${esc(state.exam.status)} · منابع و آمادگی</small></button></div>${section('کارهای پیش رو',`<button class="secondary" onclick="go('calendar')">مشاهده همه</button>`)}<div class="card">${pending.length?pending.slice(0,5).map(eventRow).join(''):empty('هنوز تکلیفی ثبت نشده است.')}</div>`}
function termsPage(){return `<h2>ترم‌های تحصیلی</h2><p class="muted">هر ترم را باز کنید و دروس واقعی خود را اضافه کنید.</p><div class="notice">عنوان مراحل، یک نقشه پیشنهادی است؛ چارت مصوب و زمان‌بندی واقعی بر اساس گرایش و مقررات دانشگاه تنظیم می‌شود.</div>${semesterCards()}`}
function termPage(){let t=term();return `${back('terms')}<div class="hero"><h2>ترم ${fa(t.id)}</h2><p>${esc(t.title||phases[t.id-1])} · ${esc(t.status)}</p><button onclick="editTerm()">تنظیمات ترم</button></div><div class="grid"><div class="card stat"><small>تعداد دروس</small><strong>${fa(t.courses.length)}</strong></div><div class="card stat"><small>واحدها</small><strong>${fa(t.courses.reduce((s,c)=>s+Number(c.units||0),0))}</strong></div><div class="card stat"><small>دروس گذرانده</small><strong>${fa(t.courses.filter(passed).length)}</strong></div><div class="card stat"><small>پیشرفت</small><strong>${fa(pct(t.courses.filter(passed).length,t.courses.length))}٪</strong></div></div>${section('دروس ترم',`<button onclick="editCourse()">+ افزودن درس</button>`)}<div class="two">${t.courses.map(c=>`<button class="course" onclick="go('course',${t.id},'${c.id}')"><h3>${esc(c.title)}</h3><small>${esc(c.teacher||'استاد تعیین نشده')} · ${fa(c.units)} واحد</small><div class="row spread">${pill(c.status)}<small>${c.grade===''?'نمره ثبت نشده':'نمره: '+esc(c.grade)}</small></div></button>`).join('')||`<div class="card">${empty('برای شروع، درس خود را اضافه کنید.')}</div>`}</div>${section('یادداشت‌های ترم')}<div class="card">${t.notes?esc(t.notes):'یادداشتی ثبت نشده است.'}</div>`}
const types={classes:'جلسه کلاس',assignments:'تکلیف',projects:'پروژه کلاسی',exams:'آزمون',resources:'منبع',notes:'یادداشت',meetings:'جلسه استاد راهنما',papers:'مقاله',research:'فعالیت پژوهشی',prep:'منبع / برنامه مطالعه'};
function coursePage(){let c=course();if(!c)return termPage();let entries=[['overview','وضعیت آموزشی'],['classes','جلسات کلاس'],['assignments','تکالیف'],['projects','پروژه‌ها'],['exams','آزمون‌ها'],['resources','منابع'],['notes','یادداشت‌ها']];return `${back('term',termId)}<div class="hero"><h2>${esc(c.title)}</h2><p>${esc(c.teacher||'استاد تعیین نشده')} · ${fa(c.units)} واحد · ترم ${fa(termId)}</p><button onclick="editCourse('${c.id}')">ویرایش اطلاعات درس</button></div>${tabs(entries)}${tab==='overview'?`<div class="two"><div class="card"><h3>اطلاعات آموزشی</h3><p>وضعیت: ${pill(c.status)}</p><p>نمره: ${esc(c.grade===''?'ثبت نشده':c.grade)}</p><p>زمان و محل کلاس: ${esc(c.schedule||'تعیین نشده')}</p><p>توضیحات: ${esc(c.description||'—')}</p><button class="danger" onclick="removeCourse()">حذف درس</button></div><div class="card"><h3>خلاصه فعالیت‌ها</h3>${entries.slice(1).map(([id,label])=>`<div class="item row spread"><span>${label}</span><button class="secondary" onclick="setTab('${id}')">${fa(c.items.filter(x=>x.type===id).length)} مورد</button></div>`).join('')}</div></div>`:itemPanel('course',tab,c.items)}`}
function itemPanel(scope,type,items){let subset=items.filter(x=>x.type===type);return `<div class="card">${section(types[type]||'فعالیت',`<button onclick="editItem('${scope}','${type}')">+ ثبت</button>`)}${subset.length?subset.map(x=>itemRow(scope,x)).join(''):empty('هنوز موردی ثبت نشده است.')}</div>`}
function itemRow(scope,x){let url='';try{let u=new URL(x.link);if(['http:','https:'].includes(u.protocol))url=u.href}catch(e){}return `<div class="item"><div class="row spread"><div class="row"><input class="check" aria-label="انجام شد" type="checkbox" ${x.done?'checked':''} onchange="toggleItem('${scope}','${x.id}')"><h4 class="${x.done?'done':''}">${esc(x.title)}</h4></div><div class="row"><button class="secondary" onclick="editItem('${scope}','${x.type}','${x.id}')">ویرایش</button><button class="danger" onclick="deleteItem('${scope}','${x.id}')">حذف</button></div></div>${x.date?`<small>تاریخ: ${esc(x.date)}</small>`:''}${x.status?` ${pill(x.status)}`:''}${x.note?`<p>${esc(x.note)}</p>`:''}${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">باز کردن پیوند</a>`:''}</div>`}
function thesisPage(){let t=state.thesis,p=pct(t.milestones.filter(m=>m.done).length,t.milestones.length);return `<div class="hero"><h2>رساله دکتری</h2><p>${esc(t.title||'از ایده پژوهش تا دفاع نهایی')}</p><button onclick="editThesis()">ویرایش اطلاعات رساله</button></div>${tabs([['overview','نقشه پیشرفت'],['meetings','جلسات راهنما'],['research','فعالیت پژوهشی'],['papers','مقالات'],['resources','منابع'],['notes','یادداشت‌ها']])}${tab==='overview'?`<div class="two"><div class="card"><h3>مشخصات پژوهش</h3><p>استاد راهنما: ${esc(t.advisor||'—')}</p><p>استاد مشاور: ${esc(t.coadvisor||'—')}</p><p>مسئله پژوهش: ${esc(t.question||'—')}</p></div><div class="card stat"><small>پیشرفت مراحل ثبت‌شده</small><strong>${fa(p)}٪</strong>${progress(p)}<small>پیشرفت بر اساس تعداد مراحل تکمیل‌شده است.</small></div></div>${section('مراحل رساله',`<button onclick="editMilestone()">+ مرحله</button>`)}<div class="card">${t.milestones.map(m=>`<div class="item row spread"><div class="row"><input class="check" type="checkbox" aria-label="تکمیل مرحله" ${m.done?'checked':''} onchange="toggleMilestone('${m.id}')"><div><strong class="${m.done?'done':''}">${esc(m.title)}</strong><br><small>${esc(m.date||'بدون تاریخ')}${m.note?' · '+esc(m.note):''}</small></div></div><div class="row"><button class="secondary" onclick="editMilestone('${m.id}')">ویرایش</button><button class="danger" onclick="deleteMilestone('${m.id}')">حذف</button></div></div>`).join('')}</div>`:itemPanel('thesis',tab,t.items)}`}
function examPage(){let e=state.exam;return `<div class="hero"><h2>آزمون جامع</h2><p>${esc(e.status)}</p><button onclick="editExam()">تنظیم وضعیت آزمون</button></div><div class="card"><p>تاریخ: ${esc(e.date||'تعیین نشده')}</p><p>${esc(e.notes||'منابع، برنامه مطالعه و تمرین‌های آمادگی خود را ثبت کنید.')}</p></div>${itemPanel('exam','prep',e.items)}`}
function events(){let a=state.tasks.map(x=>({...x,scope:'calendar',context:'برنامه شخصی'}));for(let t of state.terms)for(let c of t.courses)for(let x of c.items)if(['classes','assignments','projects','exams'].includes(x.type))a.push({...x,scope:'course',context:c.title,tid:t.id,cid:c.id});for(let [scope,items] of [['thesis',state.thesis.items],['exam',state.exam.items]])for(let x of items)if(x.date)a.push({...x,scope,context:scope==='thesis'?'رساله':'آزمون جامع'});for(let m of state.thesis.milestones)if(m.date)a.push({...m,scope:'thesis',context:'مرحله رساله'});return a.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function eventRow(x){return `<div class="item row spread"><div><strong>${esc(x.title)}</strong><br><small>${esc(x.context)} · ${esc(x.date||'بدون تاریخ')} · ${x.done?'انجام شده':'باز'}</small></div><button class="secondary" onclick="${x.scope==='course'?`go('course',${x.tid},'${x.cid}');setTab('${x.type}')`:x.scope==='calendar'?`editItem('calendar','assignments','${x.id}')`:`go('${x.scope}');${x.scope==='thesis'&&x.type?`setTab('${x.type}')`:''}`}">مشاهده</button></div>`}
function calendarPage(){return `<h2>برنامه و تکالیف</h2><p class="muted">همه کلاس‌ها، پروژه‌ها، آزمون‌ها و فعالیت‌های زمان‌دار در یک نما.</p>${section('برنامه‌های شخصی',`<button onclick="editItem('calendar','assignments')">+ کار جدید</button>`)}<div class="card">${state.tasks.length?state.tasks.map(x=>itemRow('calendar',x)).join(''):empty('کاری ثبت نشده است.')}</div>${section('فهرست یکپارچه فعالیت‌ها')}<div class="card">${events().length?events().map(eventRow).join(''):empty('فعالیتی ثبت نشده است.')}</div>`}
function profilePage(){let p=state.profile;return `<h2>پروفایل دانشجو</h2><div class="two"><div class="card"><h3>${esc(p.name||'دانشجوی دکتری')}</h3><p>رشته و گرایش: ${esc(p.field)}</p><p>پردیس: ${esc(p.campus)}</p><p>سال ورود: ${esc(p.entry||'—')}</p><p>شماره دانشجویی: ${esc(p.number||'—')}</p><p>ترم جاری: ${fa(p.current)}</p><button onclick="editProfile()">ویرایش پروفایل</button></div><div class="card"><h3>مدیریت اطلاعات</h3><p>داده‌های آموزشی با حساب شما در فضای ابری ذخیره می‌شوند. نسخه پشتیبان JSON شامل اطلاعات آموزشی است و فایل‌های پیوست جداگانه در کتابخانه فایل‌ها نگهداری می‌شوند.</p><div class="row"><button onclick="exportData()">پشتیبان JSON</button><button class="secondary" onclick="$('import').click()">بازیابی</button><button class="secondary" onclick="window.print()">چاپ این صفحه</button></div><input id="import" type="file" accept="application/json,.json" hidden style="display:none" onchange="importData(this)"><p><a href="https://ut.ac.ir/" target="_blank" rel="noopener">وب‌سایت دانشگاه تهران</a></p></div></div>`}
function modal(title,fields,cb){$('dt').textContent=title;$('fields').innerHTML=fields.map(f=>{let [name,label,value='',kind='text',opts=[]]=f;let field=kind==='select'?`<select name="${name}">${opts.map(o=>`<option ${String(value)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${kind}" value="${esc(value)}" ${name==='title'?'required':''} ${name==='grade'?'min="0" max="20" step="0.01"':name==='units'?'min="0" max="24" step="1"':''}>`;return `<label for="f-${name}">${label}</label>${field.replace('name=',`id="f-${name}" name=`)}`}).join('');$('form').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));$('dlg').close();save()};$('dlg').showModal()}
function editTerm(){let t=term();modal('تنظیمات ترم',[['title','عنوان اختصاصی ترم',t.title||phases[t.id-1]],['start','شروع ترم',t.start||'','date'],['end','پایان ترم',t.end||'','date'],['status','وضعیت',t.status,'select',['آینده','در حال تحصیل','تکمیل شده','مرخصی']],['notes','یادداشت‌ها',t.notes,'textarea']],v=>Object.assign(t,v))}
function editCourse(id){let t=term(),c=t.courses.find(x=>x.id===id)||{id:uid(),title:'',teacher:'',units:3,grade:'',status:'در حال گذراندن',schedule:'',description:'',items:[]};modal(id?'ویرایش درس':'افزودن درس',[['title','نام درس',c.title],['teacher','نام استاد',c.teacher],['units','تعداد واحد',c.units,'number'],['status','وضعیت آموزشی',c.status,'select',['در حال گذراندن','گذرانده شده','برنامه‌ریزی شده','حذف شده','نیاز به تکرار']],['grade','نمره از ۲۰ (اختیاری)',c.grade,'number'],['schedule','زمان و محل کلاس',c.schedule],['description','توضیحات',c.description,'textarea']],v=>{Object.assign(c,v);if(!id)t.courses.push(c)})}
function removeCourse(){if(confirm('درس و تمام فعالیت‌های مرتبط حذف شوند؟')){term().courses=term().courses.filter(c=>c.id!==courseId);page='term';save()}}
function listFor(s){return s==='course'?course().items:s==='thesis'?state.thesis.items:s==='exam'?state.exam.items:state.tasks}
function editItem(s,type,id){let a=listFor(s),x=a.find(y=>y.id===id)||{id:uid(),type,title:'',date:'',note:'',link:'',status:'در انتظار',done:false};modal(types[type]||'فعالیت',[['title','عنوان',x.title],['date','تاریخ (اختیاری؛ میلادی)',x.date,'date'],['status','وضعیت',x.status,'select',['در انتظار','در حال انجام','انجام شده','تحویل داده شده','لغو شده']],['note','شرح / بازخورد / نتیجه',x.note,'textarea'],['link','پیوند فایل یا منبع',x.link,'url']],v=>{Object.assign(x,v);x.done=['انجام شده','تحویل داده شده','لغو شده'].includes(v.status);if(!id)a.push(x)})}
function toggleItem(s,id){let x=listFor(s).find(x=>x.id===id);x.done=!x.done;x.status=x.done?'انجام شده':'در انتظار';save()}
function deleteItem(s,id){if(confirm('این فعالیت حذف شود؟')){let a=listFor(s);a.splice(a.findIndex(x=>x.id===id),1);save()}}
function editThesis(){let t=state.thesis;modal('اطلاعات رساله',[['title','عنوان پژوهش',t.title],['advisor','استاد راهنما',t.advisor],['coadvisor','استاد مشاور',t.coadvisor],['question','مسئله پژوهش',t.question,'textarea']],v=>Object.assign(t,v))}
function editMilestone(id){let a=state.thesis.milestones,m=a.find(x=>x.id===id)||{id:uid(),title:'',date:'',note:'',done:false};modal('مرحله رساله',[['title','عنوان',m.title],['date','تاریخ هدف (میلادی)',m.date,'date'],['note','یادداشت',m.note,'textarea']],v=>{Object.assign(m,v);if(!id)a.push(m)})}

async function phdUpload(input){const f=input.files?.[0];if(!f||!phdReady)return;const owner=phdUser.id,scope=$('phdUploadScope')?.value||phdScope();if(f.size<1||f.size>20971520||!/\.(pdf|docx?|pptx?|xlsx?|csv|txt|png|jpe?g|webp)$/i.test(f.name)){toast('نوع یا حجم فایل مجاز نیست.');input.value='';return}const id=crypto.randomUUID(),path=owner+'/'+id;input.disabled=true;toast('در حال بارگذاری…');try{let r=await phdClient.storage.from(phdBucket).upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(r.error)throw r.error;let d=await phdClient.from(phdDocs).insert({id,user_id:owner,scope,name:f.name.slice(0,255),path,bytes:f.size});if(d.error){await phdClient.storage.from(phdBucket).remove([path]);throw d.error}toast('فایل بارگذاری شد.');phdList()}catch(e){toast('بارگذاری ناموفق: '+(e.message||'خطای اتصال'))}finally{input.disabled=false;input.value=''}}
async function phdDoc(id){if(!phdReady)throw Error('ابتدا وارد شوید');let r=await phdClient.from(phdDocs).select('id,name,path').eq('id',id).eq('user_id',phdUser.id).single();if(r.error)throw r.error;return r.data}
async function phdDownload(id){try{let d=await phdDoc(id),r=await phdClient.storage.from(phdBucket).download(d.path);if(r.error)throw r.error;const a=document.createElement('a'),u=URL.createObjectURL(r.data);a.href=u;a.download=d.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){toast('دریافت فایل ناموفق: '+(e.message||'خطا'))}}
async function phdDeleteDoc(id){if(!confirm('فایل برای همیشه حذف شود؟'))return;try{let d=await phdDoc(id),r=await phdClient.storage.from(phdBucket).remove([d.path]);if(r.error)throw r.error;r=await phdClient.from(phdDocs).delete().eq('id',id).eq('user_id',phdUser.id);if(r.error)throw r.error;phdList();toast('فایل حذف شد.')}catch(e){toast('حذف ناموفق: '+(e.message||'خطا'))}}
render=function(){if(!phdReady){phdGate();return}phdHeader(true);phdOriginalRender();if(page==='files')$('main').innerHTML='<h2>کتابخانه فایل‌های من</h2>';const nav=$('nav');nav.insertAdjacentHTML('beforeend','<button class="'+(page==='files'?'active':'')+'" onclick="go(\'files\')">📎 فایل‌ها</button>');$('main').insertAdjacentHTML('afterbegin','<div class="cloud-strip"><strong id="phdSync" role="status"></strong><span>'+esc(phdUser.email||'حساب شخصی')+'</span><button class="secondary" onclick="phdFlush()">ذخیره مجدد</button><button class="secondary" onclick="phdReload()">دریافت نسخه ابری</button><button class="secondary" onclick="phdSignOut()">خروج</button></div>');phdStatus();if(['course','term','thesis','exam','calendar','files','admin'].includes(page)){$('main').insertAdjacentHTML('beforeend',phdFilePanel());phdList()}};
go=function(p,t,c){if(phdReady)phdOriginalGo(p,t,c)};
window.addEventListener('beforeunload',e=>{if(phdDirty||phdPending){e.preventDefault();e.returnValue=''}});
async function phdCloudStart(){if(!phdClient){phdGate('سرویس ورود در دسترس نیست. اتصال اینترنت را بررسی کنید.');return}phdGate('در حال بررسی حساب…');phdClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){phdRecovery=true;phdReady=false;phdGate('رمز عبور جدید خود را وارد کنید.','recovery')}else if(event==='SIGNED_OUT'){phdClear()}else if(event==='SIGNED_IN'&&!phdRecovery&&!phdReady&&session?.user){/* handled by explicit sign-in or startup */}});try{const r=await phdClient.auth.getSession();if(phdRecovery)return;if(r.error)throw r.error;if(r.data.session){const u=await phdClient.auth.getUser();if(u.error)throw u.error;await phdLoad(u.data.user)}else phdGate()}catch(e){phdGate('ورود خودکار انجام نشد؛ دوباره وارد شوید.')}}
phdCloudStart();

</script></body></html>
