<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d5963"><title>دارایی‌های من | My Finance</title><style>body{font-family:Tahoma,sans-serif;background:#f5f8fa;color:#193643;margin:0}main{max-width:690px;margin:auto;padding:20px}a{color:#0d6b68}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}.card{background:white;border:1px solid #dfebec;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 7px 20px #133b4509}h2{font-size:17px;margin:0 0 10px}p{color:#576f7b;line-height:1.9}.amount{font-size:26px;color:#08796d;font-weight:800}.detail{font-size:14px}small{color:#667a83}#status{padding:12px 0}</style><script>try{const theme=localStorage.getItem('myfinance-ui-theme-v1');if(theme==='dark'||theme==='light')document.documentElement.dataset.mfTheme=theme}catch(_){}</script><link rel="stylesheet" href="./subpages-v51.css?v=20261029r52"></head><body class="mf-subpage"><main><header class="mf-shell-header"><a class="mf-brand" href="./" aria-label="بازگشت به My Finance"><img class="mf-brand-mark" alt="" src="./icon-192-r4.png"><span>My Finance<small>مدیریت مالی شخصی</small></span></a><a class="mf-return" href="./">بازگشت به داشبورد ←</a></header>
<div class="mf-page-intro"><div><span class="mf-eyebrow">MY WEALTH / PRIVATE PORTFOLIO</span><h1>دارایی‌های من</h1><p>نمای اختصاصی دارایی‌های ثبت‌شده، بدون تخمین ارزش بازار یا تغییر موجودی حساب‌ها.</p></div></div>

<div id="status" role="status" aria-live="polite">در حال بررسی اتصال امن…</div>
<div id="assets" class="mf-asset-grid"></div><p class="mf-footnote">My Finance · داده‌ها فقط پس از احراز هویت نمایش داده می‌شوند.</p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/+esm';import{financeAuthStorage,AUTH_SESSION_KEY}from'./subpage-auth-v51.js?v=20261029r51';const client=createClient('https://hxcjkewlaniahvuqwwbb.supabase.co','sb_publishable_KpklYvrvXyorJVy4gQOWAw_SA8zaQy6',{auth:{persistSession:true,storage:financeAuthStorage,storageKey:AUTH_SESSION_KEY,autoRefreshToken:true,detectSessionInUrl:true}});const status=document.querySelector('#status'),holder=document.querySelector('#assets');const fmt=n=>new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(n);const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){status.textContent='برای مشاهده دارایی‌ها، ابتدا از صفحه اصلی My Finance با حساب خود وارد شوید.'}else{const{data,error}=await client.from('finance_objects').select('payload').eq('kind','asset').order('created_at',{ascending:true});if(error){status.textContent='خطا در دریافت دارایی‌ها: '+error.message}else{const rows=(data||[]).map(r=>r.payload).filter(a=>a&&typeof a==='object');const gold=rows.filter(r=>r.assetType==='gold'),cars=rows.filter(r=>r.assetType==='vehicle');
status.textContent='حساب خصوصی متصل · '+fmt(rows.length)+' دارایی ثبت‌شده · '+fmt(gold.length)+' مورد طلا · '+fmt(cars.length)+' خودرو';
if(!rows.length){const empty=document.createElement('p');empty.className='mf-empty';empty.textContent='هنوز دارایی ثبت‌شده‌ای در این حساب وجود ندارد.';holder.append(empty);}
for(const a of rows){
 const article=document.createElement('article');article.className='card';
 const h=document.createElement('h2');h.textContent=a.name||'دارایی بدون عنوان';
 const p=document.createElement('p');p.className='amount';
 if(a.quantity!=null&&a.quantity!=='')p.textContent=fmt(Number(a.quantity))+' '+(a.unit||(a.assetType==='gold'?'گرم':a.assetType==='vehicle'?'دستگاه':'واحد'));
 else p.textContent=a.assetType==='vehicle'?'خودرو':'دارایی ثبت‌شده';
 const d=document.createElement('p');d.className='detail';
 const facts=[];
 if(a.assetType==='gold'){
  if(a.purity!=null)facts.push('عیار: '+a.purity);
  if(a.custodian)facts.push('محل نگهداری: '+a.custodian);
  if(a.physicalForm)facts.push('شکل دارایی: '+a.physicalForm);
 }else if(a.assetType==='vehicle'){
  const spec=[a.brand,a.model,a.trim].filter(Boolean).join(' · ');
  if(spec)facts.push(spec);
  if(a.modelYearShamsi)facts.push('مدل '+a.modelYearShamsi);
 }else if(a.assetType)facts.push('نوع: '+a.assetType);
 d.textContent=facts.join(' · ')||'جزئیات بیشتری ثبت نشده است';
 const v=document.createElement('small');
 v.textContent=a.marketValueIRT==null?'ارزش بازار اعلام نشده':fmt(Number(a.marketValueIRT))+' تومان · ارزش ثبت‌شده';
 article.append(h,p,d,v);holder.append(article)}}}</script></body></html>
