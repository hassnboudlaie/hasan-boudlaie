<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d5963"><title>دارایی‌های من | My Finance</title><style>body{font-family:Tahoma,sans-serif;background:#f5f8fa;color:#193643;margin:0}main{max-width:690px;margin:auto;padding:20px}a{color:#0d6b68}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}.card{background:white;border:1px solid #dfebec;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 7px 20px #133b4509}h2{font-size:17px;margin:0 0 10px}p{color:#576f7b;line-height:1.9}.amount{font-size:26px;color:#08796d;font-weight:800}.detail{font-size:14px}small{color:#667a83}#status{padding:12px 0}</style></head><body><main><header><h1>دارایی‌های من</h1><a href="./">بازگشت به My Finance</a></header><div id="status">در حال بررسی اتصال امن…</div><div id="assets"></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/+esm';const client=createClient('https://hxcjkewlaniahvuqwwbb.supabase.co','sb_publishable_KpklYvrvXyorJVy4gQOWAw_SA8zaQy6',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const status=document.querySelector('#status'),holder=document.querySelector('#assets');const fmt=n=>new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(n);const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){status.textContent='برای مشاهده دارایی‌ها، ابتدا از صفحه اصلی My Finance با حساب خود وارد شوید.'}else{const{data,error}=await client.from('finance_objects').select('payload').eq('kind','asset').order('created_at',{ascending:true});if(error){status.textContent='خطا در دریافت دارایی‌ها: '+error.message}else{const rows=(data||[]).map(r=>r.payload);const gold=rows.filter(r=>r.assetType==='gold'),cars=rows.filter(r=>r.assetType==='vehicle');const grams=gold.reduce((n,r)=>n+Number(r.quantity||0),0);status.textContent='حساب خصوصی متصل · '+fmt(grams)+' گرم طلا · '+fmt(cars.length)+' خودرو';for(const a of rows){const article=document.createElement('article');article.className='card';const h=document.createElement('h2');h.textContent=a.name;const p=document.createElement('p');p.className='amount';p.textContent=a.assetType==='gold'?fmt(a.quantity)+' گرم':fmt(a.quantity||1)+' دستگاه';const d=document.createElement('p');d.className='detail';d.textContent=a.assetType==='gold'?'نگهداری: '+(a.custodian||'نامشخص')+' · عیار نامشخص':'پژو ۲۰۶ تیپ ۲ · مدل ۱۳۹۶';const v=document.createElement('small');v.textContent=a.marketValueIRT==null?'ارزش بازار اعلام نشده':fmt(a.marketValueIRT)+' تومان';article.append(h,p,d,v);holder.append(article)}}}</script></body></html>
