<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a43"><title>نمونه رایگان راه‌اندازی کسب‌وکار</title><link rel="icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css?v=1">
<style>.sample{max-width:840px;margin:24px auto}.sample-hero{background:linear-gradient(115deg,#123e37,#277054);padding:22px 24px;border-radius:19px;color:white;margin-bottom:17px}.sample-hero h1{font-size:1.55rem;margin:4px 0}.sample-hero p{font-size:.82rem;color:#e3f2e8;margin:0}.sample .form-grid{gap:12px}.sample .panel{margin:0 0 16px}.sample .field{font-size:.86rem}.sample-result[hidden]{display:none!important}.sample-result h2{font-size:1.25rem;margin:0}.sample-result p{font-size:.85rem}.sample-result .tip{background:#f0f7ef;border-radius:12px;padding:12px;margin:10px 0}.sample-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}@media(max-width:580px){.sample{margin:14px auto}.sample-hero{padding:18px}.sample-hero h1{font-size:1.3rem}.sample .form-grid{grid-template-columns:1fr}}</style>
<script src="./demo.js?v=1" defer></script></head><body>
<header class="top"><div class="shell top-inner"><a class="brand" href="./index.html"><span class="brand-mark">رشد</span><span>راه‌اندازی کسب‌وکار</span></a><a class="btn primary" href="./index.html">نسخه کامل</a></div></header>
<main class="shell"><div class="sample">
<div class="sample-hero"><h1>ایده کسب‌وکار داری؟</h1><p>با چند انتخاب ساده، اولین قدم مناسب خودت را پیدا کن.</p></div>
<section class="panel" aria-label="پرسشنامه کوتاه"><form id="demoForm"><div class="form-grid">
<label class="field"><span>نام ایده یا کسب‌وکار</span><input name="name" required placeholder="مثلاً فروشگاه محلی"></label>
<label class="field"><span>حوزه فعالیت</span><select name="industry" required><option value="">انتخاب کنید</option><option>فروشگاه و خرده‌فروشی</option><option>خدمات</option><option>تولید و صنعت</option><option>سلامت و زیبایی</option><option>غذا و رستوران</option><option>فناوری و نرم‌افزار</option><option>آموزش</option><option>سایر</option></select></label>
<label class="field"><span>وضعیت کنونی</span><select name="stage"><option>فقط ایده دارم</option><option>در حال راه‌اندازی هستم</option><option>فروش واقعی داریم</option><option>می‌خواهیم توسعه پیدا کنیم</option></select></label>
<label class="field"><span>مشتری اصلی مشخص است؟</span><select name="customer"><option>بله، دقیق می‌دانیم چه کسی است</option><option>تصور اولیه داریم</option><option>هنوز مشخص نیست</option></select></label>
<label class="field"><span>اولین فروش انجام شده؟</span><select name="sales"><option>بله، فروش واقعی داشته‌ایم</option><option>در حال مذاکره با مشتری هستیم</option><option>هنوز خیر</option></select></label>
<label class="field"><span>قیمت و هزینه‌ها مشخص‌اند؟</span><select name="finance"><option>بله، با ارقام واقعی</option><option>تا حدی برآورد کرده‌ایم</option><option>هنوز محاسبه نکرده‌ایم</option></select></label>
<label class="field"><span>اولویت سه ماه آینده</span><select name="goal"><option>اولین مشتری و فروش</option><option>افزایش فروش</option><option>بهبود سودآوری</option><option>نظم عملیاتی و تیم</option></select></label>
</div><div class="actions"><button type="submit" class="btn primary">دیدن پیشنهاد اولیه</button><button type="button" id="clearDemo" class="btn subtle">پاک‌کردن پاسخ‌ها</button></div></form></section>
<section class="panel sample-result" id="demoResult" hidden><h2 id="demoHeading">مسیر پیشنهادی شما</h2><p id="demoDescription"></p><div id="demoTips"></div>
<div class="sample-actions"><a class="btn primary" href="./index.html">تکمیل مسیر ۱۰مرحله‌ای</a><button type="button" class="btn subtle" id="printDemo">چاپ نتیجه</button></div></section>
</div></main></body></html>
