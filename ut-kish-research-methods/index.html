<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#125e81"><title>روش تحقیق | پردیس کیش دانشگاه تهران</title><style>
*{box-sizing:border-box} :root{--bg:#eef6f9;--card:#fff;--ink:#123044;--muted:#536d7b;--line:#d8e7ed;--accent:#12698b;--hero:#075477;--soft:#e2f3f7} [data-theme=sea]{--bg:#edf8f5;--card:#fff;--ink:#123b36;--muted:#52736b;--line:#d3e7e0;--accent:#087c73;--hero:#065d59;--soft:#def4ee} [data-theme=night]{--bg:#101e2b;--card:#192d3d;--ink:#eaf7ff;--muted:#b2c8d5;--line:#365062;--accent:#80d5f1;--hero:#153d57;--soft:#233e50} body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;font-size:15px;line-height:1.85} button,input,textarea,select{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e0aa43;outline-offset:2px} header{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:10px 4vw;display:flex;align-items:center;gap:10px} header img{width:43px;height:43px;object-fit:contain;background:white;border-radius:8px;padding:3px} header strong{font-size:15px;display:block} header small{display:block;color:var(--muted);font-size:11px} header select{margin-right:auto;width:auto;min-width:90px} main{max-width:1050px;margin:auto;padding:22px 16px 90px} .hero{border-radius:22px;overflow:hidden;min-height:245px;background:linear-gradient(90deg,rgba(5,42,65,.24),rgba(5,42,65,.95) 78%),url('https://static2.ilna.ir/thumbnail/KTj0RSYCJ3av/YdHYY4gWkVxziNocTLLHoQVar3TrxmvO0e6SENMutiBXz7JNO2nT2KLgCR9h7O_-yMtFV2AKWHv4l_4LeI27Qq4xQIoDjB_gIQDHEiqNepRBeBVXNnV0plNiYxFhdvXk7otfNPZWXfo%2C/1703456.jpg') center 38%/cover,var(--hero);color:#fff;padding:32px 25px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(28px,5vw,43px);margin:0 0 3px;line-height:1.5}.hero p{margin:5px 0}.eyebrow{font-size:12px;color:#c2eaf3;font-weight:bold;letter-spacing:.2px}.tag{display:inline-block;border-radius:8px;background:var(--soft);color:var(--ink);font-size:12px;padding:4px 10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:right;padding:17px;color:var(--ink);width:100%;min-height:100px}.tile:hover{border-color:var(--accent)}.tile strong{display:block;font-size:17px}.tile small{color:var(--muted);display:block}.number{display:inline-block;font-size:12px;font-weight:bold;color:var(--accent);margin-bottom:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.primary,.secondary,.danger{border:1px solid var(--accent);border-radius:10px;padding:9px 16px;font-weight:bold;background:var(--accent);color:var(--card)}.secondary{background:var(--card);color:var(--accent)}.danger{background:var(--card);color:#c75151;border-color:#c75151}.wide{width:100%} h2{font-size:22px;margin:18px 0 10px} h3{font-size:17px;margin:5px 0 12px} p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.notice{border-right:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:10px;font-size:13px;margin:15px 0}.field{display:block;margin:12px 0;font-weight:bold} input,textarea,select{display:block;width:100%;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px} textarea{min-height:100px;resize:vertical} nav{position:fixed;bottom:0;right:0;left:0;z-index:4;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px max(8px,env(safe-area-inset-bottom))}nav button{flex:1;max-width:180px;border:0;background:none;color:var(--muted);font-size:13px;padding:9px 4px;border-radius:9px}nav button.active{background:var(--soft);color:var(--accent);font-weight:bold} .back{background:none;border:0;color:var(--accent);font-weight:bold;padding:5px 0} .item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.progress{height:7px;border-radius:20px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}a{color:var(--accent)}.score{font-size:26px;font-weight:bold;color:var(--accent)}.empty{color:var(--muted);padding:10px 0}footer{font-size:11px;color:var(--muted);text-align:center;margin:25px 0} @media(max-width:550px){main{padding:14px 12px 80px}.hero{min-height:210px;padding:24px 18px}.grid{grid-template-columns:1fr 1fr;gap:9px}.tile{padding:13px;min-height:105px}.tile strong{font-size:15px}.panel{padding:14px}.fullmobile{grid-column:1/-1}}
</style></head><body><header><img src="https://commons.wikimedia.org/wiki/Special:FilePath/University%20of%20Tehran%20Main%20Entrance.svg" alt="نشان سردر دانشگاه تهران"><div><strong>دانشگاه تهران</strong><small>پردیس بین‌المللی کیش</small></div><select id="theme" aria-label="پوسته"><option value="blue">آبی دانشگاهی</option><option value="sea">فیروزه‌ای کیش</option><option value="night">تیره</option></select></header><main id="app"></main><nav id="nav"></nav><script>
"use strict";
const syllabus=[["آشنایی با پژوهش در مدیریت","شناخت کاربرد پژوهش در تصمیم‌گیری مدیریتی و اخلاق علمی","یک تصمیم مدیریتی را انتخاب کنید و توضیح دهید چه شواهدی برای آن نیاز دارید."],["انتخاب موضوع و بیان مسئله","تمایز موضوع، مسئله و شکاف پژوهشی","یک مسئله از کسب‌وکارهای کیش انتخاب و در ۱۵۰ کلمه بیان کنید."],["اهداف و سؤالات پژوهش","تدوین هدف اصلی و سؤالات قابل بررسی","برای مسئله خود یک هدف اصلی و سه سؤال پژوهشی بنویسید."],["جست‌وجو و مرور ادبیات","یافتن منابع معتبر، ارزیابی و ارجاع‌دهی","سه منبع علمی مرتبط پیدا و یافته اصلی هرکدام را خلاصه کنید."],["مبانی نظری و چارچوب مفهومی","تمایز مفهوم، نظریه و مدل پژوهش","یک مدل مفهومی ساده برای موضوع خود ترسیم کنید."],["متغیرها و فرضیه‌ها","تعریف عملیاتی متغیرها و تدوین فرضیه آزمون‌پذیر","متغیرهای مستقل و وابسته را مشخص و دو فرضیه پیشنهاد کنید."],["طرح پژوهش و رویکردها","شناخت پژوهش کمی، کیفی و آمیخته؛ توصیفی و علّی","روش متناسب با سؤال پژوهش خود را همراه با دلیل انتخاب کنید."],["مرور و ارزشیابی میان‌ترم","مرور انسجام مسئله تا روش پژوهش","پیشنهاد اولیه پژوهش خود را در یک صفحه تحویل دهید."],["جامعه آماری و نمونه‌گیری","تشخیص جامعه، نمونه و روش‌های احتمالی و غیراحتمالی","جامعه هدف و روش نمونه‌گیری مناسب پژوهش خود را تعیین کنید."],["ابزار گردآوری داده‌ها","طراحی پرسشنامه، مصاحبه و مشاهده","پنج گویه پرسشنامه یا پنج سؤال مصاحبه طراحی کنید."],["روایی، پایایی و اخلاق پژوهش","بررسی کیفیت ابزار و رضایت آگاهانه","دو تهدید اعتبار ابزار را شناسایی و راه کاهش آن‌ها را توضیح دهید."],["گردآوری و آماده‌سازی داده‌ها","کدگذاری، پاک‌سازی داده و رعایت محرمانگی","یک جدول داده فرضی ده‌ردیفی آماده کنید و خطاهای احتمالی را بررسی کنید."],["تحلیل داده‌های کمی","آمار توصیفی، همبستگی و تفسیر اولیه","یک نمودار و یک شاخص توصیفی از داده‌های نمونه تهیه و تفسیر کنید."],["تحلیل داده‌های کیفی","کدگذاری، مقوله‌بندی و استخراج مضامین","یک متن مصاحبه فرضی کوتاه را کدگذاری و دو مضمون استخراج کنید."],["گزارش‌نویسی و نتیجه‌گیری","ساختار گزارش، محدودیت‌ها، ارجاع و پیشنهاد مدیریتی","پیش‌نویس گزارش پژوهش را با نتیجه و محدودیت‌ها آماده کنید."],["ارائه پروژه نهایی و جمع‌بندی","دفاع مستدل از تصمیم‌های روش‌شناختی و کاربرد یافته‌ها","گزارش نهایی و ارائه کوتاه پژوهش خود را تحویل دهید."]];
const key="ut-kish-rm-demo-v1";let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db.people??=[];db.sessions??={};db.records??={};db.theme??="blue";let role="student",person="",page="home",sid=0,tab="content";const $=id=>document.getElementById(id),app=$("app");const fa=n=>Number(n).toLocaleString("fa-IR");const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch{alert("فضای ذخیره‌سازی مرورگر کافی نیست.");return false}}function getS(i){return db.sessions[i]??={notes:"",files:[],task:syllabus[i][2],open:false,code:""}}function rec(i,p=person){let k=i+"|"+p;return db.records[k]??={attendance:"ثبت نشده",answer:"",grade:null,feedback:""}}function go(p){page=p;render();window.scrollTo(0,0)}function session(i){sid=i;tab="content";go("session")}function choose(t){tab=t;render()}function nav(){let items=[["home","خانه"],["syllabus","طرح درس"],["sessions","جلسات"],["profile",role==="teacher"?"داشبورد مدرس":"پرونده من"]];$("nav").innerHTML=items.map(([p,l])=>'<button class="'+(page===p||p==="sessions"&&page==="session"?"active":"")+'" onclick="go(\''+p+'\')">'+l+'</button>').join("")}function tile(title,sub,action){return '<button class="tile" onclick="'+action+'"><strong>'+title+'</strong><small>'+sub+'</small></button>'}function mode(){return '<div class="notice">نسخه آزمایشی؛ اطلاعات فقط در همین مرورگر ذخیره می‌شوند. از اطلاعات واقعی دانشجویان استفاده نکنید. ورود مدرس و دانشجو در این نسخه صرفاً شبیه‌سازی است.</div>'}function home(){return '<section class="hero"><div class="eyebrow">کارشناسی مدیریت · پردیس بین‌المللی کیش</div><h1>روش تحقیق</h1><p>از مسئله مدیریتی تا پژوهش علمی</p><p>مدرس: سرکار خانم دکتر بغدادی</p><div><span style="color:#d3f0f8">۱۶ جلسه آموزشی</span></div></section>'+mode()+'<section class="panel"><h3>مسیر ورود</h3><div class="row"><button class="'+(role==="student"?"primary":"secondary")+'" onclick="setRole(\'student\')">ورود دانشجو (آزمایشی)</button><button class="'+(role==="teacher"?"primary":"secondary")+'" onclick="setRole(\'teacher\')">ورود مدرس (آزمایشی)</button></div>'+(role==="student"?'<label class="field">نام آزمایشی دانشجو<input id="name" placeholder="مثلاً دانشجوی نمونه" maxlength="60" value="'+e(person)+'"></label><button class="primary" onclick="register()">ورود به کلاس</button>':'<p class="muted">پنل مدیریت کلاس و محتوای آموزشی</p><button class="primary" onclick="go(\'profile\')">داشبورد مدرس</button>')+'</section><div class="grid">'+tile("طرح درس","اهداف، سرفصل‌ها و شیوه ارزشیابی","go('syllabus')")+tile("جلسات آموزشی","۱۶ جلسه، جزوه و فعالیت","go('sessions')")+'</div><footer>تصویر پردیس: <a href="https://www.ilna.ir/" target="_blank" rel="noopener">ایلنا</a> · نشان سردر: <a href="https://commons.wikimedia.org/wiki/File:University_of_Tehran_Main_Entrance.svg" target="_blank" rel="noopener">ویکی‌انبار</a> · <a href="https://kish.ut.ac.ir/" target="_blank" rel="noopener">وب‌سایت پردیس</a></footer>'}function setRole(r){role=r;render()}function register(){let n=$("name").value.trim();if(!n)return alert("نام آزمایشی را وارد کنید.");person=n;if(!db.people.includes(n))db.people.push(n);save();go("sessions")}function outline(){return '<h2>طرح درس</h2><div class="panel"><h3>اهداف یادگیری</h3><p>تشخیص مسئله قابل پژوهش؛ تدوین سؤال، چارچوب و فرضیه؛ انتخاب روش و ابزار گردآوری داده؛ تحلیل مقدماتی و گزارش مستدل با رعایت اخلاق پژوهش.</p><h3>شیوه پیشنهادی ارزشیابی</h3><p>مشارکت و فعالیت: ۲۰٪ · میان‌ترم: ۲۰٪ · پروژه پژوهشی: ۳۰٪ · پایان‌ترم: ۳۰٪</p><p class="muted">طرح اولیه، قابل بازبینی و تأیید مدرس.</p><h3>منابع پیشنهادی</h3><p>روش تحقیق در مدیریت، اوما سکاران و راجر بوجی؛ روش‌های تحقیق در کسب‌وکار، ساندرز و همکاران؛ طرح پژوهش، کرسول و کرسول.</p></div><div class="panel">'+syllabus.map((s,i)=>'<div class="item"><span class="number">جلسه '+fa(i+1)+'</span><br><strong>'+e(s[0])+'</strong><div class="muted">'+e(s[1])+'</div><button class="back" onclick="session('+i+')">ورود به جلسه ←</button></div>').join("")+'</div>'}function sessions(){return '<h2>جلسات آموزشی</h2><p class="muted">جلسه موردنظر را انتخاب کنید.</p><div class="grid">'+syllabus.map((s,i)=>'<button class="tile" onclick="session('+i+')"><span class="number">جلسه '+fa(i+1)+'</span><strong>'+e(s[0])+'</strong><small>'+((db.sessions[i]?.files?.length||db.sessions[i]?.notes)?"محتوا موجود است":"طرح اولیه جلسه")+'</small></button>').join("")+'</div>'}function files(s){return s.files.length?s.files.map((f,i)=>'<div class="item row"><span style="flex:1;overflow-wrap:anywhere">'+e(f.name)+'</span><button class="secondary" onclick="downloadFile('+i+')">دریافت</button>'+(role==="teacher"?'<button class="danger" onclick="removeFile('+i+')">حذف</button>':'')+'</div>').join(""):'<p class="empty">هنوز فایلی بارگذاری نشده است.</p>'}function content(s){return '<div class="panel"><h3>هدف یادگیری</h3><p>'+e(syllabus[sid][1])+'</p><h3>جزوه و محتوای جلسه</h3>'+(role==="teacher"?'<textarea id="notes" placeholder="متن درس، توضیحات یا لینک منابع">'+e(s.notes)+'</textarea><button class="primary" onclick="saveNotes()">ذخیره محتوا</button><label class="field">بارگذاری فایل (حداکثر ۱ مگابایت در نسخه آزمایشی)<input id="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xlsx,.txt,.png,.jpg,.jpeg"></label><button class="secondary" onclick="upload()">افزودن فایل</button>':'<p style="white-space:pre-wrap">'+e(s.notes||"محتوای تکمیلی پس از بارگذاری مدرس در دسترس قرار می‌گیرد.")+'</p>')+files(s)+'</div>'}function saveNotes(){getS(sid).notes=$("notes").value; if(save())render()}async function upload(){let f=$("file").files[0];if(!f)return alert("فایل انتخاب کنید.");if(f.size>1048576)return alert("حداکثر حجم فایل ۱ مگابایت است.");let reader=new FileReader();reader.onload=()=>{let s=getS(sid);s.files.push({name:f.name,data:reader.result});if(save())render();else s.files.pop()};reader.onerror=()=>alert("خواندن فایل ناموفق بود.");reader.readAsDataURL(f)}function removeFile(i){if(confirm("فایل حذف شود؟")){getS(sid).files.splice(i,1);save();render()}}function downloadFile(i){let f=getS(sid).files[i],a=document.createElement("a");a.href=f.data;a.download=f.name;a.click()}function requirePerson(){return '<p class="notice">ابتدا از صفحه خانه با یک نام آزمایشی وارد شوید.</p><button class="secondary" onclick="go(\'home\')">ورود دانشجو</button>'}function activity(s){return '<div class="panel"><h3>فعالیت جلسه</h3>'+(role==="teacher"?'<textarea id="task">'+e(s.task)+'</textarea><button class="primary" onclick="saveTask()">ذخیره تکلیف</button><h3>پاسخ‌های دانشجویان آزمایشی</h3>'+db.people.filter(p=>rec(sid,p).answer).map(p=>'<div class="item"><strong>'+e(p)+'</strong><p style="white-space:pre-wrap">'+e(rec(sid,p).answer)+'</p></div>').join(""): '<p>'+e(s.task)+'</p>'+(person?'<textarea id="answer" placeholder="پاسخ خود را بنویسید">'+e(rec(sid).answer)+'</textarea><button class="primary" onclick="submitAnswer()">ثبت پاسخ</button>':requirePerson()))+'</div>'}function saveTask(){getS(sid).task=$("task").value;save();render()}function submitAnswer(){let v=$("answer").value.trim();if(!v)return alert("پاسخ را وارد کنید.");rec(sid).answer=v;save();render();alert("پاسخ در همین مرورگر ثبت شد.")}function attendance(s){return '<div class="panel"><h3>حضور و غیاب</h3>'+(role==="teacher"?'<p>وضعیت: '+(s.open?"باز · کد "+e(s.code):"بسته")+'</p><button class="primary" onclick="toggleAttend()">'+(s.open?"بستن ثبت حضور":"بازکردن ثبت حضور و ساخت کد")+'</button><h3>فهرست آزمایشی</h3>'+db.people.map((p,i)=>'<div class="item"><strong>'+e(p)+'</strong><select aria-label="وضعیت حضور" onchange="mark('+i+',this.value)">'+["ثبت نشده","در انتظار تأیید","حاضر","غایب","موجه"].map(x=>'<option '+(rec(sid,p).attendance===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div>').join(""):person?'<p>وضعیت شما: <strong>'+e(rec(sid).attendance)+'</strong></p>'+(s.open?'<input id="code" inputmode="numeric" placeholder="کد چهاررقمی اعلام‌شده توسط مدرس"><button class="primary" onclick="checkIn()">درخواست ثبت حضور</button>':'<p class="muted">ثبت حضور این جلسه بسته است.</p>'):requirePerson())+'</div>'}function toggleAttend(){let s=getS(sid);s.open=!s.open;s.code=s.open?String(Math.floor(1000+Math.random()*9000)):"";save();render()}function mark(i,v){rec(sid,db.people[i]).attendance=v;save()}function checkIn(){let s=getS(sid);if(!s.open||$("code").value.trim()!==s.code)return alert("کد نامعتبر است.");let r=rec(sid);if(r.attendance==="حاضر"||r.attendance==="در انتظار تأیید")return alert("قبلاً ثبت شده است.");r.attendance="در انتظار تأیید";save();render()}function assessment(){return '<div class="panel"><h3>ارزشیابی جلسه</h3>'+(role==="teacher"?db.people.length?db.people.map((p,i)=>{let r=rec(sid,p);return '<div class="item"><strong>'+e(p)+'</strong><p class="muted">'+(r.answer?"فعالیت ثبت شده":"بدون فعالیت")+'</p><label class="field">نمره از ۲۰<input type="number" min="0" max="20" step=".25" id="grade'+i+'" value="'+e(r.grade??"")+'"></label><textarea id="feed'+i+'" placeholder="بازخورد مدرس">'+e(r.feedback)+'</textarea><button class="primary" onclick="grade('+i+')">ثبت ارزشیابی</button></div>'}).join(""):'<p class="empty">هنوز دانشجوی آزمایشی ثبت نشده است.</p>':person?'<p>نمره: <strong>'+e(rec(sid).grade??"هنوز ثبت نشده")+'</strong></p><p style="white-space:pre-wrap">'+e(rec(sid).feedback||"بازخورد مدرس پس از ارزشیابی نمایش داده می‌شود.")+'</p>':requirePerson())+'</div>'}function grade(i){let g=$("grade"+i).value;if(g===""||Number(g)<0||Number(g)>20)return alert("نمره باید بین صفر و بیست باشد.");let r=rec(sid,db.people[i]);r.grade=Number(g);r.feedback=$("feed"+i).value;save();render()}function sessionPage(){let s=getS(sid);return '<button class="back" onclick="go(\'sessions\')">← بازگشت به جلسات</button><div class="hero" style="min-height:145px;padding:20px"><span class="eyebrow">جلسه '+fa(sid+1)+' از ۱۶</span><h1 style="font-size:26px">'+e(syllabus[sid][0])+'</h1></div><div class="grid" style="margin-top:14px">'+[["content","محتوا و جزوه"],["activity","فعالیت"],["attendance","حضور و غیاب"],["assessment","ارزشیابی"]].map(([k,v])=>'<button class="'+(tab===k?"primary":"secondary")+'" onclick="choose(\''+k+'\')">'+v+'</button>').join("")+'</div>'+({content,activity,attendance,assessment}[tab])(s)}function profile(){if(role==="teacher"){return '<h2>داشبورد مدرس</h2>'+mode()+'<div class="grid"><div class="panel"><div class="score">'+fa(db.people.length)+'</div>دانشجوی آزمایشی</div><div class="panel"><div class="score">'+fa(Object.values(db.records).filter(r=>r.answer).length)+'</div>فعالیت ثبت‌شده</div></div><button class="primary" onclick="go(\'sessions\')">مدیریت جلسات</button><div class="panel"><h3>پرونده دانشجویان</h3>'+db.people.map(p=>'<div class="item"><strong>'+e(p)+'</strong><p class="muted">حضور تأییدشده: '+fa(syllabus.filter((_,i)=>rec(i,p).attendance==="حاضر").length)+' از ۱۶ · فعالیت: '+fa(syllabus.filter((_,i)=>rec(i,p).answer).length)+' از ۱۶</p></div>').join("")+'<button class="secondary" onclick="exportData()">خروجی JSON آزمایشی</button></div>'}if(!person)return '<h2>پرونده من</h2>'+requirePerson();let n=syllabus.filter((_,i)=>rec(i).answer).length;return '<h2>پرونده '+e(person)+'</h2><div class="panel"><h3>پیشرفت فعالیت‌ها</h3><p>'+fa(n)+' از ۱۶ جلسه</p><div class="progress"><i style="width:'+n/16*100+'%"></i></div></div><div class="panel">'+syllabus.map((s,i)=>{let r=rec(i);return '<div class="item"><strong>'+fa(i+1)+' · '+e(s[0])+'</strong><p class="muted">حضور: '+e(r.attendance)+' · فعالیت: '+(r.answer?"ثبت‌شده":"ثبت نشده")+' · نمره: '+e(r.grade??"—")+'</p></div>'}).join("")+'</div>'}function exportData(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=u;a.download="kish-research-demo.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(){app.innerHTML=({home,syllabus:outline,sessions,session:sessionPage,profile}[page])();nav()}$("theme").value=db.theme;document.documentElement.dataset.theme=db.theme;$("theme").onchange=()=>{db.theme=$("theme").value;document.documentElement.dataset.theme=db.theme;save()};render();
</script></body></html>
