"use strict";
const syllabus=[["آشنایی با پژوهش در مدیریت","شناخت کاربرد پژوهش در تصمیم‌گیری مدیریتی و اخلاق علمی","یک تصمیم مدیریتی را انتخاب کنید و توضیح دهید چه شواهدی برای آن نیاز دارید."],["انتخاب موضوع و بیان مسئله","تمایز موضوع، مسئله و شکاف پژوهشی","یک مسئله از کسب‌وکارهای کیش انتخاب و در ۱۵۰ کلمه بیان کنید."],["اهداف و سؤالات پژوهش","تدوین هدف اصلی و سؤالات قابل بررسی","برای مسئله خود یک هدف اصلی و سه سؤال پژوهشی بنویسید."],["جست‌وجو و مرور ادبیات","یافتن منابع معتبر، ارزیابی و ارجاع‌دهی","سه منبع علمی مرتبط پیدا و یافته اصلی هرکدام را خلاصه کنید."],["مبانی نظری و چارچوب مفهومی","تمایز مفهوم، نظریه و مدل پژوهش","یک مدل مفهومی ساده برای موضوع خود ترسیم کنید."],["متغیرها و فرضیه‌ها","تعریف عملیاتی متغیرها و تدوین فرضیه آزمون‌پذیر","متغیرهای مستقل و وابسته را مشخص و دو فرضیه پیشنهاد کنید."],["طرح پژوهش و رویکردها","شناخت پژوهش کمی، کیفی و آمیخته؛ توصیفی و علّی","روش متناسب با سؤال پژوهش خود را همراه با دلیل انتخاب کنید."],["مرور و ارزشیابی میان‌ترم","مرور انسجام مسئله تا روش پژوهش","پیشنهاد اولیه پژوهش خود را در یک صفحه تحویل دهید."],["جامعه آماری و نمونه‌گیری","تشخیص جامعه، نمونه و روش‌های احتمالی و غیراحتمالی","جامعه هدف و روش نمونه‌گیری مناسب پژوهش خود را تعیین کنید."],["ابزار گردآوری داده‌ها","طراحی پرسشنامه، مصاحبه و مشاهده","پنج گویه پرسشنامه یا پنج سؤال مصاحبه طراحی کنید."],["روایی، پایایی و اخلاق پژوهش","بررسی کیفیت ابزار و رضایت آگاهانه","دو تهدید اعتبار ابزار را شناسایی و راه کاهش آن‌ها را توضیح دهید."],["گردآوری و آماده‌سازی داده‌ها","کدگذاری، پاک‌سازی داده و رعایت محرمانگی","یک جدول داده فرضی ده‌ردیفی آماده کنید و خطاهای احتمالی را بررسی کنید."],["تحلیل داده‌های کمی","آمار توصیفی، همبستگی و تفسیر اولیه","یک نمودار و یک شاخص توصیفی از داده‌های نمونه تهیه و تفسیر کنید."],["تحلیل داده‌های کیفی","کدگذاری، مقوله‌بندی و استخراج مضامین","یک متن مصاحبه فرضی کوتاه را کدگذاری و دو مضمون استخراج کنید."],["گزارش‌نویسی و نتیجه‌گیری","ساختار گزارش، محدودیت‌ها، ارجاع و پیشنهاد مدیریتی","پیش‌نویس گزارش پژوهش را با نتیجه و محدودیت‌ها آماده کنید."],["ارائه پروژه نهایی و جمع‌بندی" 8 40h1v1h-1zM39 40h1v1h-1zM40 40h1v1h-1z" fill="black"/></svg></a><div style="flex:1;min-width:180px"><h3>ورود سریع به کلاس</h3><p>با دوربین موبایل، کد QR را اسکن کنید.</p><p class="muted">مناسب نمایش روی پرده کلاس و ورود دانشجویان</p><a href="https://hassnboudlaie.github.io/hasan-boudlaie/ut-kish-research-methods/" class="secondary" style="display:inline-block;text-decoration:none">لینک مستقیم ورود</a></div></section>'+mode()+'<section class="panel"><h3>مسیر ورود</h3><div class="row"><button class="'+(role==="student"?"primary":"secondary")+'" onclick="setRole(\'student\')">ورود دانشجو (آزمایشی)</button><button class="'+(role==="teacher"?"primary":"secondary")+'" onclick="setRole(\'teacher\')">ورود مدرس (آزمایشی)</button></div>'+(role==="student"?'<label class="field">نام آزمایشی دانشجو<input id="name" placeholder="مثلاً دانشجوی نمونه" maxlength="60" value="'+e(person)+'"></label><button class="primary" onclick="register()">ورود به کلاس</button>':'<p class="muted">پنل مدیریت کلاس و محتوای آموزشی</p><button class="primary" onclick="go(\'profile\')">داشبورد مدرس</button>')+'</section><div class="grid">'+tile("طرح درس","اهداف، سرفصل‌ها و شیوه ارزشیابی","go('syllabus')")+tile("جلسات آموزشی","۱۶ جلسه، جزوه و فعالیت","go('sessions')")+'</div><footer>تصویر پردیس: <a href="https://www.ilna.ir/" target="_blank" rel="noopener">ایلنا</a> · نشان دانشگاه: <a href="https://leverageedu.com/universities/university-of-tehran/" target="_blank" rel="noopener">منبع تصویر</a> · <a href="https://kish.ut.ac.ir/" target="_blank" rel="noopener">وب‌سایت پردیس</a></footer>'}function setRole(r){role=r;render()}function register(){let n=$("name").value.trim();if(!n)return alert("نام آزمایشی را وارد کنید.");person=n;if(!db.people.includes(n))db.people.push(n);save();go("sessions")}function outline(){return '<h2>طرح درس</h2><div class="panel"><h3>اهداف یادگیری</h3><p>تشخیص مسئله قابل پژوهش؛ تدوین سؤال، چارچوب و فرضیه؛ انتخاب روش و ابزار گردآوری داده؛ تحلیل مقدماتی و گزارش مستدل با رعایت اخلاق پژوهش.</p><h3>شیوه پیشنهادی ارزشیابی</h3><p>مشارکت و فعالیت: ۲۰٪ · میان‌ترم: ۲۰٪ · پروژه پژوهشی: ۳۰٪ · پایان‌ترم: ۳۰٪</p><p class="muted">طرح اولیه، قابل بازبینی و تأیید مدرس.</p><h3>منابع پیشنهادی</h3><p>روش تحقیق در مدیریت، اوما سکاران و راجر بوجی؛ روش‌های تحقیق در کسب‌وکار، ساندرز و همکاران؛ طرح پژوهش، کرسول و کرسول.</p></div><div class="panel">'+syllabus.map((s,i)=>'<div class="item"><span class="number">جلسه '+fa(i+1)+'</span><br><strong>'+e(s[0])+'</strong><div class="muted">'+e(s[1])+'</div><button class="back" onclick="session('+i+')">ورود به جلسه ←</button></div>').join("")+'</div>'}function sessions(){return '<h2>جلسات آموزشی</h2><p class="muted">جلسه موردنظر را انتخاب کنید.</p><div class="grid">'+syllabus.map((s,i)=>'<button class="tile" onclick="session('+i+')"><span class="number">جلسه '+fa(i+1)+'</span><strong>'+e(s[0])+'</strong><small>'+((db.sessions[i]?.files?.length||db.sessions[i]?.notes)?"محتوا موجود است":"طرح اولیه جلسه")+'</small></button>').join("")+'</div>'}function files(s){return s.files.length?s.files.map((f,i)=>'<div class="item row"><span style="flex:1;overflow-wrap:anywhere">'+e(f.name)+'</span><button class="secondary" onclick="downloadFile('+i+')">دریافت</button>'+(role==="teacher"?'<button class="danger" onclick="removeFile('+i+')">حذف</button>':'')+'</div>').join(""):'<p class="empty">هنوز فایلی بارگذاری نشده است.</p>'}function content(s){return '<div class="panel"><h3>هدف یادگیری</h3><p>'+e(syllabus[sid][1])+'</p><h3>جزوه و محتوای جلسه</h3>'+(role==="teacher"?'<textarea id="notes" placeholder="متن درس، توضیحات یا لینک منابع">'+e(s.notes)+'</textarea><button class="primary" onclick="saveNotes()">ذخیره محتوا</button><label class="field">بارگذاری فایل (حداکثر ۱ مگابایت در نسخه آزمایشی)<input id="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xlsx,.txt,.png,.jpg,.jpeg"></label><button class="secondary" onclick="upload()">افزودن فایل</button>':'<p style="white-space:pre-wrap">'+e(s.notes||"محتوای تکمیلی پس از بارگذاری مدرس در دسترس قرار می‌گیرد.")+'</p>')+files(s)+'</div>'}function saveNotes(){getS(sid).notes=$("notes").value; if(save())render()}async function upload(){let f=$("file").files[0];if(!f)return alert("فایل انتخاب کنید.");if(f.size>1048576)return alert("حداکثر حجم فایل ۱ مگابایت است.");let reader=new FileReader();reader.onload=()=>{let s=getS(sid);s.files.push({name:f.name,data:reader.result});if(save())render();else s.files.pop()};reader.onerror=()=>alert("خواندن فایل ناموفق بود.");reader.readAsDataURL(f)}function removeFile(i){if(confirm("فایل حذف شود؟")){getS(sid).files.splice(i,1);save();render()}}function downloadFile(i){let f=getS(sid).files[i],a=document.createElement("a");a.href=f.data;a.download=f.name;a.click()}function requirePerson(){return '<p class="notice">ابتدا از صفحه خانه با یک نام آزمایشی وارد شوید.</p><button class="secondary" onclick="go(\'home\')">ورود دانشجو</button>'}function activity(s){return '<div class="panel"><h3>فعالیت جلسه</h3>'+(role==="teacher"?'<textarea id="task">'+e(s.task)+'</textarea><button class="primary" onclick="saveTask()">ذخیره تکلیف</button><h3>پاسخ‌های دانشجویان آزمایشی</h3>'+db.people.filter(p=>rec(sid,p).answer).map(p=>'<div class="item"><strong>'+e(p)+'</strong><p style="white-space:pre-wrap">'+e(rec(sid,p).answer)+'</p></div>').join(""): '<p>'+e(s.task)+'</p>'+(person?'<textarea id="answer" placeholder="پاسخ خود را بنویسید">'+e(rec(sid).answer)+'</textarea><button class="primary" onclick="submitAnswer()">ثبت پاسخ</button>':requirePerson()))+'</div>'}function saveTask(){getS(sid).task=$("task").value;save();render()}function submitAnswer(){let v=$("answer").value.trim();if(!v)return alert("پاسخ را وارد کنید.");rec(sid).answer=v;save();render();alert("پاسخ در همین مرورگر ثبت شد.")}function attendance(s){return '<div class="panel"><h3>حضور و غیاب</h3>'+(role==="teacher"?'<p>وضعیت: '+(s.open?"باز · کد "+e(s.code):"بسته")+'</p><button class="primary" onclick="toggleAttend()">'+(s.open?"بستن ثبت حضور":"بازکردن ثبت حضور و ساخت کد")+'</button><h3>فهرست آزمایشی</h3>'+db.people.map((p,i)=>'<div class="item"><strong>'+e(p)+'</strong><select aria-label="وضعیت حضور" onchange="mark('+i+',this.value)">'+["ثبت نشده","در انتظار تأیید","حاضر","غایب","موجه"].map(x=>'<option '+(rec(sid,p).attendance===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div>').join(""):person?'<p>وضعیت شما: <strong>'+e(rec(sid).attendance)+'</strong></p>'+(s.open?'<input id="code" inputmode="numeric" placeholder="کد چهاررقمی اعلام‌شده توسط مدرس"><button class="primary" onclick="checkIn()">درخواست ثبت حضور</button>':'<p class="muted">ثبت حضور این جلسه بسته است.</p>'):requirePerson())+'</div>'}function toggleAttend(){let s=getS(sid);s.open=!s.open;s.code=s.open?String(Math.floor(1000+Math.random()*9000)):"";save();render()}function mark(i,v){rec(sid,db.people[i]).attendance=v;save()}function checkIn(){let s=getS(sid);if(!s.open||$("code").value.trim()!==s.code)return alert("کد نامعتبر است.");let r=rec(sid);if(r.attendance==="حاضر"||r.attendance==="در انتظار تأیید")return alert("قبلاً ثبت شده است.");r.attendance="در انتظار تأیید";save();render()}function assessment(){return '<div class="panel"><h3>ارزشیابی جلسه</h3>'+(role==="teacher"?db.people.length?db.people.map((p,i)=>{let r=rec(sid,p);return '<div class="item"><strong>'+e(p)+'</strong><p class="muted">'+(r.answer?"فعالیت ثبت شده":"بدون فعالیت")+'</p><label class="field">نمره از ۲۰<input type="number" min="0" max="20" step=".25" id="grade'+i+'" value="'+e(r.grade??"")+'"></label><textarea id="feed'+i+'" placeholder="بازخورد مدرس">'+e(r.feedback)+'</textarea><button class="primary" onclick="grade('+i+')">ثبت ارزشیابی</button></div>'}).join(""):'<p class="empty">هنوز دانشجوی آزمایشی ثبت نشده است.</p>':person?'<p>نمره: <strong>'+e(rec(sid).grade??"هنوز ثبت نشده")+'</strong></p><p style="white-space:pre-wrap">'+e(rec(sid).feedback||"بازخورد مدرس پس از ارزشیابی نمایش داده می‌شود.")+'</p>':requirePerson())+'</div>'}function grade(i){let g=$("grade"+i).value;if(g===""||Number(g)<0||Number(g)>20)return alert("نمره باید بین صفر و بیست باشد.");let r=rec(sid,db.people[i]);r.grade=Number(g);r.feedback=$("feed"+i).value;save();render()}function sessionPage(){let s=getS(sid);return '<button class="back" onclick="go(\'sessions\')">← بازگشت به جلسات</button><div class="hero" style="min-height:145px;padding:20px"><span class="eyebrow">جلسه '+fa(sid+1)+' از ۱۶</span><h1 style="font-size:26px">'+e(syllabus[sid][0])+'</h1></div><div class="grid" style="margin-top:14px">'+[["content","محتوا و جزوه"],["activity","فعالیت"],["attendance","حضور و غیاب"],["assessment","ارزشیابی"]].map(([k,v])=>'<button class="'+(tab===k?"primary":"secondary")+'" onclick="choose(\''+k+'\')">'+v+'</button>').join("")+'</div>'+({content,activity,attendance,assessment}[tab])(s)}function profile(){if(role==="teacher"){return '<h2>داشبورد مدرس</h2>'+mode()+'<div class="grid"><div class="panel"><div class="score">'+fa(db.people.length)+'</div>دانشجوی آزمایشی</div><div class="panel"><div class="score">'+fa(Object.values(db.records).filter(r=>r.answer).length)+'</div>فعالیت ثبت‌شده</div></div><button class="primary" onclick="go(\'sessions\')">مدیریت جلسات</button><div class="panel"><h3>پرونده دانشجویان</h3>'+db.people.map(p=>'<div class="item"><strong>'+e(p)+'</strong><p class="muted">حضور تأییدشده: '+fa(syllabus.filter((_,i)=>rec(i,p).attendance==="حاضر").length)+' از ۱۶ · فعالیت: '+fa(syllabus.filter((_,i)=>rec(i,p).answer).length)+' از ۱۶</p></div>').join("")+'<button class="secondary" onclick="exportData()">خروجی JSON آزمایشی</button></div>'}if(!person)return '<h2>پرونده من</h2>'+requirePerson();let n=syllabus.filter((_,i)=>rec(i).answer).length;return '<h2>پرونده '+e(person)+'</h2><div class="panel"><h3>پیشرفت فعالیت‌ها</h3><p>'+fa(n)+' از ۱۶ جلسه</p><div class="progress"><i style="width:'+n/16*100+'%"></i></div></div><div class="panel">'+syllabus.map((s,i)=>{let r=rec(i);return '<div class="item"><strong>'+fa(i+1)+' · '+e(s[0])+'</strong><p class="muted">حضور: '+e(r.attendance)+' · فعالیت: '+(r.answer?"ثبت‌شده":"ثبت نشده")+' · نمره: '+e(r.grade??"—")+'</p></div>'}).join("")+'</div>'}function exportData(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=u;a.download="kish-research-demo.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(){app.innerHTML=({home,syllabus:outline,sessions,session:sessionPage,profile}[page])();nav()}$("theme").value=db.theme;document.documentElement.dataset.theme=db.theme;$("theme").onchange=()=>{db.theme=$("theme").value;document.documentElement.dataset.theme=db.theme;save()};render();
