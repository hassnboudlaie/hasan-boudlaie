name: Public OKR and HB Super App integrity
on:
  pull_request:
    paths:
      - 'okr-service/**'
      - 'hub/**'
      - 'products.html'
      - 'index.html'
      - 'okr-consulting.html'
      - 'downloads/install.html'
      - 'strategic-management/index.html'
      - 'scripts/verify-app-directory.cjs'
      - '.github/workflows/public-okr-hub.yml'
  push:
    branches: [main]
    paths:
      - 'okr-service/**'
      - 'hub/**'
      - 'products.html'
      - 'scripts/verify-app-directory.cjs'
      - '.github/workflows/public-okr-hub.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test DOM
        run: npm install --prefix /tmp/okr-test-deps --no-save --no-package-lock --ignore-scripts jsdom@26
      - name: Check source syntax
        run: |
          node --check okr-service/model.js
          node --check okr-service/app.js
          node --check hub/catalog.js
          node --check scripts/verify-app-directory.cjs
      - name: OKR 3 public functional and isolation tests
        run: NODE_PATH=/tmp/okr-test-deps/node_modules node okr-service/tests/public-okr-regression.cjs
      - name: Website and Super App completeness
        run: node scripts/verify-app-directory.cjs
      - name: Explicitly guard client-specific OKR app
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -E '^okr-system/'; then echo 'Kish OKR files changed unexpectedly'; exit 1; fi
          echo 'Kish OKR remains outside this release'
