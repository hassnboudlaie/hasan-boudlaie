name: Website app directory integrity
on:
  pull_request:
    paths:
      - 'products.html'
      - 'hub/index.html'
      - 'scripts/verify-app-directory.cjs'
      - '.github/workflows/app-directory-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'products.html'
      - 'hub/index.html'
      - 'scripts/verify-app-directory.cjs'
      - '.github/workflows/app-directory-integrity.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify installed app links, categories, launcher and missing targets
        run: node scripts/verify-app-directory.cjs
