name: Build Clinic Customer Android APK

on:
  push:
    paths:
      - "android-clinic-app/**"
      - ".github/workflows/build-clinic-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-clinic-app
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-clinic-app/app/build/outputs/apk/debug/app-debug.apk dist/clinic-customer-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-customer-app-apk
          path: dist/clinic-customer-app.apk
          if-no-files-found: error
