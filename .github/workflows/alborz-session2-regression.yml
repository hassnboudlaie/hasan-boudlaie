name: Alborz Session 2 - Phase 5 Regression

on:
  push:
    branches: [main]
    paths:
      - 'alborz-communication-skills/**'
      - 'scripts/alborz-phase5-static-audit.mjs'
      - 'scripts/alborz-phase5-browser-qa.mjs'
      - '.github/workflows/alborz-session2-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check alborz-communication-skills/session2-core-s12-r1-20261031.js
          node --check alborz-communication-skills/session2-assessment-s12-r2-20261031.js
          node --check alborz-communication-skills/session2-ui-s12-r5-20261031.js
          node --check scripts/alborz-phase5-static-audit.mjs
      - name: Validate 10 techniques, 30 questions, 90 explanations and release integrity
        run: node scripts/alborz-phase5-static-audit.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all techniques in desktop and simulated mobile Chromium
        run: node scripts/alborz-phase5-browser-qa.mjs
      - name: Upload QA screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alborz-phase5-browser-evidence
          path: artifacts/alborz-phase5/
          if-no-files-found: warn
