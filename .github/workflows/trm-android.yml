name: TRM Android Pilot APK
on:
  push:
    paths:
      - 'trm-android/**'
      - '.github/workflows/trm-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug pilot APK
        run: cd trm-android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TRM-Workspace-Android-Pilot
          path: trm-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        run: |
          mkdir -p trm-workspace/downloads
          cp trm-android/app/build/outputs/apk/debug/app-debug.apk trm-workspace/downloads/TRM-Workspace-Android-Pilot.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trm-workspace/downloads/TRM-Workspace-Android-Pilot.apk
          git diff --cached --quiet || (git commit -m 'Publish TRM Android installable pilot package [skip ci]' && git push)