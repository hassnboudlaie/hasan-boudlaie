name: TRM Android Pilot APK
on:
  push:
    paths:
      - 'trm-android/**'
      - 'trm-workspace/render-logo.py'
      - 'trm-workspace/icon.svg'
      - '.github/workflows/trm-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure existing Android SDK on Ubuntu runner
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate TRM icon assets
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python trm-workspace/render-logo.py
      - name: Build signed debug pilot APK
        run: cd trm-android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TRM-Workspace-Android-Pilot
          path: trm-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        run: |
          mkdir -p trm-workspace/downloads
          cp trm-android/app/build/outputs/apk/debug/app-debug.apk trm-workspace/downloads/TRM-Workspace-Android-Pilot.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trm-workspace/downloads/TRM-Workspace-Android-Pilot.apk trm-workspace/icon-192.png trm-workspace/icon-512.png trm-android/app/src/main/res/drawable-nodpi/trm_brand.png
          git diff --cached --quiet || (git commit -m 'Publish TRM Android installable pilot package [skip ci]' && git push)