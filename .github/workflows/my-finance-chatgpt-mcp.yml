name: My Finance ChatGPT MCP smoke
on:
  push:
    branches: [main]
    paths:
      - "my-finance/chatgpt/**"
      - ".github/workflows/my-finance-chatgpt-mcp.yml"
  pull_request:
    paths:
      - "my-finance/chatgpt/**"
      - ".github/workflows/my-finance-chatgpt-mcp.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public protocol and blocked unauthenticated writes
        run: node my-finance/chatgpt/qa/mcp-smoke.mjs
