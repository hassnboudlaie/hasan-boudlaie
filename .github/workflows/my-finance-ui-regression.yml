name: My Finance UI regression
on:
  push:
    branches: [main]
    paths:
      - 'my-finance/**'
      - '.github/workflows/my-finance-ui-regression.yml'
  pull_request:
    paths:
      - 'my-finance/**'
      - '.github/workflows/my-finance-ui-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-ui-checks:
    name: Verify finance UI and offline shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app interface and cache
        run: node my-finance/qa/check-ui.mjs
