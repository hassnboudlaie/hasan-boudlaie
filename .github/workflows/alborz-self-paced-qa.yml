name: Alborz Resilience Independent Team QA
on:
  push:
    branches: [main]
    paths:
      - "alborz-communication-skills/resilience.html"
      - "alborz-communication-skills/resilience-game.js"
      - "alborz-communication-skills/classroom-flow.js"
      - "alborz-communication-skills/classroom-flow.css"
      - "scripts/alborz-self-paced-qa.cjs"
      - ".github/workflows/alborz-self-paced-qa.yml"
  workflow_dispatch:
jobs:
  self-paced:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify independent group progress, rounds and accessible mobile UI
        run: node scripts/alborz-self-paced-qa.cjs
