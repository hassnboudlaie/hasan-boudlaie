name: Alborz Session 4 — Authentic Poster Screenshots
on:
  pull_request:
    paths:
      - 'scripts/alborz-poster-capture.cjs'
      - '.github/workflows/alborz-poster-capture.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture actual session-four pages
        run: node scripts/alborz-poster-capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alborz-authentic-session4-poster-screens
          path: artifacts/alborz-poster-session4/*.png
          if-no-files-found: warn
