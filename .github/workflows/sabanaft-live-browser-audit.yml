name: Saba Naft deployed website — live Chromium audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sabanaft-live-browser-audit.yml'
jobs:
  live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact reviewed assets on GitHub Pages
        run: |
          for attempt in $(seq 1 60); do
            match=1
            for asset in leadership-journey.js leadership-journey-content.js leadership-journey.css sw.js; do
              curl --fail --location --silent --show-error "https://hassnboudlaie.github.io/hasan-boudlaie/sabanaft/app/$asset?release=${GITHUB_SHA}" -o "/tmp/live-$asset" || match=0
              cmp -s "sabanaft/app/$asset" "/tmp/live-$asset" || match=0
            done
            if [ "$match" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "Reviewed assets are not yet live"
          exit 1
      - name: Install Chromium browser for true deployment test
        run: |
          npm install --prefix /tmp/saba-live --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/saba-live/node_modules/.bin/playwright install --with-deps chromium
      - name: Audit published Journey at mobile and desktop widths
        env:
          NODE_PATH: /tmp/saba-live/node_modules
          SABA_TEST_URL: https://hassnboudlaie.github.io/hasan-boudlaie/sabanaft/app/#/journey
        run: node sabanaft/verify-leadership-journey-browser.cjs
      - name: Preserve screenshots of live deployed site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saba-published-site-mobile-desktop
          path: artifacts/saba-leadership-journey/
          if-no-files-found: ignore
