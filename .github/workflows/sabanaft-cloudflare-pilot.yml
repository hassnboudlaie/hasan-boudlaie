name: Saba Naft Cloudflare Pilot Deploy (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: saba-cloudflare-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required Cloudflare credentials and real D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing account API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing account ID"; exit 1; }
          ! grep -q REPLACE_WITH_D1_DATABASE_ID sabanaft/backend/cloudflare/wrangler.toml || { echo "Create dedicated D1 and configure real database ID first"; exit 1; }
          node --check sabanaft/backend/cloudflare/src/index.mjs
      - name: Apply isolated D1 schema
        working-directory: sabanaft/backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute saba-leadership-coach-pilot --remote --file=./schema.sql
      - name: Deploy Worker and AI binding
        working-directory: sabanaft/backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
