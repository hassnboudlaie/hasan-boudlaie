name: Saba Impeccable cross-browser release gate
on:
  pull_request:
    paths: ['sabanaft/**', '.github/workflows/sabanaft-impeccable.yml']
  push:
    branches: [main]
    paths: ['sabanaft/**', '.github/workflows/sabanaft-impeccable.yml']
  workflow_dispatch:
jobs:
  browser-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test engines
        run: |
          npm install --prefix /tmp/saba-qa --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          /tmp/saba-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Serve repository
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/saba-http.log 2>&1 &
      - name: Chromium and WebKit layout, keyboard, persistence, storage recovery, axe and offline
        env:
          NODE_PATH: /tmp/saba-qa/node_modules
        run: node sabanaft/verify-impeccable-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saba-impeccable-evidence
          path: artifacts/saba-impeccable/
