name: Alborz Claims Resilience - Group Learning QA
on:
  push:
    branches: [main, feat/alborz-resilience-claims-20261102, 'fix/alborz-*', 'feat/alborz-classroom-*', 'feat/alborz-conditional-*', 'feat/alborz-presentation-*', 'feat/alborz-complete-*', 'feat/alborz-free-*']
    paths:
      - 'alborz-communication-skills/index.html'
      - 'alborz-communication-skills/resilience.html'
      - 'alborz-communication-skills/resilience.css'
      - 'alborz-communication-skills/resilience.js'
      - 'alborz-communication-skills/resilience-game.*'
      - 'alborz-communication-skills/resilience-live.js'
      - 'alborz-communication-skills/classroom-flow.*'
      - 'alborz-communication-skills/strategy-cards.js'
      - 'alborz-communication-skills/backend/alborz-workshop-sync.ts'
      - 'alborz-communication-skills/claims-workshop-v2.html'
      - 'alborz-communication-skills/claims-presentation.*'
      - 'scripts/alborz-presentation-qa.cjs'
      - 'scripts/alborz-four-hour-qa.cjs'
      - 'scripts/alborz-instructor-journey-qa.cjs'
      - 'scripts/alborz-classroom-flow-qa.cjs'
      - 'scripts/alborz-resilience-browser-qa.mjs'
      - '.github/workflows/alborz-resilience-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check alborz-communication-skills/resilience-game.js
          node --check alborz-communication-skills/resilience-live.js
          node --check alborz-communication-skills/classroom-flow.js
          node --check scripts/alborz-four-hour-qa.cjs
          node --check scripts/alborz-instructor-journey-qa.cjs
          node --check scripts/alborz-classroom-flow-qa.cjs
          node --check alborz-communication-skills/claims-presentation.js
          node --check scripts/alborz-presentation-qa.cjs
          node --check scripts/alborz-resilience-browser-qa.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify desktop and simulated mobile workshop
        run: |
          node scripts/alborz-resilience-browser-qa.mjs
          node scripts/alborz-presentation-qa.cjs
          node scripts/alborz-instructor-journey-qa.cjs
          node scripts/alborz-classroom-flow-qa.cjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alborz-claims-resilience-ui-proof
          path: artifacts/alborz-resilience/
          if-no-files-found: warn
