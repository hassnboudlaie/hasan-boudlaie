@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--blue:#123f77;--ink:#18324d;--muted:#65758a;--bg:#f3f6fb;--line:#e1e8f0;--cyan:#0e8caa;--green:#15836b;--orange:#b67413}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 Vazirmatn,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:inherit;text-decoration:none}button,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 18px;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,.btn:hover{background:#edf5ff}button.primary,.primary{background:var(--blue);color:white;border-color:var(--blue)}button.danger{color:#a43737}button.small{padding:5px 12px;font-size:14px}header{height:90px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;gap:16px}.brand{display:flex;gap:14px;align-items:center}.brand-mark{width:49px;height:49px;background:var(--blue);color:white;border-radius:15px;display:grid;place-items:center;font-size:26px;font-weight:800}.brand strong{font-size:23px}.muted,small{color:var(--muted)}small{font-size:13px}.brand small{display:block;line-height:1.3}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 90px)}aside{background:white;padding:30px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:9px}aside button{justify-content:flex-start;border:0;padding:13px 16px;color:var(--muted);font-weight:500}aside button.active{background:#eaf2fc;color:var(--blue);font-weight:800}aside .foot{margin-top:auto;padding:32px 12px 0;font-size:13px;color:var(--muted)}main{padding:32px 38px;min-width:0}.topline,.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.topline{margin-bottom:24px}h1,h2,h3,p{margin:0}h1{font-size:29px;font-weight:800}h2{font-size:21px}h3{font-size:18px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--cyan);direction:ltr;text-align:right}.hero{background:linear-gradient(120deg,#124a82,#112e53);border-radius:22px;color:white;padding:28px 32px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:24px;position:relative;overflow:hidden}.hero p{color:#cfdfef;margin:8px 0 18px;max-width:630px}.hero h2{font-size:27px}.hero .primary{background:white;color:var(--blue)}.orbit{width:145px;height:145px;border-radius:50%;border:15px solid #ffffff15;border-top-color:#62c8db;border-right-color:#62c8db;display:grid;place-items:center;text-align:center;transform:rotate(-15deg)}.orbit div{transform:rotate(15deg)}.orbit strong{display:block;font-size:30px;line-height:1.2}.orbit small{color:#c2ddf3}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.metric strong{display:block;font-size:32px;line-height:1.7}.metric span{font-size:14px;color:var(--muted)}.metric .accent{color:var(--cyan)}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.panel{margin-bottom:22px}.panel>h2,.panel>.row{margin-bottom:16px}.hint{padding:13px 17px;border-radius:12px;background:#edf4fc;font-size:14px;color:#3a5877;margin:16px 0}.tag{display:inline-block;padding:3px 10px;background:#e8f6f1;border-radius:8px;font-size:13px;white-space:nowrap;color:#13755f}.tag.warn{background:#fff3dd;color:#94600e}.tag.bad{background:#fdeeed;color:#a64440}.tag.neutral{background:#edf1f6;color:#67778a}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}th{font-size:13px;color:var(--muted);font-weight:500;padding:12px;border-bottom:1px solid var(--line)}td{padding:16px 12px;border-bottom:1px solid #edf0f5;font-size:15px}tr:last-child td{border:0}.person{display:flex;align-items:center;gap:10px}.avatar{background:#edf3fb;color:var(--blue);width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700}.progress{height:7px;width:110px;background:#edf0f5;border-radius:8px;overflow:hidden}.progress i{display:block;background:var(--cyan);height:100%;border-radius:8px}.list-item{padding:16px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-item p{font-size:14px;color:var(--muted);margin-top:5px}.list-item .row{gap:8px}.empty{text-align:center;padding:48px 20px;color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,textarea{border:1px solid #cdd8e5;border-radius:10px;padding:10px 12px;background:white;color:var(--ink);width:100%;min-width:0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}textarea{min-height:96px;resize:vertical}.toolbar input{max-width:300px}.toolbar select{max-width:220px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px;font-weight:600}.fields label>input,.fields label>select,.fields label>textarea{margin-top:6px}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.score{font-size:22px;font-weight:800;color:var(--blue)}dialog{border:0;border-radius:22px;width:min(650px,94vw);max-height:92vh;padding:28px;color:var(--ink);box-shadow:0 30px 100px #0e294a55}dialog::backdrop{background:#12294480;backdrop-filter:blur(3px)}dialog h2{margin-bottom:20px}.toast{position:fixed;bottom:24px;left:24px;background:#123f77;color:white;padding:12px 24px;border-radius:14px;z-index:20;box-shadow:0 10px 30px #123f7733}.notice{font-size:13px;color:var(--muted);margin-top:14px}.back{padding:0;border:0;background:none}.step{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.step b{color:var(--cyan);font-size:22px}.step p{color:var(--muted);font-size:15px}details{padding:15px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}details p{margin-top:12px;color:var(--muted)}.print-only{display:none}@media(max-width:1000px){.shell{grid-template-columns:190px 1fr}main{padding:25px}.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.orbit{display:none}.hero{grid-template-columns:1fr}}@media(max-width:700px){header{height:auto;padding:16px}.brand strong{font-size:19px}header>.btn{font-size:12px;padding:7px}.shell{display:block}aside{padding:10px;flex-direction:row;overflow:auto;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #123f7708}aside button{font-size:14px;white-space:nowrap;padding:8px 13px}aside .foot{display:none}main{padding:22px 16px}h1{font-size:24px}.hero{padding:24px}.hero h2{font-size:23px}.metrics{gap:10px}.metric{padding:16px}.metric strong{font-size:28px}.panel{padding:17px}.fields{grid-template-columns:1fr}.topline{gap:12px}.eyebrow{font-size:10px}.wide{grid-column:auto}.toast{left:16px;right:16px}.brand small{font-size:11px}}@media print{header,aside,.toolbar,.actions,button,.hero,.notice,.topline>div:last-child{display:none!important}.shell{display:block}main{padding:0}.panel,.metric{break-inside:avoid}.print-only{display:block}.table-wrap{overflow:visible}body{font-size:12px;background:white}.columns{display:block}}
</style></head><body>

<div class="shell"><aside aria-label="منوی اصلی"><button data-nav="dashboard">◫ &nbsp; نمای کلی</button><a href="my-branch/" style="display:block;padding:13px 16px;background:#e9f5f4;color:#146d75;border:1px solid #cde7e5;border-radius:12px;font-weight:800;margin:5px 0 12px;text-decoration:none">◈ &nbsp; شعبه من · مدیریت جامع شعبه ↗</a><button data-nav="people">♙ &nbsp; کارکنان و اهداف</button><button data-nav="actions">✓ &nbsp; پیگیری و توسعه</button><button data-nav="feedback">▦ &nbsp; بازخورد مشتریان</button><button data-nav="reports">▤ &nbsp; گزارش‌ها</button><button data-nav="guide">ⓘ &nbsp; راهنما و داده‌ها</button><div class="foot">عملکرد بهتر، با گفت‌وگوی بهتر.<br><br>طراحی و چارچوب: دکتر حسن بودلایی<br>نسخه مستقل · ذخیره در این مرورگر</div></aside><main id="main"></main></div>

<script>
'use strict';
const KEY='alborz-performance-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:1}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({version:1,demo:true,period:'مهر ۱۴۰۵',people:[{id:'p1',name:'کارمند نمونه ۱',role:'کارشناس صدور',branch:'شعبه نمونه مرکزی'},{id:'p2',name:'کارمند نمونه ۲',role:'کارشناس خسارت',branch:'شعبه نمونه مرکزی'},{id:'p3',name:'کارمند نمونه ۳',role:'کارشناس فروش',branch:'شعبه نمونه غرب'},{id:'p4',name:'کارمند نمونه ۴',role:'کارشناس وصول',branch:'شعبه نمونه غرب'}],goals:[{id:'g1',person:'p1',title:'صدور بدون خطای بیمه‌نامه',unit:'درصد',target:98,actual:97,weight:60,direction:'up',evidence:'نمونه فرضی: بررسی ۱۰۰ پرونده صدور'},{id:'g2',person:'p1',title:'میانگین زمان صدور',unit:'دقیقه',target:15,actual:18,weight:40,direction:'down',evidence:'نمونه فرضی: گزارش زمان خدمت'},{id:'g3',person:'p2',title:'میانگین زمان رسیدگی به پرونده',unit:'روز',target:5,actual:8,weight:60,direction:'down',evidence:'نمونه فرضی: گزارش پرونده‌های مختومه'},{id:'g4',person:'p2',title:'رضایت مراجعه‌کنندگان',unit:'از ۱۰۰',target:90,actual:79,weight:40,direction:'up',evidence:'نمونه فرضی: فرم بازخورد مشتری'},{id:'g5',person:'p3',title:'تمدید بیمه‌نامه‌های سررسیدشده',unit:'درصد',target:85,actual:80,weight:70,direction:'up',evidence:'نمونه فرضی: فهرست تمدید ماهانه'},{id:'g6',person:'p3',title:'پیگیری مستند مشتریان',unit:'مورد',target:50,actual:48,weight:30,direction:'up',evidence:'نمونه فرضی: دفتر پیگیری'},{id:'g7',person:'p4',title:'نسبت وصول مطالبات سررسیدشده',unit:'درصد',target:90,actual:null,weight:100,direction:'up',evidence:''}],actions:[{id:'a1',person:'p2',title:'مرور پنج پرونده معطل و رفع گلوگاه تأیید',due:'2026-10-25',done:false},{id:'a2',person:'p1',title:'تمرین چک‌لیست صدور با همکار باتجربه',due:'2026-10-28',done:false}],reviews:[{id:'r1',person:'p2',date:'2026-10-18',strength:'ارتباط محترمانه و پیگیری مسئولانه مشتری',barrier:'نقص مدارک و تأخیر در تأیید پرونده‌ها',support:'هماهنگی رئیس شعبه برای رفع گلوگاه تأیید'}]});
let data,storageOK=true;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):defaultData();if(!valid(data))throw Error('invalid')}catch(e){data=defaultData();storageOK=false}
let filter='',search='',toastTimer;
function valid(d){return d&&['people','goals','actions','reviews'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id))&&new Set(d[k].map(x=>x.id)).size===d[k].length)&&d.version===1&&typeof d.period==='string'&&typeof d.demo==='boolean'&&['people','goals','actions','reviews'].every(k=>Array.isArray(d[k]))&&d.people.every(p=>['id','name','role','branch'].every(k=>typeof p[k]==='string'))&&new Set(d.people.map(p=>p.id)).size===d.people.length&&d.goals.every(g=>typeof g.id==='string'&&typeof g.title==='string'&&typeof g.unit==='string'&&typeof g.evidence==='string'&&d.people.some(p=>p.id===g.person)&&Number.isFinite(g.target)&&g.target>0&&Number.isFinite(g.weight)&&g.weight>0&&(g.actual===null||(Number.isFinite(g.actual)&&g.actual>=0))&&['up','down'].includes(g.direction))&&d.actions.every(a=>typeof a.id==='string'&&typeof a.title==='string'&&typeof a.done==='boolean'&&/^\d{4}-\d{2}-\d{2}$/.test(a.due)&&d.people.some(p=>p.id===a.person))&&d.reviews.every(r=>['id','date','strength','barrier','support'].every(k=>typeof r[k]==='string')&&d.people.some(p=>p.id===r.person))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;toast('تغییرات ذخیره شد')}catch(e){storageOK=false;toast('ذخیره مرورگر ممکن نشد؛ همین حالا پشتیبان بگیرید.')}render()}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
function ratio(g){if(g.actual===null)return null;return Math.min(120,g.direction==='down'?(g.actual===0?120:100*g.target/g.actual):100*g.actual/g.target)}
function score(id){const gs=data.goals.filter(g=>g.person===id);if(!gs.length||gs.some(g=>g.actual===null))return null;return gs.reduce((s,g)=>s+ratio(g)*g.weight,0)/gs.reduce((s,g)=>s+g.weight,0)}
function status(s){return s===null?['ثبت‌نشده','neutral']:s>=100?['هدف محقق شده','']:s>=85?['در مسیر هدف','']:s>=70?['نیازمند پیگیری','warn']:['نیازمند حمایت','bad']}
function badge(s){const [t,c]=status(s);return `<span class="tag ${c}">${t}</span>`}
function surveyLink(p){return 'https://alborz-customer-feedback.hasanboudlaie.chatgpt.site/#employee='+encodeURIComponent(JSON.stringify({id:p.id,name:p.name,role:p.role,branch:p.branch}))}
function person(id){return data.people.find(p=>p.id===id)}
function selected(){return data.people.filter(p=>(!filter||p.branch===filter)&&(!search||[p.name,p.role,p.branch].some(t=>t.includes(search))))}
function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('fa-IR')}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function head(title,sub,button=''){return `<div class="topline"><div><div class="eyebrow">ALBORZ · PEOPLE & PERFORMANCE</div><h1>${title}</h1><p class="muted">${sub}</p></div><div>${button}</div></div>`}
function nav(v){location.hash=v}
function toolbar(){return `<div class="toolbar"><input id="search" aria-label="جست‌وجوی کارکنان" placeholder="جست‌وجوی نام یا نقش…" value="${esc(search)}"><select id="branch" aria-label="فیلتر شعبه"><option value="">همه شعب</option>${[...new Set(data.people.map(p=>p.branch))].map(b=>`<option ${filter===b?'selected':''}>${esc(b)}</option>`).join('')}</select><span class="tag neutral">دوره: ${esc(data.period)}</span></div>`}
function table(ps){return ps.length?`<div class="table-wrap"><table><thead><tr><th>همکار / نقش</th><th>شعبه</th><th>تحقق هدف</th><th>وضعیت</th><th></th></tr></thead><tbody>${ps.map(p=>{const s=score(p.id);return `<tr><td><div class="person"><span class="avatar">${esc(p.name.slice(0,1))}</span><div><strong>${esc(p.name)}</strong><br><small>${esc(p.role)}</small></div></div></td><td>${esc(p.branch)}</td><td><b>${s===null?'—':fa(s)+'٪'}</b><div class="progress"><i style="width:${Math.min(100,s??0)}%"></i></div></td><td>${badge(s)}</td><td><button class="small" data-open="${p.id}">پرونده ←</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">هنوز همکاری در این فهرست نیست.<br>با «افزودن همکار» شروع کنید.</div>'}
function actionList(items){return items.length?items.map(a=>`<div class="list-item"><div class="row"><label class="person"><input type="checkbox" data-check="${a.id}" ${a.done?'checked':''}><span style="${a.done?'text-decoration:line-through':''}">${esc(a.title)}</span></label><button class="small" data-edit-action="${a.id}">ویرایش</button></div><p>${esc(person(a.person)?.name)} · سررسید ${dateText(a.due)} ${!a.done&&a.due<today()?'<span class="tag bad">سررسید گذشته</span>':''}</p></div>`).join(''):'<div class="empty">اقدام بازی وجود ندارد؛ برنامه بعدی را با همکار توافق کنید.</div>'}
function render(){let route=location.hash.slice(1)||'dashboard';const parts=route.split('/');const page=parts[0];document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===(page==='person'?'people':page);b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});let html='';
if(page==='dashboard'){const ps=selected(),ss=ps.map(p=>score(p.id)).filter(s=>s!==null),avg=ss.length?ss.reduce((a,b)=>a+b,0)/ss.length:null,items=data.actions.filter(a=>!a.done&&ps.some(p=>p.id===a.person)).sort((a,b)=>a.due.localeCompare(b.due));html=head('هر همکار، یک مسیر روشن.','نمای سریع عملکرد و اولویت‌های پیگیری',`<button class="primary" id="addPerson">＋ افزودن همکار</button>`)+`<section class="hero"><div><small style="color:#86d6e4">از ارزیابی تا توسعه</small><h2>هدف روشن. بازخورد سازنده. پیشرفت مستمر.</h2><p>نتیجه‌ها را ببینید، موانع را بشنوید و برای قدم بعدی با همکاران توافق کنید.</p><button class="primary" data-nav="people">بررسی عملکرد کارکنان ←</button></div><div class="orbit"><div><strong>${avg===null?'—':fa(avg)+'٪'}</strong><small>میانگین تحقق</small></div></div></section>`+toolbar()+`<div class="metrics"><div class="metric"><span>کارکنان در این نما</span><strong>${fa(ps.length)}</strong><small>${fa(ss.length)} ارزیابی کامل</small></div><div class="metric"><span>میانگین تحقق اهداف</span><strong class="accent">${avg===null?'—':fa(avg)+'٪'}</strong><small>فقط پرونده‌های کامل</small></div><div class="metric"><span>نیازمند پیگیری و حمایت</span><strong>${fa(ss.filter(s=>s<85).length)}</strong><small>تحقق کمتر از ۸۵٪</small></div><div class="metric"><span>اقدام‌های باز</span><strong>${fa(items.length)}</strong><small>تعهدهای در حال پیگیری</small></div></div><div class="columns"><section class="panel"><div class="row"><h2>نبض عملکرد تیم</h2><button class="small" data-nav="people">مشاهده همه</button></div>${table(ps)}</section><section class="panel"><h2>قدم‌های بعدی</h2>${actionList(items.slice(0,4))}</section></div>`}

function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>nav('person/'+b.dataset.open));$('#addPerson')?.addEventListener('click',()=>editPerson());$('#editPerson')?.addEventListener('click',e=>editPerson(e.currentTarget.dataset.id));$('#addGoal')?.addEventListener('click',e=>editGoal(null,e.currentTarget.dataset.id));document.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>editGoal(b.dataset.editGoal));$('#addAction')?.addEventListener('click',e=>editAction(null,e.currentTarget.dataset.id));document.querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=()=>editAction(b.dataset.editAction));$('#addReview')?.addEventListener('click',e=>editReview(null,e.currentTarget.dataset.id));document.querySelectorAll('[data-edit-review]').forEach(b=>b.onclick=()=>editReview(b.dataset.editReview));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{data.actions.find(a=>a.id===b.dataset.check).done=b.checked;save()});$('#branch')?.addEventListener('change',e=>{filter=e.target.value;render()});$('#search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});$('#print')?.addEventListener('click',()=>window.print());$('#csv')?.addEventListener('click',exportCSV);$('#backup')?.addEventListener('click',()=>download('alborz-performance-backup.json',JSON.stringify(data,null,2),'application/json'));$('#restore')?.addEventListener('click',()=>$('#importFile').click());$('#savePeriod')?.addEventListener('click',()=>{const t=$('#period').value.trim();if(t){data.period=t;save()}});$('#fresh')?.addEventListener('click',()=>{if(confirm('پیش از ادامه پشتیبان بگیرید. فهرست جاری از این مرورگر حذف و فضای خالی جایگزین شود؟')){data={version:1,demo:false,period:data.period,people:[],goals:[],actions:[],reviews:[]};filter='';search='';save();nav('people')}});$('#demo')?.addEventListener('click',()=>{if(confirm('اطلاعات فعلی با داده‌های نمونه جایگزین شود؟ ابتدا پشتیبان بگیرید.')){data=defaultData();filter='';search='';save()}})}
function field(label,name,val='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`}
function textarea(label,name,val='',required=false){return `<label class="wide">${label}<textarea name="${name}" maxlength="2000" ${required?'required':''}>${esc(val)}</textarea></label>`}
function peopleSelect(id){return `<label>همکار مسئول<select name="person" required>${data.people.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} · ${esc(p.branch)}</option>`).join('')}</select></label>`}
function showForm(title,fields,submit,remove){const f=$('#form');f.innerHTML=`<h2>${title}</h2><div class="fields">${fields}</div><div class="actions"><button class="primary" type="submit">ذخیره</button><button type="button" id="cancel">انصراف</button>${remove?'<button type="button" class="danger" id="delete">حذف</button>':''}</div>`;f.onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(f));for(const k in vals)vals[k]=vals[k].trim();if(!submit(vals))return;$('#modal').close();save()};$('#cancel').onclick=()=>$('#modal').close();if(remove)$('#delete').onclick=()=>{if(confirm('این مورد حذف شود؟')){remove();$('#modal').close();save()}};$('#modal').showModal()}
function editPerson(id){const p=person(id)||{};showForm(id?'ویرایش همکار':'افزودن همکار',field('نام یا کد همکار','name',p.name,'text','required maxlength="80"')+field('نقش شغلی','role',p.role,'text','required maxlength="80"')+field('نام شعبه','branch',p.branch,'text','required maxlength="80"'),v=>{if(!v.name||!v.role||!v.branch)return false;if(id)Object.assign(p,v);else data.people.push({...v,id:uid()});return true},id?()=>{data.people=data.people.filter(x=>x.id!==id);['goals','actions','reviews'].forEach(k=>data[k]=data[k].filter(x=>x.person!==id));nav('people')}:null)}
function editGoal(id,pid){const g=data.goals.find(x=>x.id===id)||{person:pid,weight:100,direction:'up'};showForm(id?'ثبت نتیجه / ویرایش هدف':'تعریف هدف قابل سنجش',field('عنوان شاخص','title',g.title,'text','required maxlength="120"')+field('واحد (درصد، روز، مورد…)','unit',g.unit,'text','required maxlength="30"')+field('هدف مورد توافق','target',g.target,'number','required min="0.000001" step="any"')+field('نتیجه واقعی؛ خالی = ثبت‌نشده','actual',g.actual??'','number','min="0" step="any"')+field('وزن نسبی اهمیت','weight',g.weight,'number','required min="0.000001" step="any"')+`<label>جهت مطلوب<select name="direction"><option value="up">بیشتر بهتر ↑</option><option value="down" ${g.direction==='down'?'selected':''}>کمتر بهتر ↓</option></select></label>`+textarea('شواهد / منبع نتیجه','evidence',g.evidence),v=>{if(!v.title||!v.unit)return false;v.target=Number(v.target);v.weight=Number(v.weight);v.actual=v.actual===''?null:Number(v.actual);if(!(v.target>0&&v.weight>0)||![v.target,v.weight,v.actual??0].every(Number.isFinite))return false;if(id)Object.assign(g,v);else data.goals.push({...v,id:uid(),person:pid});return true},id?()=>data.goals=data.goals.filter(x=>x.id!==id):null)}
function editAction(id,pid){if(!data.people.length){toast('ابتدا یک همکار اضافه کنید.');return}const a=data.actions.find(x=>x.id===id)||{person:pid,due:today()};showForm(id?'ویرایش اقدام':'توافق بر قدم بعدی',peopleSelect(a.person)+field('موعد انجام (تقویم میلادی)','due',a.due,'date','required')+textarea('اقدام مشخص و قابل پیگیری','title',a.title,true),v=>{if(!v.title)return false;if(id)Object.assign(a,v);else data.actions.push({...v,id:uid(),done:false});return true},id?()=>data.actions=data.actions.filter(x=>x.id!==id):null)}
function editReview(id,pid){const r=data.reviews.find(x=>x.id===id)||{date:today()};showForm('گفت‌وگوی عملکرد',field('تاریخ گفت‌وگو (میلادی)','date',r.date,'date','required')+textarea('چه چیزی خوب پیش رفت؟','strength',r.strength,true)+textarea('چه مانع یا نیاز به بهبودی وجود دارد؟','barrier',r.barrier,true)+textarea('چه حمایتی از سوی مدیر توافق شد؟','support',r.support,true),v=>{if(!v.strength||!v.barrier||!v.support)return false;if(id)Object.assign(r,v);else data.reviews.push({...v,id:uid(),person:pid});return true},id?()=>data.reviews=data.reviews.filter(x=>x.id!==id):null)}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){const rows=[['دوره','نام','نقش','شعبه','شاخص','واحد','جهت','هدف','نتیجه','وزن','تحقق شاخص (%)','امتیاز فرد (%)','شواهد']];for(const p of selected()){const gs=data.goals.filter(g=>g.person===p.id);for(const g of gs.length?gs:[{}])rows.push([data.period,p.name,p.role,p.branch,g.title??'',g.unit??'',g.direction?g.direction==='up'?'بیشتر بهتر':'کمتر بهتر':'',g.target??'',g.actual??'',g.weight??'',g.id&&ratio(g)!==null?ratio(g).toFixed(1):'',score(p.id)?.toFixed(1)??'',g.evidence??''])}const q=v=>'"'+String(typeof v==='string'&&/^[=+@\-\t\r]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"';download('alborz-performance.csv','\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error();const d=JSON.parse(await file.text());if(!valid(d))throw Error();if(confirm('اطلاعات فایل جایگزین اطلاعات جاری شود؟')){data=d;search='';filter='';save()}}catch(err){toast('فایل معتبر نیست؛ یک پشتیبان سالم همین سامانه انتخاب کنید.')}e.target.value=''};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
