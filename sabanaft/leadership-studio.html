;});s.decisionDrafts[c.id]=cleanDraft;}});if(window.SabaDailyReflection)window.SabaDailyReflection.restore(s,x);if(window.SabaLightFlow)window.SabaLightFlow.restore(s,x);if(window.SabaCommercialUX)window.SabaCommercialUX.restore(s,x);if(window.SabaImpactPulse)window.SabaImpactPulse.restore(s,x);if(window.SabaRoleDevelopment)window.SabaRoleDevelopment.restore(s,x);if(window.SabaRoleCommunication)window.SabaRoleCommunication.restore(s,x);if(window.SabaGuidedReflection)window.SabaGuidedReflection.restore(s,x);return s;}catch(e){return blank();}}

ryIssues','چالش‌های مرتبط دیگر (اختیاری)',c.secondaryIssues||'','text',true,'اگر چند چالش مرتبط‌اند، به انتخاب خودتان بنویسید')+field('case-intent','نتیجه مطلوب شما',c.intent||'','textarea',true,'چه نتیجه‌ای باید به دست آید، جدا از این‌که چه کسی تصمیم بگیرد؟')+'</div></details></div><div class="form-actions"><button type="submit" class="btn">ذخیره و بازکردن کیس</button><button type="button" class="btn light" data-cancel-case>بازگشت به فهرست</button></div></form>'}

 try{raw=localStorage.getItem(handoffKey);if(!raw)return;p=JSON.parse(raw);}
 catch(e){return;}

 state.cases.unshift(c);
 if(save()){
  try{localStorage.removeItem(handoffKey);}catch(e){}
  editorId=id;roleDraft='';goto('workbench');
  toast('کیس جدید ثبت شد؛ اکنون می‌توانید آن را تکمیل و بررسی کنید.');
 }else{state.cases.shift();toast('ذخیره انجام نشد. از داده‌ها نسخه پشتیبان تهیه کنید.');}
}
