<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><title>بوم فرهنگی کودک</title><style>body{font:16px/1.9 Tahoma,Arial;background:#f4f7f4;color:#163d32;margin:0}main{max-width:650px;margin:auto;padding:14px}.card{background:white;border:1px solid #dce8df;border-radius:16px;padding:17px;margin:12px 0}h1{font-size:1.35rem}h2{font-size:1.05rem}label{display:block;padding:7px 0}input[type=checkbox]{width:20px;height:20px;accent-color:#176047}textarea,input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #b9d0c3;border-radius:10px;font:inherit}textarea{min-height:76px}button{background:#176047;color:white;border:0;padding:12px;border-radius:10px;font:inherit;margin:5px}.head{background:#164b3e;color:white;border-radius:15px;padding:20px}.head a{color:white}small{color:#63776d}</style><main><div class="head"><a href="./studio.html">← بازگشت به اپ</a><h1>کسب‌وکار فرهنگی کودک و توانمندسازی والدین</h1><p>۱۰ سؤال انتخابی و یک سؤال باز برای هر موضوع؛ ذخیره خودکار روی همین گوشی</p></div><div class="card">نام تکمیل‌کننده<input id="person" type="text" placeholder="اختیاری">نام ایده<input id="venture" type="text" placeholder="نام کسب‌وکار"></div><div id="questions"></div><div class="card"><h2>خروجی پاسخ‌ها</h2><small>پاسخ‌ها روی همین دستگاه ذخیره می‌شوند و فقط با ارسال شما در اختیار مشاور قرار می‌گیرند.</small><p><button id="wa">ارسال با واتساپ</button><button id="copy">کپی پاسخ‌ها</button><button id="download">دانلود فایل</button></p><p id="status"></p></div></main><script>const Q=[["هدف کسب‌وکار",["محصول فرهنگی کودک","توانمندسازی والدین","بازی تربیتی","ترکیبی"],"چه تغییری می‌خواهید ایجاد کنید؟"],["مخاطبان",["والدین ۳ تا ۶ سال","والدین ۷ تا ۱۲ سال","مربیان","مدارس و مراکز فرهنگی"],"مشتری ایده‌آل کیست؟"],["محور تربیتی",["ارزش‌های اسلامی","هویت ایرانی","اخلاق و مهارت زندگی","ارتباط والد و کودک"],"کدام ارزش‌ها و چرا؟"],["محصول",["کتاب و قصه","بازی و ابزار","بسته فعالیت","کارگاه والدین","محتوای دیجیتال"],"یک نمونه محصول شرح دهید."],["مسئله مشتری",["روش تربیت نامشخص","کمبود وقت","نبود محصول معتبر","انتقال ارزش‌ها","ارتباط با کودک"],"چه شاهدی برای این نیاز دارید؟"],["مدل درآمد",["تک‌محصول","بسته","اشتراک","دوره","قرارداد سازمانی"],"چه قیمتی مناسب است؟"],["کانال فروش",["فروشگاه آنلاین","شبکه اجتماعی","مدارس","کتاب‌فروشی"],"۲۰ مشتری اول را چگونه پیدا می‌کنید؟"],["منابع موجود",["ایده","محتوا","نمونه محصول","تیم","سرمایه","شبکه مدارس"],"چه تخصص یا شریکی دارید؟"],["سرمایه اولیه",["زیر ۱۰۰ میلیون","۱۰۰ تا ۵۰۰ میلیون","۵۰۰ میلیون تا یک میلیارد","بیش از یک میلیارد","نامشخص"],"هزینه‌های اصلی چیست؟"],["شیوه شروع",["آزمایش محدود","فروش آنلاین","همکاری با مدارس","راه‌اندازی کامل","نامشخص"],"هدف ۹۰ روز اول چیست؟"]],K='bmc-child-culture-v1',root=document.getElementById('questions');Q.forEach((q,i)=>{let s=document.createElement('section');s.className='card';s.innerHTML='<h2>'+(i+1)+'. '+q[0]+'</h2>';q[1].forEach(o=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.name='q'+i;c.value=o;l.append(c,document.createTextNode(' '+o));s.append(l)});let p=document.createElement('p');p.textContent='پرسش باز: '+q[2];s.append(p);let t=document.createElement('textarea');t.name='note'+i;t.placeholder='توضیح شما (اختیاری)';s.append(t);root.append(s)});function data(){return{person:person.value,venture:venture.value,answers:Q.map((q,i)=>({q:q[0],choices:[...document.querySelectorAll('[name=q'+i+']:checked')].map(x=>x.value),open:q[2],note:document.querySelector('[name=note'+i+']').value}))}}function save(){localStorage.setItem(K,JSON.stringify(data()))}try{let d=JSON.parse(localStorage.getItem(K)||'null');if(d){person.value=d.person||'';venture.value=d.venture||'';d.answers.forEach((a,i)=>{document.querySelectorAll('[name=q'+i+']').forEach(c=>c.checked=a.choices.includes(c.value));document.querySelector('[name=note'+i+']').value=a.note})}}catch(e){}document.addEventListener('input',save);document.addEventListener('change',save);function report(){let d=data();return 'بوم فرهنگی کودک\nنام: '+d.person+'\nایده: '+d.venture+'\n\n'+d.answers.map((a,i)=>(i+1)+'. '+a.q+'\nانتخاب‌ها: '+a.choices.join('، ')+'\n'+a.open+'\n'+a.note).join('\n\n')}wa.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(report()),'_blank');copy.onclick=async()=>{await navigator.clipboard.writeText(report());document.getElementById('status').textContent='کپی شد'};download.onclick=()=>{let b=new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='child-culture-bmc.txt';a.click()};</script></html>
