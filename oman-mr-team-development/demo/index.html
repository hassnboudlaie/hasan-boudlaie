 var m=byid(active);
 return '<span class="eyebrow">REFLECTION & MENTORING</span><h1>کوچ همراه یادگیری</h1><p class="sub">این بخش فعلاً یک راهنمای بازتابی با پرسش‌های ازپیش‌طراحی‌شده است؛ نه چت هوشمند زنده. هدف، تقویت قضاوت حرفه‌ای و مالکیت اقدام است.</p>'+
 '<div class="grid-2" style="margin-top:22px"><section class="panel"><div class="panel-head"><h3>از کدام موقعیت شروع کنیم؟</h3></div><label for="coachModule" class="subheading">انتخاب مهارت</label><select id="coachModule" style="width:100%;border:1px solid #d7e6dc;border-radius:12px;padding:11px;background:#fff;color:var(--ink);margin-bottom:19px">'+modules.map(function(x){return '<option value="'+x.id+'" '+(m.id===x.id?'selected':'')+'>'+x.title+'</option>';}).join('')+'</select><div class="coach-questions">'+[
'وقتی به این موقعیت فکر می‌کنی، چه چیزی بیش از همه برایت اهمیت دارد؟',
'ممکن است چه فرضی را بدون بررسی پذیرفته باشی؟',
'اگر بخواهی گفت‌وگو را دوباره پیش ببری، چه چیزی را متفاوت انجام می‌دهی؟',
'کوچک‌ترین اقدام قابل مشاهده در تعامل بعدی چیست؟'
].map(function(q){return '<button class="question-chip" data-coachquestion="'+esc(q)+'">'+q+' ←</button>';}).join('')+'</div></section>'+
 '<section class="panel"><span class="eyebrow">YOUR REFLECTION</span><h3>یادداشت بازتابی</h3><p class="sub">'+m.reflection+'</p><textarea class="textbox" id="coachEntry" style="margin-top:15px" placeholder="مشاهده، فرض و تصمیم خود را بنویس...">'+esc(data.coachNotes[m.id]||'')+'</textarea><div class="foot-actions"><span class="tiny">ذخیره محلی و شخصی</span><button class="btn btn-primary" data-action="save-coach">ثبت بازتاب</button></div><div class="coach-output"><strong style="font-size:13px">یک پرسش برای قدم بعدی</strong><p>از تجربه‌ات چه چیزی می‌توانی برداشت کنی که دفعه بعد به نتیجه متفاوتی منجر شود؟</p></div></section></div>'+
 '<div class="info-note">در نسخه عملیاتی، کوچ هوشمند می‌تواند با رضایت کاربر و با الزامات حریم خصوصی اضافه شود. در این نسخه هیچ محتوای خصوصی برای مدل هوش مصنوعی ارسال نمی‌شود.</div>';
}
function progress(){
 var count=doneCount();
 return '<span class="eyebrow">LEARNING EVIDENCE</span><h1>کارنامه و مسیر رشد</h1><p class="sub">پیشرفت این صفحه فقط از فعالیت‌های انجام‌شده در مرورگر فعلی محاسبه می‌شود؛ داده واقعی تیم یا مهارت‌سنجی کارکنان نیست.</p>'+
 '<div class="grid-2" style="margin-top:23px"><section class="panel"><div class="panel-head"><h3>پیشرفت تمرین‌های دمو</h3><span class="tiny">۶ ماژول</span></div><div class="ring" style="--pct:'+pct()+'%"><div class="ring-inner"><strong>'+pct()+'٪</strong><small>'+count+' از ۶ مسیر</small></div></div><div class="progress-shell"><div class="progress-fill" style="width:'+pct()+'%"></div></div><p class="tiny" style="margin:12px 0 0">نشان فقط بعد از پایان سناریو، رول‌پلی، درسنامه و ثبت اقدام صادر می‌شود.</p></section>'+
 '<section class="panel"><div class="panel-head"><h3>اقدام‌های میدانی</h3></div>'+
 (modules.filter(function(x){return data.missions[x.id];}).length?modules.filter(function(x){return data.missions[x.id];}).map(function(m){return '<div class="note-tile" style="margin-bottom:11px"><strong>'+m.title+'</strong><p>'+esc(data.missions[m.id])+'</p><label style="font-size:12px;margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" data-missiondone="'+m.id+'" '+(data.missionDone[m.id]?'checked':'')+'> در محیط کار اجرا کردم (خوداظهاری)</label></div>';}).join(''):'<div class="empty">هنوز اقدام عملی ثبت نشده است. پس از انجام یک تمرین و تعریف مأموریت، اینجا نمایش داده می‌شود.</div>')+'</section></div>'+
 '<div class="section-head"><h2>نشان‌های یادگیری</h2></div><div class="module-grid">'+modules.map(function(m){return '<div class="badgecard"><div class="badgeicon">'+(data.completed[m.id]?'✦':'◇')+'</div><div style="flex:1"><strong>'+m.title+'</strong><small>'+(data.completed[m.id]?'نشان تمرین دریافت شده · آماده اجرا در کار':'هنوز قفل است · پس از تکمیل تمرین فعال می‌شود')+'</small></div><button class="text-link" data-practice="'+m.id+'">'+(data.completed[m.id]?'مرور':'شروع')+'</button></div>';}).join('')+'</div>';
}
function about(){
 return '<span class="eyebrow">PRODUCT BLUEPRINT</span><h1>منطق طراحی سامانه</h1><p class="sub">«مسیر» یک نمونه اولیه از سامانه توسعه عملکرد مبتنی بر تجربه است؛ محصول نهایی باید با داده کارکنان، بازخورد مدیر و شاخص‌های واقعی فروش اعتبارسنجی شود.</p>'+
 '<div class="module-grid" style="margin-top:22px">'+[
 ['۱ · معماری یادگیری','تجربه موقعیت واقعی ← تصمیم ← بازخورد ← تمرین نقش ← بازتاب ← اقدام در کار؛ با الهام از چرخه تجربی Kolb.'],
 ['۲ · محتوای بومی','سناریوهای املاک عمان، سرمایه‌گذاران بین‌المللی، مذاکره درباره قیمت و بازده، هماهنگی پرونده‌ها و تفاوت‌های فرهنگی.'],
 ['۳ · طراحی دوره','۶ مسیر آزمایشی؛ ۲ تا ۳ تمرین کوتاه در هفته، هرکدام حدود ۱۵ دقیقه. نقش‌محور برای فروش و مدیریت.'],
 ['۴ · راهبری و شواهد','در نسخه عملیاتی: ثبت دسترسی کارکنان، ارزیابی قبل و بعد، بازخورد مدیر و بررسی ارتباط مهارت با Conversion و Follow-up.'],
 ['۵ · تکنولوژی','این دمو بدون ورود، سرور آموزشی و AI زنده اجرا می‌شود. پیشرفت نمایشی روی دستگاه ذخیره می‌شود.'],
 ['۶ · حریم خصوصی','پاسخ‌های پرسشنامه مدیر و داده‌های خصوصی تیم در این سایت عمومی بارگذاری نشده‌اند.']
 ].map(function(x){return '<article class="panel"><h3>'+x[0]+'</h3><p class="sub">'+x[1]+'</p></article>';}).join('')+'</div>'+
 '<div class="section-head"><h2>هویت بصری اولیه</h2></div><div class="panel"><div style="display:flex;gap:11px;flex-wrap:wrap;margin-bottom:18px">'+[['#102d35','سرمه‌ای عمیق'],['#137b72','سبز یشمی'],['#d7a55e','طلایی گرم'],['#faf9f5','کرم روشن']].map(function(x){return '<div style="flex:1;min-width:120px"><div style="height:51px;border-radius:11px;background:'+x[0]+';border:1px solid #ddd"></div><strong style="font-size:12px">'+x[1]+'</strong><div class="tiny" dir="ltr">'+x[0]+'</div></div>';}).join('')+'</div><p class="sub">فونت: Vazirmatn؛ راست‌چین کامل؛ تیترها ۲۰ تا ۴۳ پیکسل، متن خوانا ۱۳ تا ۱۶ پیکسل؛ دکمه‌ها حداقل ۴۴ پیکسل؛ ناوبری مستقل موبایل و دسکتاپ.</p></div>'+
 '<div class="info-note"><strong>راهنمای آزمایش:</strong> برای بررسی عملی، وارد «مسیرها» شو؛ یک مهارت را انتخاب کن، تصمیم‌ها را بگیر، رول‌پلی را بنویس، درسنامه را مرور کن و مأموریت واقعی تعریف کن.</div><button class="btn btn-outline" data-action="reset-demo">پاک‌کردن پیشرفت آزمایشی این دستگاه</button>';
}
function render(){
 document.getElementById('navDesktop').innerHTML=navHtml();document.getElementById('navMobile').innerHTML=navHtml();
 document.getElementById('advisorBtn').className=role==='advisor'?'selected':'';
 document.getElementById('leaderBtn').className=role==='leader'?'selected':'';
 document.getElementById('topTitle').textContent=labels[page][0];
 var main=document.getElementById('appMain');main.innerHTML=page==='home'?home():page==='paths'?paths():page==='practice'?practice():page==='coach'?coach():page==='progress'?progress():about();
}
document.addEventListener('click',function(e){
 var target=e.target.closest('[data-page],[data-practice],[data-role],[data-choice],[data-action],[data-coachquestion]');
 if(!target)return;
 if(target.dataset.role){role=target.dataset.role;persist();render();return;}
 if(target.dataset.page){go(target.dataset.page);return;}
 if(target.dataset.practice){go('practice',target.dataset.practice);return;}
 if(target.dataset.choice!==undefined&&page==='practice'&&phase==='decision'&&!feedback){
  selection=Number(target.dataset.choice);feedback=true;render();return;
 }
 if(target.dataset.coachquestion){
  var t=document.getElementById('coachEntry');if(t){t.value=(t.value?t.value+'\n\n':'')+target.dataset.coachquestion+'\n';t.focus();}return;
 }
 var action=target.dataset.action;if(!action)return;
 if(action==='hint'){help=!help;render();return;}
 if(action==='next-decision'){if(idx<byid(active).steps.length-1){idx++;selection=null;feedback=false;}else{phase='speech';}render();return;}
 if(action==='back-decision'){phase='decision';idx=byid(active).steps.length-1;selection=null;feedback=false;render();return;}
 if(action==='save-speech'){var s=document.getElementById('speechBox');if(s){data.notes[active]=s.value.trim();persist();}if(!data.notes[active]){toast('ابتدا پاسخ خودت را بنویس.');return;}speechDone=true;render();return;}
 if(action==='to-speech'){phase='speech';speechDone=true;render();return;}
 if(action==='to-learn'){phase='learn';render();return;}
 if(action==='to-commit'){phase='commit';render();return;}
 if(action==='finish'){
  var r=document.getElementById('reflectBox'),m=document.getElementById('missionBox');
  if(r)data.coachNotes[active]=r.value.trim();if(m)data.missions[active]=m.value.trim();
  if(!data.missions[active]){toast('یک اقدام مشخص برای محیط کار بنویس.');return;}
  data.completed[active]=true;persist();phase='completed';render();toast('نشان مهارت ثبت شد.');return;
 }
 if(action==='save-coach'){var c=document.getElementById('coachEntry');if(c){data.coachNotes[active]=c.value;persist();toast('بازتاب روی همین دستگاه ذخیره شد.');}return;}
 if(action==='reset-demo'){if(confirm('پیشرفت، یادداشت‌ها و نشان‌های ذخیره‌شده در این مرورگر پاک شوند؟')){data={completed:{},notes:{},missions:{},missionDone:{},coachNotes:{}};persist();go('home');toast('پیشرفت آزمایشی پاک شد.');}return;}
});
document.addEventListener('change',function(e){
 if(e.target.id==='coachModule'){active=e.target.value;render();}
 if(e.target.dataset.missiondone){data.missionDone[e.target.dataset.missiondone]=e.target.checked;persist();toast(e.target.checked?'اجرای مأموریت به‌صورت خوداظهاری ثبت شد.':'وضعیت مأموریت به‌روز شد.');}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pathrow[role=button]')){e.preventDefault();go('practice',e.target.dataset.practice);}});
render();
})();
</script>
</body></html>
