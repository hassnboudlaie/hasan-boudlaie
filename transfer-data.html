<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>انتقال داده‌های مرورگر</title><style>body{font:17px/2 Tahoma;background:#f5f7f8;color:#183a47;padding:24px}main{max-width:560px;margin:auto;background:white;padding:28px;border-radius:14px}button,a{font:inherit;display:block;margin:16px 0;padding:10px;border:1px solid #ccdce1;border-radius:8px;background:#edf3f4;color:#264f5d}p{color:#607b87}</style></head><body><main><h1>انتقال داده‌های قبلی</h1><p>داده‌های اپلیکیشن‌ها از همین مرورگر به پنل خصوصی منتقل می‌شوند. رمزها و کلیدهای دسترسی منتقل نمی‌شوند.</p><button id="transfer">انتقال مستقیم به پنل خصوصی</button><button id="download">دریافت فایل انتقال</button><p id="status" role="status"></p></main><script>const target="https://hasan-private-apps.hasanboudlaie.chatgpt.site";function payload(){const entries={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&!/token|password|secret|credential|auth|session/i.test(key))entries[key]=localStorage.getItem(key);}return{type:'hb-local-data',entries};}document.getElementById('transfer').onclick=()=>{if(!window.opener){document.getElementById('status').textContent='فایل انتقال را دریافت و در تنظیمات پنل خصوصی بارگذاری کنید.';return;}window.opener.postMessage(payload(),target);document.getElementById('status').textContent='درخواست انتقال به پنل خصوصی ارسال شد.';};document.getElementById('download').onclick=()=>{const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(payload())],{type:'application/json'}));link.download='hasan-apps-browser-data.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);document.getElementById('status').textContent='فایل را در تنظیمات پنل خصوصی بارگذاری کنید.';};</script></body></html>
