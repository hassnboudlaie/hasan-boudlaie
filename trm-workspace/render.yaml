# Optional Render Blueprint; requires account billing setup before creation.
# For a business-critical deployment, choose a persistent paid PostgreSQL plan,
# backups, privacy review, and an uptime SLA instead of using temporary free services.
services:
  - type: web
    name: trm-workspace-hb-2026
    runtime: python
    branch: trm-workspace-standalone-2026
    region: frankfurt
    plan: free
    buildCommand: pip install -r trm-workspace/requirements.txt && python trm-workspace/icon_gen.py
    startCommand: cd trm-workspace && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COOKIE_SECURE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: trm-workspace-db-hb-2026
          property: connectionString
databases:
  - name: trm-workspace-db-hb-2026
    region: frankfurt
    plan: free